      summary: List the acting person's messages in one mail folder
      tags: [staff-mail]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: folder, in: path, required: true, description: Named mail folder, schema: { type: string, enum: [inbox, sent, drafts, archive, trash] } }
      responses:
        '200':
          description: Messages in the requested folder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailMessageList' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /api/v1/staff/mail/messages/{id}:
    get:
      operationId: getMailMessage
      summary: Read one message visible to the acting person
      tags: [staff-mail]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: id, in: path, required: true, description: Tenant-local message identifier, schema: { type: string } }
      responses:
        '200':
          description: The message with the reader's folder placement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailView' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /api/v1/staff/mail/threads:
    get:
      operationId: listMailThreads
      summary: List the acting person's threads grouped by subject and reference
      tags: [staff-mail]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Threads visible to the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailThreadList' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /api/v1/scheduling/visit-types:
    post:
      operationId: createVisitType
      summary: Define a tenant-local visit type and its appointment duration
      tags: [scheduling-administration]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/RetryKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulingVisitTypeRequest' }
      responses:
        '201':
          description: Visit type defined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulingVisitType' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /api/v1/scheduling/resources:
    post:
      operationId: createSchedulingResource
      summary: Define a protected clinician or room resource in a facility
      tags: [scheduling-administration]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/RetryKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulingResourceRequest' }
      responses:
        '201':
          description: Resource defined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulingResource' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
    get:
      operationId: listSchedulingResources
      summary: List the protected resources of one facility
      tags: [scheduling-administration]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: facilityCode, in: query, required: true, description: Tenant-local facility code, schema: { type: string } }
      responses:
        '200':
          description: Resources visible in the active tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulingResourceList' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /api/v1/scheduling/resources/{code}/availability:
    post:
      operationId: addResourceAvailability
      summary: Add one weekly availability window to a protected resource
      tags: [scheduling-administration]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/RetryKey'
        - { name: code, in: path, required: true, description: Tenant-local resource code, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulingAvailabilityRequest' }
      responses:
        '201':
          description: Weekly window added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulingAvailability' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /api/v1/delivery/audit:
    get:
      operationId: deliveryAuditTrail
      summary: Read the tenant's append-only delivery audit trail
      tags: [audit]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Delivery audit facts in insertion order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryAuditList' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /api/v1/patient/access/audit:
    get:
      operationId: patientAccessAuditTrail
      summary: Read the tenant's append-only patient-access audit trail
      tags: [audit]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Access audit facts in insertion order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessAuditList' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /api/v1/messaging-governance/audit:
    get:
      operationId: messagingGovernanceAuditTrail
      summary: Read the tenant's append-only messaging-governance audit trail
      tags: [audit]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: resourceId, in: query, required: false, description: Optional exact resource filter, schema: { type: string } }
      responses:
        '200':
          description: Governance audit facts in insertion order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagingAuditList' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
components:
  parameters:
    ActiveOrganization:
      name: X-Active-Organization
      in: header
      required: true
      description: Explicit active organization UUID; membership is verified server-side.
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Generated and echoed when absent.
      schema: { type: string }
    Subject:
      name: subject
      in: path
      required: true
      description: Tenant-local synthetic staff subject.
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$' }
    ConfigKey:
      name: key
      in: path
      required: true
      description: Tenant-local configuration key.
      schema: { type: string, pattern: '^[a-z][a-z0-9._-]{2,63}$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Version of the draft the caller last read; weak and quoted validators are accepted.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque key that makes a retried placement produce a single order.
      schema: { type: string, minLength: 1, maxLength: 255 }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Reserved retry-correlation header for draft commands; durable deduplication applies to placement.
      schema: { type: string, minLength: 1, maxLength: 255 }
    RetryKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Opaque client retry key for state-changing commands; the owning service applies replay safety where the command supports it.
      schema: { type: string, minLength: 1, maxLength: 255 }
  responses:
    Forbidden:
      description: No active membership or missing action permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthenticationRequired:
      description: Authentication required before a protected route is reached
    InvalidRequest:
      description: Invalid body, path or query parameter, or tenant selection
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ResourceNotFound:
      description: Resource not found or inaccessible; existence is concealed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StateConflict:
      description: The command conflicts with the current state of the resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StaleVersion:
      description: The resource changed since the caller read its version
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConfirmationNeeded:
      description: The command requires explicit client confirmation before publication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    CreateFacility:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]{2,32}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
    Facility:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    FacilityPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Facility' }
        nextCursor: { type: string, nullable: true }
    InviteStaff:
      type: object
      required: [subject, displayName, role]
      additionalProperties: false
      description: Organization, grantor and effective dates are derived server-side, never accepted here.
      properties:
        subject: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        role: { type: string, enum: [tenant_admin, reception, privacy_auditor] }
    StaffMember:
      type: object
      properties:
        subject: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [active, deactivated] }
        roles:
          type: array
          items: { type: string }
    StaffPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StaffMember' }
        nextCursor: { type: string, nullable: true }
    StaffHistory:
      type: object
      properties:
        subject: { type: string }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipEvent' }
        roleGrants:
          type: array
          items: { $ref: '#/components/schemas/RoleGrant' }
    MembershipEvent:
      type: object
      description: Immutable; deactivation appends a revoked event.
      properties:
        id: { type: string }
        status: { type: string, enum: [active, revoked] }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    RoleGrant:
      type: object
      description: Immutable; grantor and effective dates are recorded at grant time.
      properties:
        id: { type: string }
        roleKey: { type: string }
        grantedBy: { type: string, format: uuid }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time, nullable: true }
    CreateConfiguration:
      type: object
      required: [key, value]
      additionalProperties: false
      description: Organization, version and author are derived server-side, never accepted here.
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9._-]{2,63}$' }
        value: { type: string, minLength: 1, maxLength: 4000 }
        effectiveFrom: { type: string, format: date-time, description: UTC instant; defaults to approval time }
    ApproveConfiguration:
      type: object
      additionalProperties: false
      description: The approver identity is derived from the authenticated actor.
      properties:
        note: { type: string }
    ConfigEntry:
      type: object
      properties:
        key: { type: string }
        version: { type: integer }
        value: { type: string }
        status: { type: string, enum: [pending, approved] }
        effectiveFrom: { type: string, format: date-time }
        createdBy: { type: string, format: uuid, nullable: true }
        approvedBy: { type: string, format: uuid, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
    ConfigHistory:
      type: object
      properties:
        key: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/ConfigEntry' }
    DefineCatalogEntry:
      type: object
      required: [code, value]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{1,63}$' }
        value: { type: string, minLength: 1, maxLength: 4000 }
        effectiveFrom: { type: string, format: date-time }
    CatalogEntry:
      type: object
      properties:
        family: { type: string }
        code: { type: string }
        version: { type: integer }
        value: { type: string }
        effectiveFrom: { type: string, format: date-time }
        approvedBy: { type: string, format: uuid }
        approvedAt: { type: string, format: date-time }
        note: { type: string, nullable: true }
    AuditEvent:
      type: object
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        actorId: { type: string, format: uuid, nullable: true }
        action: { type: string }
        resourceType: { type: string, nullable: true }
        resourceId: { type: string, nullable: true }
        purpose: { type: string, nullable: true }
        scope: { type: string, nullable: true }
        correlationId: { type: string, nullable: true }
        outcome: { type: string }
        seq: { type: integer, format: int64 }
    AuditPage:
      type: object
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextCursor: { type: string, nullable: true }
    Appointment:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        patientId: { type: string, format: uuid }
        facilityCode: { type: string }
        clinicianCode: { type: string }
        roomCode: { type: string, nullable: true }
        visitType: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        state: { type: string, enum: [held, booked, checked_in, in_progress, completed, cancelled, no_show, expired] }
        seriesId: { type: string, format: uuid, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        overrideReason: { type: string, nullable: true }
    AppointmentEvent:
      type: object
      description: Immutable history entry bound to one appointment revision.
      properties:
        id: { type: string, format: uuid }
        appointmentVersion: { type: integer }
        action: { type: string }
        fromState: { type: string, nullable: true }
        toState: { type: string }
        reason: { type: string, nullable: true }
        previousStartsAt: { type: string, format: date-time, nullable: true }
        previousEndsAt: { type: string, format: date-time, nullable: true }
        actorId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    AppointmentView:
      type: object
      properties:
        appointment: { $ref: '#/components/schemas/Appointment' }
        history:
          type: array
          items: { $ref: '#/components/schemas/AppointmentEvent' }
    AppointmentPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AppointmentView' }
        nextCursor: { type: string, nullable: true }
    OrderView:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        patientId: { type: string, format: uuid }
        encounterRef: { type: string }
        orderCode: { type: string }
        priority: { type: string, enum: [routine, urgent, stat] }
        clinicalQuestion: { type: string }
        destinationOrg: { type: string, format: uuid }
        sourceActor: { type: string }
        responsibleClinician: { type: string }
        workQueue: { type: string }
        authorizationId: { type: string, format: uuid }
        snapshotId: { type: string, format: uuid }
        snapshotFingerprint: { type: string, format: uuid }
        disclosureId: { type: string, format: uuid }
        workItemId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    LabAccession:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        accessionNo: { type: string }
        accessionIssuer: { type: string }
        patientId: { type: string, format: uuid }
        sourceOrderRef: { type: string }
        state: { type: string, enum: [accessioned, collected, received, rejected, recollected] }
        specimenType: { type: string, nullable: true }
        siteCode: { type: string, nullable: true }
        collector: { type: string, nullable: true }
        collectedAt: { type: string, format: date-time, nullable: true }
        receivedAt: { type: string, format: date-time, nullable: true }
        quality: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }
        rejectionNotification: { type: string, nullable: true }
        replacesAccessionId: { type: string, format: uuid, nullable: true }
    AccessionEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        accessionId: { type: string, format: uuid }
        accessionVersion: { type: integer }
        action: { type: string, enum: [accessioned, collected, received, rejected, recollected] }
        fromState: { type: string, nullable: true }
        toState: { type: string }
        reason: { type: string, nullable: true }
        matchedPatientId: { type: string, format: uuid, nullable: true }
        occurredAt: { type: string, format: date-time }
    AccessionView:
      type: object
      properties:
        accession: { $ref: '#/components/schemas/LabAccession' }
        events:
          type: array
          items: { $ref: '#/components/schemas/AccessionEvent' }
    AccessionPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AccessionView' }
        nextCursor: { type: string, nullable: true }
    OrderPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderView' }
        nextCursor: { type: string, nullable: true }
    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        patientId: { type: string, format: uuid }
        currency: { type: string }
        state: { type: string, enum: [draft, issued, partially_paid, paid, void] }
        totalMinor: { type: integer, format: int64 }
        paidMinor: { type: integer, format: int64 }
        refundedMinor: { type: integer, format: int64 }
        creditedMinor: { type: integer, format: int64 }
        balanceMinor: { type: integer, format: int64 }
        serviceReference: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        issuedAt: { type: string, format: date-time, nullable: true }
        voidReason: { type: string, nullable: true }
        voidedBySubject: { type: string, nullable: true }
    InvoiceItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        lineNo: { type: integer }
        description: { type: string }
        quantity: { type: integer }
        unitAmountMinor: { type: integer, format: int64 }
        amountMinor: { type: integer, format: int64 }
    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        invoiceVersion: { type: integer }
        type: { type: string, enum: [payment, refund, credit] }
        amountMinor: { type: integer, format: int64 }
        currency: { type: string }
        reference: { type: string }
        reason: { type: string, nullable: true }
        approverSubject: { type: string, nullable: true }
        receiptNo: { type: integer, format: int64 }
        actorId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    InvoiceView:
      type: object
      properties:
        invoice: { $ref: '#/components/schemas/Invoice' }
        items:
          type: array
          items: { $ref: '#/components/schemas/InvoiceItem' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }
    InvoicePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InvoiceView' }
        nextCursor: { type: string, nullable: true }
    DeliveryMode:
      type: string
      enum: [ELECTRONIC, PRINT, BOTH]
      description: Send electronically to the partner, print for the patient to carry, or both.
    OrderSelection:
      type: object
      required: [itemId, version]
      additionalProperties: false
      properties:
        itemId: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1 }
    PlacedOrderRequest:
      type: object
      required: [patientId, encounterId, facilityId, items, clinicalQuestion, priority, destinationPartnerId, deliveryMode]
      additionalProperties: false
      properties:
        patientId: { type: string, minLength: 1 }
        encounterId: { type: string, minLength: 1 }
        facilityId: { type: string, minLength: 1 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderSelection' }
        clinicalQuestion: { type: string, minLength: 1 }
        priority: { type: string, enum: [routine, urgent, stat] }
        preparationInstructions: { type: string, nullable: true }
        destinationPartnerId: { type: string, minLength: 1 }
        deliveryMode: { $ref: '#/components/schemas/DeliveryMode' }
    OrderDraft:
      type: object
      properties:
        organizationId: { type: string }
        id: { type: string }
        version: { type: integer }
        request: { $ref: '#/components/schemas/PlacedOrderRequest' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    PlacedOrder:
      type: object
      properties:
        organizationId: { type: string }
        id: { type: string }
        draftId: { type: string }
        version: { type: integer }
        request: { $ref: '#/components/schemas/PlacedOrderRequest' }
        payload: { type: string }
        placedBy: { type: string }
        placedAt: { type: string, format: date-time }
        idempotencyKey: { type: string }
    CreateInvoiceRequest:
      type: object
      required: [patientId, currency, items]
      description: Itemized self-pay invoice creation command; money is an integer count of currency minor units.
      properties:
        patientId: { type: string, format: uuid }
        currency: { type: string, minLength: 3, maxLength: 3 }
        serviceReference: { type: string, nullable: true }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/InvoiceLineRequest' }
    InvoiceLineRequest:
      type: object
      required: [description, quantity, unitAmountMinor]
      properties:
        description: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1 }
        unitAmountMinor: { type: integer, format: int64, minimum: 0 }
    EntryRequest:
      type: object
