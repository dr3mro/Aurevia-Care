        id: { type: string }
        version: { type: integer, minimum: 1 }
        patientId: { type: string }
        patientSubject: { type: string }
        unitKey: { type: string, enum: [clinic, lab, radiology, pt, pharmacy] }
        connectionId: { type: string }
        topic: { type: string, nullable: true }
        state: { type: string, enum: [awaiting_staff, awaiting_patient, resolved, closed] }
