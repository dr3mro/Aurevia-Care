        replacement: { $ref: '#/components/schemas/DrugEntry' }
        reason: { type: string, enum: [stock, brand, formulation] }
        approvedBy: { type: string }
        allergyCheck: { $ref: '#/components/schemas/AllergyCheck' }
        attestation: { type: string }
        catalogProvenance: { type: string }
        signedAt: { type: string, format: date-time }
    ProposalView:
      type: object
      description: Review-only side-by-side proposal with its optional signed revision.
