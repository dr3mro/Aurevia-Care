        proposedBy: { type: string }
        original: { $ref: '#/components/schemas/DrugEntry' }
        proposed: { $ref: '#/components/schemas/DrugEntry' }
        reason: { type: string, enum: [stock, brand, formulation] }
        note: { type: string, nullable: true }
