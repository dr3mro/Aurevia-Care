        group: { type: string, nullable: true }
        groupVersion: { type: integer }
        detail: { type: string }
    AllergyCheck:
      type: object
      description: Versioned allergy check; an unresolved or unverified assessment is never silently safe.
      properties:
        outcome: { type: string, enum: [no_conflict, conflict, warning, unresolved] }
        allergyStatus: { type: string, enum: [verified_list, verified_none, unknown, unverified] }
        findings:
          type: array
          items: { $ref: '#/components/schemas/AllergyFinding' }
        catalogVersion: { type: string }
    SelectMedicationRequest:
      type: object
      required: [catalogEntryId, doseValue, doseUnit, route, frequency, quantity, quantityUnit, instructions]
      description: Medication selection with an override reason required when a verified conflict exists.
      properties:
        catalogEntryId: { type: string, minLength: 1 }
        doseValue: { type: string, minLength: 1 }
        doseUnit: { type: string, minLength: 1 }
        route: { type: string, minLength: 1 }
        frequency: { type: string, minLength: 1 }
        quantity: { type: string, minLength: 1 }
        quantityUnit: { type: string, minLength: 1 }
        refills: { type: integer, nullable: true }
        instructions: { type: string, minLength: 1 }
        overrideReason: { type: string, nullable: true }
    Ingredient:
      type: object
      properties:
        substanceId: { type: string, nullable: true }
        group: { type: string, nullable: true }
        groupVersion: { type: integer }
    DrugEntry:
      type: object
      description: One approved effective catalog entry; suggestions never change a clinician's selection.
      properties:
        entryId: { type: string }
        version: { type: integer }
        genericName: { type: string }
        tradeName: { type: string }
        formulation: { type: string }
        strengthValue: { type: string }
        strengthUnit: { type: string }
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/Ingredient' }
        approved: { type: boolean }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        approvalProvenance: { type: string }
    Alternative:
      type: object
      description: Review-only tagged alternative with its source catalog version.
      properties:
        kind: { type: string, enum: [suggestion] }
        entry: { $ref: '#/components/schemas/DrugEntry' }
        reason: { type: string }
        sourceCatalogVersion: { type: string }
        requiresClinicianSelection: { type: boolean }
    CatalogHit:
      type: object
      properties:
        entry: { $ref: '#/components/schemas/DrugEntry' }
        alternatives:
          type: array
          items: { $ref: '#/components/schemas/Alternative' }
    DrugCatalogHits:
      type: array
      description: Effective catalog entries with tagged alternatives; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/CatalogHit' }
    MedicationCatalogVersion:
      type: object
      properties:
        version: { type: integer }
        market: { type: string }
        publishedAt: { type: string, format: date-time }
        provenance: { type: string }
    MedicationCatalogItem:
      type: object
      properties:
        drug: { $ref: '#/components/schemas/DrugEntry' }
        route: { type: string }
    VersionedCatalogSearch:
      type: object
      description: Catalog hits paired with the publication version that produced them.
      properties:
        version: { $ref: '#/components/schemas/MedicationCatalogVersion' }
        items:
          type: array
          items: { $ref: '#/components/schemas/MedicationCatalogItem' }
    CreatePrescriptionRequest:
      type: object
      required: [prescriptionId, patientId, medication, prescriberSubject]
      description: Transmission registration for an RX-01 draft; the local id is supplied by the caller.
      properties:
        prescriptionId: { type: string, minLength: 1 }
        patientId: { type: string, minLength: 1 }
        medication: { type: string }
        strength: { type: string, nullable: true }
        dose: { type: string, nullable: true }
        route: { type: string, nullable: true }
        frequency: { type: string, nullable: true }
        quantity: { type: integer, nullable: true }
        prescriberSubject: { type: string }
        destinationPharmacy: { type: string, nullable: true }
    Prescription:
      type: object
      properties:
        id: { type: string }
        version: { type: integer }
        patientId: { type: string }
        medication: { type: string }
        strength: { type: string, nullable: true }
        dose: { type: string, nullable: true }
        route: { type: string, nullable: true }
        frequency: { type: string, nullable: true }
        quantity: { type: integer }
        prescriberSubject: { type: string }
        destinationPharmacy: { type: string, nullable: true }
        state: { type: string, enum: [draft, attested, submitted, ambiguous, delivery_confirmed, accepted, rejected, clarification, dispensed, printed, cancelled] }
        channel: { type: string, nullable: true }
        submissionId: { type: string, nullable: true }
        retryAllowed: { type: boolean }
        createdAt: { type: string, format: date-time }
    PrescriptionEvent:
      type: object
      description: Immutable transmission fact; acceptance and dispensing are deliberately distinct.
      properties:
        id: { type: string }
        prescriptionId: { type: string }
        prescriptionVersion: { type: integer }
        eventType: { type: string, enum: [attested, submitted, delivery_confirmed, partner_status_verified, printed, pharmacy_accepted, pharmacy_rejected, clarification, renewal, cancelled, dispensing_evidence] }
        actorId: { type: string, nullable: true }
        channel: { type: string, nullable: true }
        submissionId: { type: string, nullable: true }
        outcome: { type: string, nullable: true }
        detail: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
    PrescriptionView:
      type: object
      properties:
        prescription: { $ref: '#/components/schemas/Prescription' }
        events:
          type: array
          items: { $ref: '#/components/schemas/PrescriptionEvent' }
    PrintablePrescription:
      type: object
      description: Locally printed prescription carrying the attestation; no electronic delivery is implied.
      properties:
        prescriptionId: { type: string }
        patientId: { type: string }
        medication: { type: string }
        strength: { type: string, nullable: true }
        dose: { type: string, nullable: true }
        route: { type: string, nullable: true }
        frequency: { type: string, nullable: true }
        quantity: { type: integer }
        prescriberSubject: { type: string }
        destinationPharmacy: { type: string, nullable: true }
        attestationNote: { type: string, nullable: true }
        attestedAt: { type: string, format: date-time }
        channel: { type: string }
    AttestRequest:
      type: object
      properties:
        note: { type: string, nullable: true }
    TransmitRequest:
      type: object
      required: [channel]
      properties:
        channel: { type: string, minLength: 1 }
