        destination: { type: string, nullable: true }
    Draft:
      type: object
      description: Current projection of a prescription draft.
      properties:
        id: { type: string }
        version: { type: integer }
        patientId: { type: string }
        state: { type: string }
        selectedEntryId: { type: string, nullable: true }
        selectedEntryVersion: { type: integer, nullable: true }
        drugGenericName: { type: string, nullable: true }
        doseValue: { type: string, nullable: true }
        doseUnit: { type: string, nullable: true }
        route: { type: string, nullable: true }
        frequency: { type: string, nullable: true }
        quantity: { type: string, nullable: true }
        quantityUnit: { type: string, nullable: true }
        refills: { type: integer, nullable: true }
        instructions: { type: string, nullable: true }
        destination: { type: string, nullable: true }
        encounterReference: { type: string, nullable: true }
        prescriberSubject: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    OverrideRecord:
      type: object
