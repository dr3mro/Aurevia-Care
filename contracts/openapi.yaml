        patientId: { type: string }
        patientSubject: { type: string }
        unitKey: { type: string, enum: [clinic, lab, radiology, pt, pharmacy] }
        connectionId: { type: string }
        topic: { type: string, nullable: true }
    ConversationReplyRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1 }
    ConversationAssignRequest:
      type: object
      required: [assigneeSubject, reason]
      additionalProperties: false
      properties:
        assigneeSubject: { type: string }
        reason: { type: string }
    ConversationTransferRequest:
      type: object
      required: [toSubject, reason]
      additionalProperties: false
      properties:
        toSubject: { type: string }
        reason: { type: string }
    ConversationResolveRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string }
    ConversationCloseRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string }
    InstantOpenDirectRequest:
      type: object
      required: [facilityId, peerSubject]
      additionalProperties: false
      properties:
        facilityId: { type: string }
        peerSubject: { type: string }
    InstantCreateGroupRequest:
