openapi: 3.0.3
info:
  title: SmartClinic Staff API
  version: 0.1.0
  description: G0 tenant-isolated facility administration and staff lifecycle. Synthetic use only.
servers:
  - url: http://localhost:8081
paths:
  /api/v1/facilities/{code}:
    get:
      operationId: getFacility
      summary: Read a facility in the active organization
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The facility in the active tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facility' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found or inaccessible; existence is concealed }
  /api/v1/facilities:
    get:
      operationId: listFacilities
      summary: List facilities in the active organization with cursor pagination
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: cursor, in: query, required: false, description: Opaque code:id cursor for the next page, schema: { type: string } }
        - { name: limit, in: query, required: false, description: Page size 1-200, default 50, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: One page of facilities ordered by code ascending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilityPage' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid cursor, limit or tenant selection }
    post:
      operationId: createFacility
      summary: Create a facility in the active organization
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFacility' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
            X-Correlation-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facility' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Facility code already exists in this tenant }
        '422': { description: Invalid body, correlation id or tenant selection }
  /api/v1/configuration:
    post:
      operationId: createConfiguration
      summary: Append a draft version of a tenant configuration key
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConfiguration' }
      responses:
        '201':
          description: Draft appended; version and author are derived server-side
          headers:
            Location: { schema: { type: string } }
            X-Correlation-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Configuration version already exists }
        '422': { description: Invalid key, value, effective date or tenant selection }
  /api/v1/configuration/{key}:
    get:
      operationId: getEffectiveConfiguration
      summary: Read the single approved version in force for a key
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ConfigKey'
      responses:
        '200':
          description: The effective approved version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No effective version; existence is concealed }
  /api/v1/configuration/{key}/versions/{version}/approve:
    post:
      operationId: approveConfiguration
      summary: Append a named approval; the approver is derived from the actor
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ConfigKey'
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveConfiguration' }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Key or version not visible; existence is concealed }
        '409': { description: Version already approved }
  /api/v1/configuration/{key}/history:
    get:
      operationId: getConfigurationHistory
      summary: Read the append-only version and approval history
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ConfigKey'
      responses:
        '200':
          description: All versions with approval facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigHistory' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Key not visible; existence is concealed }
  /api/v1/catalogs/{family}:
    get:
      operationId: listCatalogFamily
      summary: List effective approved entries in a tenant catalog family
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: family, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,31}$' } }
      responses:
        '200':
          description: Effective catalog entries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CatalogEntry' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/catalogs/{family}/entries/{code}:
    get:
      operationId: getCatalogEntry
      summary: Read the effective approved version of one catalog entry
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: family, in: path, required: true, schema: { type: string } }
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The effective catalog entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found, not effective or concealed }
  /api/v1/catalogs/{family}/entries:
    post:
      operationId: defineCatalogEntry
      summary: Append a pending catalog entry version
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: family, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefineCatalogEntry' }
      responses:
        '200':
          description: Pending draft appended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid family, code, value or effective date }
  /api/v1/catalogs/{family}/entries/{code}/versions/{version}/approve:
    post:
      operationId: approveCatalogEntry
      summary: Append a named approval for a catalog entry version
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: family, in: path, required: true, schema: { type: string } }
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveConfiguration' }
      responses:
        '200':
          description: Approved entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Entry not found or concealed }
  /api/v1/audit-events:
    get:
      operationId: queryAuditEvents
      summary: Query the active tenant's append-only audit trail
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: cursor, in: query, required: false, description: Opaque seq cursor for the next page, schema: { type: string } }
        - { name: limit, in: query, required: false, description: Page size 1-200, default 50, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: action, in: query, required: false, schema: { type: string } }
        - { name: outcome, in: query, required: false, schema: { type: string } }
        - { name: resourceType, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, description: Inclusive UTC instant, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, description: Inclusive UTC instant, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: One page of audit events; the query itself is audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid cursor, limit, filter or tenant selection }
  /api/v1/staff:
    get:
      operationId: listStaff
      summary: List staff members in the active organization with cursor pagination
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: cursor, in: query, required: false, description: Opaque subject:id cursor for the next page, schema: { type: string } }
        - { name: limit, in: query, required: false, description: Page size 1-200, default 50, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: status, in: query, required: false, description: Effective membership status filter, schema: { type: string, enum: [active, deactivated] } }
      responses:
        '200':
          description: One page of staff members ordered by subject ascending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffPage' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid cursor, limit, status or tenant selection }
    post:
      operationId: inviteStaff
      summary: Invite staff with one bounded role grant in the active organization
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteStaff' }
      responses:
        '201':
          description: Invited; membership and role grant appended, grantor derived from the actor
          headers:
            Location: { schema: { type: string } }
            X-Correlation-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMember' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Subject already exists in this tenant }
        '422': { description: Invalid subject, display name, role or tenant selection }
  /api/v1/staff/{subject}:
    get:
      operationId: getStaff
      summary: Read the effective staff projection in the active organization
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Subject'
      responses:
        '200':
          description: The visible staff member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMember' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found or inaccessible; existence is concealed }
  /api/v1/staff/{subject}/deactivate:
    post:
      operationId: deactivateStaff
      summary: Append a revoked membership event; deny the next protected request
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Subject'
      responses:
        '200':
          description: Deactivated; no existing history row was modified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMember' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found or inaccessible; existence is concealed }
        '409': { description: Staff member already deactivated }
  /api/v1/staff/{subject}/history:
    get:
      operationId: getStaffHistory
      summary: Read immutable membership and role-grant history
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Subject'
      responses:
        '200':
          description: Append-only history with grantors and effective dates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffHistory' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found or inaccessible; existence is concealed }
  /api/v1/appointments:
    get:
      operationId: listAppointments
      summary: List appointments by scheduled-start range with cursor pagination
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: cursor, in: query, required: false, description: Opaque startsAt:id cursor for the next page, schema: { type: string } }
        - { name: limit, in: query, required: false, description: Page size 1-200, default 50, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: from, in: query, required: true, description: Inclusive lower UTC instant, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, description: Inclusive upper UTC instant, at most 31 days after from, schema: { type: string, format: date-time } }
        - { name: resource, in: query, required: false, description: Clinician or room resource code, schema: { type: string } }
        - { name: state, in: query, required: false, description: Effective appointment state, schema: { type: string, enum: [held, booked, checked_in, in_progress, completed, cancelled, no_show, expired] } }
      responses:
        '200':
          description: One page of appointments ordered by scheduled start ascending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentPage' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid cursor, limit, range, resource, state or tenant selection }
  /api/v1/lab/accessions:
    get:
      operationId: listLabAccessions
      summary: List laboratory accessions in the active organization with cursor pagination
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: cursor, in: query, required: false, description: Opaque createdAt:id cursor for the next page, schema: { type: string } }
        - { name: limit, in: query, required: false, description: Page size 1-200, default 50, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: state, in: query, required: false, description: Exact accession lifecycle state filter, schema: { type: string, enum: [accessioned, collected, received, rejected, recollected] } }
      responses:
        '200':
          description: One page of accessions ordered by creation time descending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessionPage' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid cursor, limit, state or tenant selection }
  /api/v1/finance/invoices:
    get:
      operationId: listFinanceInvoices
      summary: List self-pay invoices in the active organization with cursor pagination
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: cursor, in: query, required: false, description: Opaque createdAt:id cursor for the next page, schema: { type: string } }
        - { name: limit, in: query, required: false, description: Page size 1-200, default 50, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: status, in: query, required: false, description: Exact invoice lifecycle state filter, schema: { type: string, enum: [draft, issued, partially_paid, paid, void] } }
        - { name: patientId, in: query, required: false, description: Owning patient identifier filter, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One page of invoices ordered by creation time descending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicePage' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid cursor, limit, status, patientId or tenant selection }
  /api/v1/orders:
    get:
      operationId: listOrders
      summary: List released orders in the active organization with cursor pagination
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: cursor, in: query, required: false, description: Opaque createdAt:id cursor for the next page, schema: { type: string } }
        - { name: limit, in: query, required: false, description: Page size 1-200, default 50, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: status, in: query, required: false, description: Projected work-item state filter, schema: { type: string, enum: [awaiting_local_patient, ready] } }
      responses:
        '200':
          description: One page of released orders ordered by creation time descending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid cursor, limit, status or tenant selection }
  /api/v1/order-entry/drafts:
    post:
      operationId: saveOrderDraft
      summary: Save an editable order draft from the chart in the active organization
      tags: [order-entry]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlacedOrderRequest' }
      responses:
        '201':
          description: Created draft at version one
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraft' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid order content or tenant selection }
  /api/v1/order-entry/drafts/{id}:
    put:
      operationId: editOrderDraft
      summary: Replace a draft's content under an If-Match version precondition
      tags: [order-entry]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - { name: id, in: path, required: true, description: Tenant-local draft identifier, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlacedOrderRequest' }
      responses:
        '200':
          description: The new immutable draft revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraft' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Draft not found or inaccessible; existence is concealed }
        '412': { description: Stale If-Match version }
        '422': { description: Invalid order content or tenant selection }
        '428': { description: If-Match precondition required }
  /api/v1/order-entry/drafts/{id}/place:
    post:
      operationId: placeOrder
      summary: Place a draft, storing its delivery mode; immutable and idempotent on retry
      tags: [order-entry]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: id, in: path, required: true, description: Tenant-local draft identifier, schema: { type: string } }
      responses:
        '200':
          description: The immutable placed order with its recorded delivery mode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacedOrder' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Draft not found or inaccessible; existence is concealed }
        '409': { description: Idempotency key belongs to a different order }
        '412': { description: Stale If-Match version }
        '428': { description: If-Match or Idempotency-Key precondition required }
  /api/v1/order-entry/orders/{id}:
    get:
      operationId: getPlacedOrder
      summary: Read one immutable placed order in the active organization
      tags: [order-entry]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: id, in: path, required: true, description: Tenant-local placed-order identifier, schema: { type: string } }
      responses:
        '200':
          description: The immutable placed order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacedOrder' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Order not found or inaccessible; existence is concealed }
  /api/v1/printing/handouts:
    post:
      operationId: printHandout
      summary: Render a versioned patient handout for one exact signed or placed source revision
      tags: [printing]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrintHandoutRequest' }
      responses:
        '201':
          description: Immutable handout metadata; the download path is returned in Location
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handout' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Source not found or inaccessible; existence is concealed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Source is not in a printable signed or placed state, or has no approved channel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Invalid reason, language or source selector
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/printing/handouts/download:
    post:
      operationId: downloadHandout
      summary: Download one immutable handout version after re-checking permission
      tags: [printing]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DownloadHandoutRequest' }
      responses:
        '200':
          description: Deterministic PDF bytes of the requested immutable version
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Source not found or inaccessible; existence is concealed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The requested version is stale; reload and request the current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Invalid reason, language, source selector or version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/staff/attachments/upload:
    post:
      operationId: uploadStaffAttachment
      summary: Upload a PDF, JPEG or PNG into private quarantine bound to one draft
      description: The Idempotency-Key header is correlation-only here; a retry creates a new attachment. Conflicts carry stable 409 codes.
      tags: [staff-messaging]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - { name: draftId, in: query, required: true, description: Conversation or mail draft that owns the attachment, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: The quarantined attachment; its independent scan verdict is still pending
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAttachment' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The attachment link write did not commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { description: Unsupported type, oversized payload, invalid file name, unreadable payload or invalid draft }
  /api/v1/staff/attachments/{id}/scan:
    post:
      operationId: scanStaffAttachment
      summary: Record an independent quarantine scan verdict for one attachment
      description: The Idempotency-Key header is correlation-only here; a second verdict on one file returns 409.
      tags: [staff-messaging]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - { name: id, in: path, required: true, description: Tenant-local attachment identifier, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanRequest' }
      responses:
        '200':
          description: The attachment with its recorded scan state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAttachment' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Attachment not found or inaccessible; existence is concealed }
        '409':
          description: Only a pending file can be scanned, or the attachment write did not commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { description: Missing or non-terminal verdict, invalid detail or tenant selection }
  /api/v1/staff/attachments/pending:
    get:
      operationId: listPendingStaffAttachments
      summary: List the pending unsent files of one draft for the sender to review
      tags: [staff-messaging]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: draftId, in: query, required: true, description: Conversation or mail draft whose pending files are listed, schema: { type: string } }
      responses:
        '200':
          description: Pending files in upload order; a named array, not a paginated list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingStaffAttachments' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid draft or tenant selection }
  /api/v1/staff/attachments/send:
    post:
      operationId: sendStaffAttachments
      summary: Publish named clean files to their confirmed recipients
      description: The Idempotency-Key header is correlation-only here; resending an already sent file returns 409.
      tags: [staff-messaging]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendRequest' }
      responses:
        '200':
          description: The published attachments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StaffAttachment' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Attachment, draft or message not found or inaccessible; existence is concealed }
        '409':
          description: A named file is quarantined or not clean, is already sent, or the attachment write did not commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { description: Unconfirmed or empty command, duplicate or missing ids, invalid recipients or identifiers }
  /api/v1/staff/attachments/{id}/download:
    get:
      operationId: downloadStaffAttachment
      summary: Return verified original bytes to an authorized message recipient
      tags: [staff-messaging]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: id, in: path, required: true, description: Tenant-local attachment identifier, schema: { type: string } }
      responses:
        '200':
          description: Original bytes with their integrity headers and original PDF, JPEG or PNG media type
          headers:
            X-Checksum: { description: SHA-256 checksum of the returned bytes, schema: { type: string } }
            Content-Length: { description: Byte length of the returned payload, schema: { type: integer, format: int64 } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Attachment not found or inaccessible; existence is concealed }
        '409':
          description: File is not sent and clean, or the private object is absent or failed integrity verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { description: Invalid attachment identifier or tenant selection }
components:
  parameters:
    ActiveOrganization:
      name: X-Active-Organization
      in: header
      required: true
      description: Explicit active organization UUID; membership is verified server-side.
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Generated and echoed when absent.
      schema: { type: string }
    Subject:
      name: subject
      in: path
      required: true
      description: Tenant-local synthetic staff subject.
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$' }
    ConfigKey:
      name: key
      in: path
      required: true
      description: Tenant-local configuration key.
      schema: { type: string, pattern: '^[a-z][a-z0-9._-]{2,63}$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Version of the draft the caller last read; weak and quoted validators are accepted.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque key that makes a retried placement produce a single order.
      schema: { type: string, minLength: 1, maxLength: 255 }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Reserved retry-correlation header for draft commands; durable deduplication applies to placement.
      schema: { type: string, minLength: 1, maxLength: 255 }
  responses:
    Forbidden:
      description: No active membership or missing action permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    CreateFacility:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]{2,32}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
    Facility:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    FacilityPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Facility' }
        nextCursor: { type: string, nullable: true }
    InviteStaff:
      type: object
      required: [subject, displayName, role]
      additionalProperties: false
      description: Organization, grantor and effective dates are derived server-side, never accepted here.
      properties:
        subject: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        role: { type: string, enum: [tenant_admin, reception, privacy_auditor] }
    StaffMember:
      type: object
      properties:
        subject: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [active, deactivated] }
        roles:
          type: array
          items: { type: string }
    StaffPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StaffMember' }
        nextCursor: { type: string, nullable: true }
    StaffHistory:
      type: object
      properties:
        subject: { type: string }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipEvent' }
        roleGrants:
          type: array
          items: { $ref: '#/components/schemas/RoleGrant' }
    MembershipEvent:
      type: object
      description: Immutable; deactivation appends a revoked event.
      properties:
        id: { type: string }
        status: { type: string, enum: [active, revoked] }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    RoleGrant:
      type: object
      description: Immutable; grantor and effective dates are recorded at grant time.
      properties:
        id: { type: string }
        roleKey: { type: string }
        grantedBy: { type: string, format: uuid }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time, nullable: true }
    CreateConfiguration:
      type: object
      required: [key, value]
      additionalProperties: false
      description: Organization, version and author are derived server-side, never accepted here.
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9._-]{2,63}$' }
        value: { type: string, minLength: 1, maxLength: 4000 }
        effectiveFrom: { type: string, format: date-time, description: UTC instant; defaults to approval time }
    ApproveConfiguration:
      type: object
      additionalProperties: false
      description: The approver identity is derived from the authenticated actor.
      properties:
        note: { type: string }
    ConfigEntry:
      type: object
      properties:
        key: { type: string }
        version: { type: integer }
        value: { type: string }
        status: { type: string, enum: [pending, approved] }
        effectiveFrom: { type: string, format: date-time }
        createdBy: { type: string, format: uuid, nullable: true }
        approvedBy: { type: string, format: uuid, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
    ConfigHistory:
      type: object
      properties:
        key: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/ConfigEntry' }
    DefineCatalogEntry:
      type: object
      required: [code, value]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{1,63}$' }
        value: { type: string, minLength: 1, maxLength: 4000 }
        effectiveFrom: { type: string, format: date-time }
    CatalogEntry:
      type: object
      properties:
        family: { type: string }
        code: { type: string }
        version: { type: integer }
        value: { type: string }
        effectiveFrom: { type: string, format: date-time }
        approvedBy: { type: string, format: uuid }
        approvedAt: { type: string, format: date-time }
        note: { type: string, nullable: true }
    AuditEvent:
      type: object
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        actorId: { type: string, format: uuid, nullable: true }
        action: { type: string }
        resourceType: { type: string, nullable: true }
        resourceId: { type: string, nullable: true }
        purpose: { type: string, nullable: true }
        scope: { type: string, nullable: true }
        correlationId: { type: string, nullable: true }
        outcome: { type: string }
        seq: { type: integer, format: int64 }
    AuditPage:
      type: object
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextCursor: { type: string, nullable: true }
    Appointment:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        patientId: { type: string, format: uuid }
        facilityCode: { type: string }
        clinicianCode: { type: string }
        roomCode: { type: string, nullable: true }
        visitType: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        state: { type: string, enum: [held, booked, checked_in, in_progress, completed, cancelled, no_show, expired] }
        seriesId: { type: string, format: uuid, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        overrideReason: { type: string, nullable: true }
    AppointmentEvent:
      type: object
      description: Immutable history entry bound to one appointment revision.
      properties:
        id: { type: string, format: uuid }
        appointmentVersion: { type: integer }
        action: { type: string }
        fromState: { type: string, nullable: true }
        toState: { type: string }
        reason: { type: string, nullable: true }
        previousStartsAt: { type: string, format: date-time, nullable: true }
        previousEndsAt: { type: string, format: date-time, nullable: true }
        actorId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    AppointmentView:
      type: object
      properties:
        appointment: { $ref: '#/components/schemas/Appointment' }
        history:
          type: array
          items: { $ref: '#/components/schemas/AppointmentEvent' }
    AppointmentPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AppointmentView' }
        nextCursor: { type: string, nullable: true }
    OrderView:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        patientId: { type: string, format: uuid }
        encounterRef: { type: string }
        orderCode: { type: string }
        priority: { type: string, enum: [routine, urgent, stat] }
        clinicalQuestion: { type: string }
        destinationOrg: { type: string, format: uuid }
        sourceActor: { type: string }
        responsibleClinician: { type: string }
        workQueue: { type: string }
        authorizationId: { type: string, format: uuid }
        snapshotId: { type: string, format: uuid }
        snapshotFingerprint: { type: string, format: uuid }
        disclosureId: { type: string, format: uuid }
        workItemId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    LabAccession:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        accessionNo: { type: string }
        accessionIssuer: { type: string }
        patientId: { type: string, format: uuid }
        sourceOrderRef: { type: string }
        state: { type: string, enum: [accessioned, collected, received, rejected, recollected] }
        specimenType: { type: string, nullable: true }
        siteCode: { type: string, nullable: true }
        collector: { type: string, nullable: true }
        collectedAt: { type: string, format: date-time, nullable: true }
        receivedAt: { type: string, format: date-time, nullable: true }
        quality: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }
        rejectionNotification: { type: string, nullable: true }
        replacesAccessionId: { type: string, format: uuid, nullable: true }
    AccessionEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        accessionId: { type: string, format: uuid }
        accessionVersion: { type: integer }
        action: { type: string, enum: [accessioned, collected, received, rejected, recollected] }
        fromState: { type: string, nullable: true }
        toState: { type: string }
        reason: { type: string, nullable: true }
        matchedPatientId: { type: string, format: uuid, nullable: true }
        occurredAt: { type: string, format: date-time }
    AccessionView:
      type: object
      properties:
        accession: { $ref: '#/components/schemas/LabAccession' }
        events:
          type: array
          items: { $ref: '#/components/schemas/AccessionEvent' }
    AccessionPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AccessionView' }
        nextCursor: { type: string, nullable: true }
    OrderPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderView' }
        nextCursor: { type: string, nullable: true }
    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        patientId: { type: string, format: uuid }
        currency: { type: string }
        state: { type: string, enum: [draft, issued, partially_paid, paid, void] }
        totalMinor: { type: integer, format: int64 }
        paidMinor: { type: integer, format: int64 }
        refundedMinor: { type: integer, format: int64 }
        creditedMinor: { type: integer, format: int64 }
        balanceMinor: { type: integer, format: int64 }
        serviceReference: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        issuedAt: { type: string, format: date-time, nullable: true }
        voidReason: { type: string, nullable: true }
        voidedBySubject: { type: string, nullable: true }
    InvoiceItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        lineNo: { type: integer }
        description: { type: string }
        quantity: { type: integer }
        unitAmountMinor: { type: integer, format: int64 }
        amountMinor: { type: integer, format: int64 }
    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        invoiceVersion: { type: integer }
        type: { type: string, enum: [payment, refund, credit] }
        amountMinor: { type: integer, format: int64 }
        currency: { type: string }
        reference: { type: string }
        reason: { type: string, nullable: true }
        approverSubject: { type: string, nullable: true }
        receiptNo: { type: integer, format: int64 }
        actorId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    InvoiceView:
      type: object
      properties:
        invoice: { $ref: '#/components/schemas/Invoice' }
        items:
          type: array
          items: { $ref: '#/components/schemas/InvoiceItem' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }
    InvoicePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InvoiceView' }
        nextCursor: { type: string, nullable: true }
    DeliveryMode:
      type: string
      enum: [ELECTRONIC, PRINT, BOTH]
      description: Send electronically to the partner, print for the patient to carry, or both.
    OrderSelection:
      type: object
      required: [itemId, version]
      additionalProperties: false
      properties:
        itemId: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1 }
    PlacedOrderRequest:
      type: object
      required: [patientId, encounterId, facilityId, items, clinicalQuestion, priority, destinationPartnerId, deliveryMode]
      additionalProperties: false
      properties:
        patientId: { type: string, minLength: 1 }
        encounterId: { type: string, minLength: 1 }
        facilityId: { type: string, minLength: 1 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderSelection' }
        clinicalQuestion: { type: string, minLength: 1 }
        priority: { type: string, enum: [routine, urgent, stat] }
        preparationInstructions: { type: string, nullable: true }
        destinationPartnerId: { type: string, minLength: 1 }
        deliveryMode: { $ref: '#/components/schemas/DeliveryMode' }
    OrderDraft:
      type: object
      properties:
        organizationId: { type: string }
        id: { type: string }
        version: { type: integer }
        request: { $ref: '#/components/schemas/PlacedOrderRequest' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    PlacedOrder:
      type: object
      properties:
        organizationId: { type: string }
        id: { type: string }
        draftId: { type: string }
        version: { type: integer }
        request: { $ref: '#/components/schemas/PlacedOrderRequest' }
        payload: { type: string }
        placedBy: { type: string }
        placedAt: { type: string, format: date-time }
        idempotencyKey: { type: string }
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
    PrintReason:
      type: string
      enum: [give_to_patient, referral, patient_request]
      description: Why a disclosure happened; recorded as the audit purpose, never the handout content.
    HandoutKind:
      type: string
      enum: [PRESCRIPTION, LAB_ORDER, IMAGING_ORDER, CHART_SUMMARY, SIGNED_REPORT]
      description: Stable kind of the patient handout.
    HandoutSource:
      type: object
      required: [organizationId, kind, sourceId, revisionVersion, contentChecksum, state]
      additionalProperties: false
      description: Exact committed source revision selected for a handout; the server validates its printable state and tenant.
      properties:
        organizationId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/HandoutKind' }
        sourceId: { type: string }
        revisionVersion: { type: integer, minimum: 1 }
        contentChecksum: { type: string, minLength: 64, maxLength: 64 }
        state: { type: string }
        attested: { type: boolean }
        printChannel: { type: string, nullable: true }
        patientId: { type: string }
        patientName: { type: string }
        clinician: { type: string }
        facility: { type: string }
        issueTime: { type: string, format: date-time }
        sourceSystem: { type: string }
        contentLines:
          type: array
          items: { type: string }
    PrintHandoutRequest:
      type: object
      required: [source, language, reason]
      additionalProperties: false
      properties:
        source: { $ref: '#/components/schemas/HandoutSource' }
        language: { type: string, enum: [en, ar] }
        reason: { $ref: '#/components/schemas/PrintReason' }
    DownloadHandoutRequest:
      type: object
      required: [source, language, reason, version]
      additionalProperties: false
      properties:
        source: { $ref: '#/components/schemas/HandoutSource' }
        language: { type: string, enum: [en, ar] }
        reason: { $ref: '#/components/schemas/PrintReason' }
        version: { type: integer, minimum: 1 }
    Handout:
      type: object
      description: Immutable rendering metadata; the PDF bytes are available only through the download path.
      properties:
        organizationId: { type: string, format: uuid }
        handoutId: { type: string }
        kind: { $ref: '#/components/schemas/HandoutKind' }
        sourceId: { type: string }
        sourceRevision: { type: integer }
        sourceChecksum: { type: string }
        version: { type: integer }
        language: { type: string }
        direction: { type: string }
        pageCount: { type: integer }
        byteSize: { type: integer, format: int64 }
        sha256: { type: string }
        provenance: { type: string }
        producedAt: { type: string, format: date-time }
        producedBy: { type: string }
    StaffAttachment:
      type: object
      description: Current projection of one quarantined or published staff-message attachment; bytes stay behind the download route.
      properties:
        organizationId: { type: string, format: uuid }
        id: { type: string }
        uploaderSubject: { type: string }
        draftId: { type: string }
        documentId: { type: string }
        fileName: { type: string }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        checksum: { type: string }
        objectKey: { type: string }
        objectVersion: { type: integer }
        scanState: { type: string, enum: [pending, clean, quarantined] }
        messageId: { type: string }
        sent: { type: boolean }
        createdAt: { type: string, format: date-time }
    PendingStaffAttachments:
      type: array
      description: Bounded set of unsent files of one draft; not a paginated list.
      items: { $ref: '#/components/schemas/StaffAttachment' }
    ScanRequest:
      type: object
      required: [verdict]
      additionalProperties: false
      description: Independent scanner verdict; a bounded detail explains a failed verdict to the sender without carrying file content or a pathogen name.
      properties:
        verdict: { type: string, enum: [clean, failed], description: Terminal scanner verdict; failed quarantines the file. Stored scan states are reported by StaffAttachment.scanState. }
        detail: { type: string, maxLength: 200 }
    SendRequest:
      type: object
      required: [draftId, messageId, attachmentIds, recipients, confirm]
      additionalProperties: false
      description: Explicit publication command; confirm must be true and every named file must be clean and owned by the sender.
      properties:
        draftId: { type: string }
