      properties:
        submissionId: { type: string, minLength: 1 }
        outcome: { type: string, enum: [submitted, ambiguous] }
    PharmacyResponseRequest:
      type: object
      required: [submissionId, outcome]
      properties:
        submissionId: { type: string, minLength: 1 }
        outcome: { type: string, enum: [accepted, rejected, clarification] }
        note: { type: string, nullable: true }
    DispensingRequest:
      type: object
      required: [submissionId]
      properties:
        submissionId: { type: string, minLength: 1 }
        note: { type: string, nullable: true }
    RenewRequest:
      type: object
      properties:
        note: { type: string, nullable: true }
