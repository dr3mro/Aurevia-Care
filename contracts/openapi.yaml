          description: The approved proposal and its signed revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalView' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '428':
          description: If-Match precondition required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/pharmacy/substitutions/{proposalId}/decline:
    post:
      operationId: declineSubstitution
