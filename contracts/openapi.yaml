        reason: { type: string, minLength: 1 }
        approverSubject: { type: string, minLength: 1 }
    DailyTotal:
      type: object
      properties:
        day: { type: string }
        currency: { type: string }
        issuedMinor: { type: integer, format: int64 }
        paymentMinor: { type: integer, format: int64 }
        refundMinor: { type: integer, format: int64 }
        creditMinor: { type: integer, format: int64 }
        netMinor: { type: integer, format: int64 }
        entryCount: { type: integer }
    Reconciliation:
      type: object
      description: Finance-only daily totals by currency; no clinical field is present.
      properties:
        days:
          type: array
          items: { $ref: '#/components/schemas/DailyTotal' }
    CreateDraftRequest:
