      properties:
        facilityId: { type: string }
        topic: { type: string, nullable: true }
        memberSubjects: { type: array, items: { type: string } }
    InstantAddParticipantRequest:
      type: object
      required: [facilityId, conversationId, subject]
      additionalProperties: false
      properties:
        facilityId: { type: string }
        conversationId: { type: string }
        subject: { type: string }
    InstantSendRequest:
      type: object
      required: [facilityId, conversationId, body]
      additionalProperties: false
      properties:
        facilityId: { type: string }
        conversationId: { type: string }
        body: { type: string, minLength: 1 }
    InstantMarkReadRequest:
      type: object
      required: [facilityId, conversationId, upToSequence]
      additionalProperties: false
      properties:
        facilityId: { type: string }
        conversationId: { type: string }
        upToSequence: { type: integer, minimum: 0, format: int64 }
    InstantConversation:
      type: object
      properties:
        id: { type: string }
        facilityId: { type: string }
        kind: { type: string }
        topic: { type: string, nullable: true }
        lastSequence: { type: integer, minimum: 0, format: int64 }
        unreadCount: { type: integer, minimum: 0, format: int64 }
    InstantMessage:
      type: object
      properties:
        id: { type: string }
        sequence: { type: integer, minimum: 1, format: int64 }
        senderSubject: { type: string }
        senderRole: { type: string }
        body: { type: string }
        sentAt: { type: string, format: date-time }
    InstantMessageList:
      type: array
      description: Ordered messages of one conversation; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/InstantMessage' }
    InstantUnread:
      type: object
      properties:
        conversationId: { type: string }
        unreadCount: { type: integer, minimum: 0, format: int64 }
    InstantUnreadList:
      type: array
      description: One unread count per conversation; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/InstantUnread' }
    InstantConversationList:
      type: array
      description: Conversations visible to the caller; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/InstantConversation' }
    RealtimeEventType:
      type: string
      description: Stable wire value of an identifier-only realtime event; never carries clinical content.
      enum: [message, read]
    RealtimeEvent:
      type: object
      description: Identifier-only notification about a change in a staff conversation.
      properties:
        id: { type: string, description: Stable identifier of the changed message or read cursor }
        sequence: { type: integer, format: int64, minimum: 1, description: Monotonic hub sequence used for resume }
        type: { $ref: '#/components/schemas/RealtimeEventType' }
        conversationId: { type: string, description: Owning conversation identifier }
        subject: { type: string, description: Acting staff subject, never a display name }
    RealtimeEventPage:
      type: object
      description: Bounded polling page of identifier-only events with the high-water cursor.
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/RealtimeEvent' }
        nextCursor: { type: integer, format: int64, description: Hub high-water sequence for the next poll }
    MailRecipient:
      type: object
      description: A visible recipient; blind copy is deliberately absent from the wire vocabulary.
      properties:
        kind: { type: string, enum: [person, role, unit_mailbox] }
        value: { type: string }
    MailComposeRequest:
      type: object
      description: Draft compose or save body; bcc is accepted only so the service can refuse it.
      properties:
        facilityId: { type: string }
        subject: { type: string }
        body: { type: string }
        to:
          type: array
          items: { $ref: '#/components/schemas/MailRecipient' }
        cc:
          type: array
          items: { $ref: '#/components/schemas/MailRecipient' }
        bcc: { type: array, items: { type: string } }
        attachmentDocumentIds: { type: array, items: { type: string } }
    MailSendRequest:
      type: object
      description: Publication requires the explicit recipient list the caller confirmed.
      properties:
        confirmedRecipients: { type: array, items: { type: string } }
    MailTextRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string }
    MailFolderRequest:
      type: object
      required: [folder]
      additionalProperties: false
      properties:
        folder: { type: string, enum: [inbox, sent, drafts, archive, trash] }
    MailFlagRequest:
      type: object
      required: [flag, enabled]
      additionalProperties: false
      properties:
        flag: { type: string }
        enabled: { type: boolean }
    MailDraft:
      type: object
      description: Private versioned draft owned by one subject; version is the save precondition.
      properties:
        organizationId: { type: string, format: uuid }
        id: { type: string }
        facilityId: { type: string }
        ownerSubject: { type: string }
        version: { type: integer, minimum: 1 }
        subject: { type: string }
        body: { type: string }
        to:
          type: array
          items: { $ref: '#/components/schemas/MailRecipient' }
        cc:
          type: array
          items: { $ref: '#/components/schemas/MailRecipient' }
        attachmentDocumentIds: { type: array, items: { type: string } }
        threadId: { type: string }
        updatedAt: { type: string, format: date-time }
    MailSentMessage:
      type: object
      description: Immutable published message with recipients resolved at send time.
      properties:
        organizationId: { type: string, format: uuid }
        id: { type: string }
        facilityId: { type: string }
        threadId: { type: string }
        subject: { type: string }
        body: { type: string }
        senderSubject: { type: string }
        senderRole: { type: string }
        sentAt: { type: string, format: date-time }
        to:
          type: array
          items: { $ref: '#/components/schemas/MailRecipient' }
        cc:
          type: array
          items: { $ref: '#/components/schemas/MailRecipient' }
        resolvedRecipients: { type: array, items: { type: string } }
        attachmentDocumentIds: { type: array, items: { type: string } }
        flags: { type: array, items: { type: string } }
    MailView:
      type: object
      description: One message with the per-viewer folder placement and shared message flags.
      properties:
        message: { $ref: '#/components/schemas/MailSentMessage' }
        viewerFolder: { type: string, enum: [inbox, sent, drafts, archive, trash] }
    MailThread:
      type: object
      properties:
        threadId: { type: string }
        subject: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/MailView' }
    MailMessageList:
      type: array
      description: Messages in one folder; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/MailView' }
    MailThreadList:
      type: array
      description: Threads visible to the caller; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/MailThread' }
    SchedulingVisitTypeRequest:
      type: object
      required: [code, durationMinutes]
      additionalProperties: false
      properties:
        code: { type: string }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
    SchedulingVisitType:
      type: object
      properties:
        code: { type: string }
        durationMinutes: { type: integer, minimum: 1 }
    SchedulingResourceRequest:
      type: object
      required: [facilityCode, kind, code, displayName]
      additionalProperties: false
      properties:
        facilityCode: { type: string }
        kind: { type: string, enum: [clinician, room] }
        code: { type: string }
        displayName: { type: string }
    SchedulingResource:
      type: object
      properties:
        id: { type: string }
        facilityCode: { type: string }
        kind: { type: string, enum: [clinician, room] }
        code: { type: string }
        displayName: { type: string }
    SchedulingResourceList:
      type: array
      description: Protected resources of one facility; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/SchedulingResource' }
    SchedulingAvailabilityRequest:
      type: object
      required: [weekday, startLocal, endLocal]
      additionalProperties: false
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: ISO-8601 day of week, 1 is Monday. }
        startLocal: { type: string, description: Local wall-clock start of the window. }
        endLocal: { type: string, description: Local wall-clock end of the window. }
    SchedulingAvailability:
      type: object
      properties:
        facilityCode: { type: string }
        resourceCode: { type: string }
        weekday: { type: integer, minimum: 1, maximum: 7 }
        startLocal: { type: string }
        endLocal: { type: string }
    DeliveryAuditEntry:
      type: object
      description: Append-only delivery fact; correlation id ties it to the originating event.
      properties:
        id: { type: string }
        organizationId: { type: string, format: uuid }
        actorId: { type: string }
        purpose: { type: string }
        action: { type: string }
        resourceId: { type: string }
        correlationId: { type: string }
        outcome: { type: string }
        occurredAt: { type: string, format: date-time }
    DeliveryAuditList:
      type: array
      description: Delivery audit facts in insertion order; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/DeliveryAuditEntry' }
    AccessAuditEntry:
      type: object
      description: Append-only patient-access fact.
      properties:
        id: { type: string }
        organizationId: { type: string, format: uuid }
        subject: { type: string }
        eventType: { type: string }
        resourceId: { type: string }
        outcome: { type: string }
        detail: { type: string }
        occurredAt: { type: string, format: date-time }
    AccessAuditList:
      type: array
      description: Access audit facts in insertion order; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/AccessAuditEntry' }
    MessagingAuditEntry:
      type: object
      description: Append-only messaging-governance fact.
      properties:
        id: { type: string }
        organizationId: { type: string, format: uuid }
        subject: { type: string }
        purpose: { type: string }
        action: { type: string }
        resourceId: { type: string }
        unitId: { type: string }
        correlationId: { type: string }
        outcome: { type: string }
        occurredAt: { type: string, format: date-time }
    MessagingAuditList:
      type: array
      description: Governance audit facts in insertion order; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/MessagingAuditEntry' }
