        '201':
          description: Created draft at version one
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraft' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid order content or tenant selection }
  /api/v1/order-entry/drafts/{id}:
    put:
      operationId: editOrderDraft
      summary: Replace a draft's content under an If-Match version precondition
      tags: [order-entry]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - { name: id, in: path, required: true, description: Tenant-local draft identifier, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlacedOrderRequest' }
      responses:
        '200':
          description: The new immutable draft revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraft' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Draft not found or inaccessible; existence is concealed }
        '412': { description: Stale If-Match version }
        '422': { description: Invalid order content or tenant selection }
        '428': { description: If-Match precondition required }
  /api/v1/order-entry/drafts/{id}/place:
    post:
      operationId: placeOrder
      summary: Place a draft, storing its delivery mode; immutable and idempotent on retry
      tags: [order-entry]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: id, in: path, required: true, description: Tenant-local draft identifier, schema: { type: string } }
      responses:
        '200':
          description: The immutable placed order with its recorded delivery mode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacedOrder' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Draft not found or inaccessible; existence is concealed }
        '409': { description: Idempotency key belongs to a different order }
        '412': { description: Stale If-Match version }
        '428': { description: If-Match or Idempotency-Key precondition required }
  /api/v1/order-entry/orders/{id}:
    get:
      operationId: getPlacedOrder
      summary: Read one immutable placed order in the active organization
      tags: [order-entry]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: id, in: path, required: true, description: Tenant-local placed-order identifier, schema: { type: string } }
      responses:
        '200':
          description: The immutable placed order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacedOrder' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Order not found or inaccessible; existence is concealed }
  /api/v1/printing/handouts:
    post:
      operationId: printHandout
      summary: Render a versioned patient handout for one exact signed or placed source revision
      tags: [printing]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrintHandoutRequest' }
      responses:
        '201':
          description: Immutable handout metadata; the download path is returned in Location
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handout' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Source not found or inaccessible; existence is concealed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Source is not in a printable signed or placed state, or has no approved channel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Invalid reason, language or source selector
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/printing/handouts/download:
    post:
      operationId: downloadHandout
      summary: Download one immutable handout version after re-checking permission
      tags: [printing]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DownloadHandoutRequest' }
      responses:
        '200':
          description: Deterministic PDF bytes of the requested immutable version
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Source not found or inaccessible; existence is concealed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The requested version is stale; reload and request the current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Invalid reason, language, source selector or version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/staff/attachments/upload:
    post:
      operationId: uploadStaffAttachment
      summary: Upload a PDF, JPEG or PNG into private quarantine bound to one draft
      description: The Idempotency-Key header is correlation-only here; a retry creates a new attachment. Conflicts carry stable 409 codes.
      tags: [staff-messaging]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - { name: draftId, in: query, required: true, description: Conversation or mail draft that owns the attachment, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: The quarantined attachment; its independent scan verdict is still pending
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAttachment' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The attachment link write did not commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { description: Unsupported type, oversized payload, invalid file name, unreadable payload or invalid draft }
  /api/v1/staff/attachments/{id}/scan:
    post:
      operationId: scanStaffAttachment
      summary: Record an independent quarantine scan verdict for one attachment
      description: The Idempotency-Key header is correlation-only here; a second verdict on one file returns 409.
      tags: [staff-messaging]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - { name: id, in: path, required: true, description: Tenant-local attachment identifier, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanRequest' }
      responses:
        '200':
          description: The attachment with its recorded scan state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAttachment' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Attachment not found or inaccessible; existence is concealed }
        '409':
          description: Only a pending file can be scanned, or the attachment write did not commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { description: Missing or non-terminal verdict, invalid detail or tenant selection }
  /api/v1/staff/attachments/pending:
    get:
      operationId: listPendingStaffAttachments
      summary: List the pending unsent files of one draft for the sender to review
      tags: [staff-messaging]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: draftId, in: query, required: true, description: Conversation or mail draft whose pending files are listed, schema: { type: string } }
      responses:
        '200':
          description: Pending files in upload order; a named array, not a paginated list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingStaffAttachments' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid draft or tenant selection }
  /api/v1/staff/attachments/send:
    post:
      operationId: sendStaffAttachments
      summary: Publish named clean files to their confirmed recipients
      description: The Idempotency-Key header is correlation-only here; resending an already sent file returns 409.
      tags: [staff-messaging]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendRequest' }
      responses:
        '200':
          description: The published attachments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StaffAttachment' }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Attachment, draft or message not found or inaccessible; existence is concealed }
        '409':
          description: A named file is quarantined or not clean, is already sent, or the attachment write did not commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { description: Unconfirmed or empty command, duplicate or missing ids, invalid recipients or identifiers }
  /api/v1/staff/attachments/{id}/download:
    get:
      operationId: downloadStaffAttachment
      summary: Return verified original bytes to an authorized message recipient
      tags: [staff-messaging]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: id, in: path, required: true, description: Tenant-local attachment identifier, schema: { type: string } }
      responses:
        '200':
          description: Original bytes with their integrity headers and original PDF, JPEG or PNG media type
          headers:
            X-Checksum: { description: SHA-256 checksum of the returned bytes, schema: { type: string } }
            Content-Length: { description: Byte length of the returned payload, schema: { type: integer, format: int64 } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Attachment not found or inaccessible; existence is concealed }
        '409':
          description: File is not sent and clean, or the private object is absent or failed integrity verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { description: Invalid attachment identifier or tenant selection }
  /api/v1/staff/references/attach:
    post:
      operationId: attachStaffMessageReference
      summary: Attach a typed reference to a staff message and screen its subject line
      description: The actor and organization are derived from the authenticated context; the body carries only opaque handles, a non-identifying label and the raw subject. The subject line is screened but never echoed in the warning. Idempotency-Key is correlation-only here; a retry creates a new reference.
      tags: [staff-messaging]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, connectionId, kind, label, subject]
              properties:
                targetId: { type: string, description: Opaque target handle }
                connectionId: { type: string, description: Opaque connection handle }
                kind: { type: string, description: Reference kind wire key }
                label: { type: string, description: Non-identifying label shown before access is checked }
                subject: { type: string, description: Raw subject line screened for identifiers and never copied into a URL or notification }
      responses:
        '201':
          description: The opaque reference and a fixed-reason subject warning
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid handle, kind, label or subject }
  /api/v1/staff/references/view:
    get:
      operationId: viewStaffMessageReference
      summary: Read the label-only projection of a staff message reference
      description: The recipient's access is not evaluated here; opening the reference re-runs the access check. No target data is returned before an authorized open.
      tags: [staff-messaging]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - { name: id, in: query, required: true, description: Opaque reference handle, schema: { type: string } }
        - { name: connectionId, in: query, required: true, description: Opaque connection handle, schema: { type: string } }
        - { name: kind, in: query, required: true, description: Reference kind wire key, schema: { type: string } }
        - { name: targetId, in: query, required: true, description: Opaque target handle, schema: { type: string } }
        - { name: label, in: query, required: true, description: Non-identifying label, schema: { type: string } }
      responses:
        '200':
          description: Label-only projection; no target data
          content:
            application/json:
              schema: { type: object }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid handle, kind or label }
  /api/v1/staff/references/open:
    post:
      operationId: openStaffMessageReference
      summary: Open a reference after re-running the recipient's access check
      description: A recipient without a care relationship, a wrong-tenant target or a revoked or stale target is blocked or concealed. An authorized open audits the event and dispatches an identifier-free notification; a dispatch failure is propagated rather than reported as sent.
      tags: [staff-messaging]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Allowed, blocked or concealed outcome; notification text contains no identifiers
          content:
            application/json:
              schema: { type: object }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid handle, kind or label }
  /api/v1/staff/references/screen-subject:
    post:
      operationId: screenStaffMessageSubject
      summary: Screen a subject line for identifiers before a reference is attached
      description: The raw subject travels in the POST body, never in a URL, so it is not copied into access logs. The response carries only a fixed reason code, never the subject text. Idempotency-Key is correlation-only here.
      tags: [staff-messaging]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject: { type: string, description: Raw subject line to screen }
      responses:
        '200':
          description: Fixed-reason warning; no subject text is echoed
          content:
            application/json:
              schema: { type: object }
        '401': { description: Authentication required }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/conversations:
    post:
      operationId: openConversation
      summary: Open a verified patient conversation scoped to one care unit
      tags: [conversations]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/RetryKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationOpenRequest' }
      responses:
        '201':
          description: Conversation opened with its first work-item fact appended
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationRecord' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /api/v1/conversations/inbox:
    get:
      operationId: conversationInbox
      summary: Read the caller's patient inbox with derived unread counts
      tags: [conversations]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The caller's visible inbox entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationInbox' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /api/v1/conversations/work-queue:
    get:
      operationId: conversationWorkQueue
      summary: Read the role-scoped staff work queue
      tags: [conversations]
      parameters:
        - $ref: '#/components/parameters/ActiveOrganization'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Work items visible to the caller's active roles
          content:
            application/json:
