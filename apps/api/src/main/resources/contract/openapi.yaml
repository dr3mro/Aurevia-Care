components:
  parameters:
    ActiveOrganization:
      name: X-Active-Organization
      in: header
      required: true
      description: Explicit active organization UUID; membership is verified server-side.
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Generated and echoed when absent.
      schema: { type: string }
    Subject:
      name: subject
      in: path
      required: true
      description: Tenant-local synthetic staff subject.
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$' }
    ConfigKey:
      name: key
      in: path
      required: true
      description: Tenant-local configuration key.
      schema: { type: string, pattern: '^[a-z][a-z0-9._-]{2,63}$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Version of the draft the caller last read; weak and quoted validators are accepted.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque key that makes a retried command produce a single accepted effect.
      schema: { type: string, minLength: 1, maxLength: 255 }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Reserved retry-correlation header for draft commands; durable deduplication applies to placement.
      schema: { type: string, minLength: 1, maxLength: 255 }
    RetryKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Opaque client retry key for state-changing commands; the owning service applies replay safety where the command supports it.
      schema: { type: string, minLength: 1, maxLength: 255 }
  responses:
    Forbidden:
      description: No active membership or missing action permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthenticationRequired:
      description: Authentication required before a protected route is reached
    InvalidRequest:
      description: Invalid body, path or query parameter, or tenant selection
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ResourceNotFound:
      description: Resource not found or inaccessible; existence is concealed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StateConflict:
      description: The command conflicts with the current state of the resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StaleVersion:
      description: The resource changed since the caller read its version
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConfirmationNeeded:
      description: The command requires explicit client confirmation before publication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Unexpected server failure; shared envelope where the runtime renders one
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    ApiCommand:
      type: object
      description: >-
        Generic command envelope for state-changing operations. The owning
        service validates the concrete command fields and the authenticated
        actor; tenant and facility are always taken from the session.
      additionalProperties: true
    CreateFacility:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]{2,32}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
    Facility:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    FacilityPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Facility' }
        nextCursor: { type: string, nullable: true }
    InviteStaff:
      type: object
      required: [subject, displayName, role]
      additionalProperties: false
      description: Organization, grantor and effective dates are derived server-side, never accepted here.
      properties:
        subject: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        role: { type: string, enum: [tenant_admin, reception, privacy_auditor] }
    StaffMember:
      type: object
      properties:
        subject: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [active, deactivated] }
        roles:
          type: array
          items: { type: string }
    StaffPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StaffMember' }
        nextCursor: { type: string, nullable: true }
    StaffHistory:
      type: object
      properties:
        subject: { type: string }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipEvent' }
        roleGrants:
          type: array
          items: { $ref: '#/components/schemas/RoleGrant' }
    MembershipEvent:
      type: object
      description: Immutable; deactivation appends a revoked event.
      properties:
        id: { type: string }
        status: { type: string, enum: [active, revoked] }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    RoleGrant:
      type: object
      description: Immutable; grantor and effective dates are recorded at grant time.
      properties:
        id: { type: string }
        roleKey: { type: string }
        grantedBy: { type: string, format: uuid }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time, nullable: true }
    CreateConfiguration:
      type: object
      required: [key, value]
      additionalProperties: false
      description: Organization, version and author are derived server-side, never accepted here.
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9._-]{2,63}$' }
        value: { type: string, minLength: 1, maxLength: 4000 }
        effectiveFrom: { type: string, format: date-time, description: UTC instant; defaults to approval time }
    ApproveConfiguration:
      type: object
      additionalProperties: false
      description: The approver identity is derived from the authenticated actor.
      properties:
        note: { type: string }
    ConfigEntry:
      type: object
      properties:
        key: { type: string }
        version: { type: integer }
        value: { type: string }
        status: { type: string, enum: [pending, approved] }
        effectiveFrom: { type: string, format: date-time }
        createdBy: { type: string, format: uuid, nullable: true }
        approvedBy: { type: string, format: uuid, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
    ConfigHistory:
      type: object
      properties:
        key: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/ConfigEntry' }
    DefineCatalogEntry:
      type: object
      required: [code, value]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{1,63}$' }
        value: { type: string, minLength: 1, maxLength: 4000 }
        effectiveFrom: { type: string, format: date-time }
    CatalogEntry:
      type: object
      properties:
        family: { type: string }
        code: { type: string }
        version: { type: integer }
        value: { type: string }
        effectiveFrom: { type: string, format: date-time }
        approvedBy: { type: string, format: uuid }
        approvedAt: { type: string, format: date-time }
        note: { type: string, nullable: true }
    AuditEvent:
      type: object
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        actorId: { type: string, format: uuid, nullable: true }
        action: { type: string }
        resourceType: { type: string, nullable: true }
        resourceId: { type: string, nullable: true }
        purpose: { type: string, nullable: true }
        scope: { type: string, nullable: true }
        correlationId: { type: string, nullable: true }
        outcome: { type: string }
        seq: { type: integer, format: int64 }
    AuditPage:
      type: object
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextCursor: { type: string, nullable: true }
    Appointment:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        patientId: { type: string, format: uuid }
        facilityCode: { type: string }
        clinicianCode: { type: string }
        roomCode: { type: string, nullable: true }
        visitType: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        state: { type: string, enum: [held, booked, checked_in, in_progress, completed, cancelled, no_show, expired] }
        seriesId: { type: string, format: uuid, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        overrideReason: { type: string, nullable: true }
    AppointmentEvent:
      type: object
      description: Immutable history entry bound to one appointment revision.
      properties:
        id: { type: string, format: uuid }
        appointmentVersion: { type: integer }
        action: { type: string }
        fromState: { type: string, nullable: true }
        toState: { type: string }
        reason: { type: string, nullable: true }
        previousStartsAt: { type: string, format: date-time, nullable: true }
        previousEndsAt: { type: string, format: date-time, nullable: true }
        actorId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    AppointmentView:
      type: object
      properties:
        appointment: { $ref: '#/components/schemas/Appointment' }
        history:
          type: array
          items: { $ref: '#/components/schemas/AppointmentEvent' }
    AppointmentPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AppointmentView' }
        nextCursor: { type: string, nullable: true }
    OrderView:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        patientId: { type: string, format: uuid }
        encounterRef: { type: string }
        orderCode: { type: string }
        priority: { type: string, enum: [routine, urgent, stat] }
        clinicalQuestion: { type: string }
        destinationOrg: { type: string, format: uuid }
        sourceActor: { type: string }
        responsibleClinician: { type: string }
        workQueue: { type: string }
        authorizationId: { type: string, format: uuid }
        snapshotId: { type: string, format: uuid }
        snapshotFingerprint: { type: string, format: uuid }
        disclosureId: { type: string, format: uuid }
        workItemId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    LabAccession:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        accessionNo: { type: string }
        accessionIssuer: { type: string }
        patientId: { type: string, format: uuid }
        sourceOrderRef: { type: string }
        state: { type: string, enum: [accessioned, collected, received, rejected, recollected] }
        specimenType: { type: string, nullable: true }
        siteCode: { type: string, nullable: true }
        collector: { type: string, nullable: true }
        collectedAt: { type: string, format: date-time, nullable: true }
        receivedAt: { type: string, format: date-time, nullable: true }
        quality: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }
        rejectionNotification: { type: string, nullable: true }
        replacesAccessionId: { type: string, format: uuid, nullable: true }
    AccessionEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        accessionId: { type: string, format: uuid }
        accessionVersion: { type: integer }
        action: { type: string, enum: [accessioned, collected, received, rejected, recollected] }
        fromState: { type: string, nullable: true }
        toState: { type: string }
        reason: { type: string, nullable: true }
        matchedPatientId: { type: string, format: uuid, nullable: true }
        occurredAt: { type: string, format: date-time }
    AccessionView:
      type: object
      properties:
        accession: { $ref: '#/components/schemas/LabAccession' }
        events:
          type: array
          items: { $ref: '#/components/schemas/AccessionEvent' }
    AccessionPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AccessionView' }
        nextCursor: { type: string, nullable: true }
    OrderPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderView' }
        nextCursor: { type: string, nullable: true }
    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        patientId: { type: string, format: uuid }
        currency: { type: string }
        state: { type: string, enum: [draft, issued, partially_paid, paid, void] }
        totalMinor: { type: integer, format: int64 }
        paidMinor: { type: integer, format: int64 }
        refundedMinor: { type: integer, format: int64 }
        creditedMinor: { type: integer, format: int64 }
        balanceMinor: { type: integer, format: int64 }
        serviceReference: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        issuedAt: { type: string, format: date-time, nullable: true }
        voidReason: { type: string, nullable: true }
        voidedBySubject: { type: string, nullable: true }
    InvoiceItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        lineNo: { type: integer }
        description: { type: string }
        quantity: { type: integer }
        unitAmountMinor: { type: integer, format: int64 }
        amountMinor: { type: integer, format: int64 }
    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        invoiceVersion: { type: integer }
        type: { type: string, enum: [payment, refund, credit] }
        amountMinor: { type: integer, format: int64 }
        currency: { type: string }
        reference: { type: string }
        reason: { type: string, nullable: true }
        approverSubject: { type: string, nullable: true }
        receiptNo: { type: integer, format: int64 }
        actorId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    InvoiceView:
      type: object
      properties:
        invoice: { $ref: '#/components/schemas/Invoice' }
        items:
          type: array
          items: { $ref: '#/components/schemas/InvoiceItem' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }
    InvoicePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InvoiceView' }
        nextCursor: { type: string, nullable: true }
    DeliveryMode:
      type: string
      enum: [ELECTRONIC, PRINT, BOTH]
      description: Send electronically to the partner, print for the patient to carry, or both.
    OrderSelection:
      type: object
      required: [itemId, version]
      additionalProperties: false
      properties:
        itemId: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1 }
    PlacedOrderRequest:
      type: object
      required: [patientId, encounterId, facilityId, items, clinicalQuestion, priority, destinationPartnerId, deliveryMode]
      additionalProperties: false
      properties:
        patientId: { type: string, minLength: 1 }
        encounterId: { type: string, minLength: 1 }
        facilityId: { type: string, minLength: 1 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderSelection' }
        clinicalQuestion: { type: string, minLength: 1 }
        priority: { type: string, enum: [routine, urgent, stat] }
        preparationInstructions: { type: string, nullable: true }
        destinationPartnerId: { type: string, minLength: 1 }
        deliveryMode: { $ref: '#/components/schemas/DeliveryMode' }
    OrderDraft:
      type: object
      properties:
        organizationId: { type: string }
        id: { type: string }
        version: { type: integer }
        request: { $ref: '#/components/schemas/PlacedOrderRequest' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    PlacedOrder:
      type: object
      properties:
        organizationId: { type: string }
        id: { type: string }
        draftId: { type: string }
        version: { type: integer }
        request: { $ref: '#/components/schemas/PlacedOrderRequest' }
        payload: { type: string }
        placedBy: { type: string }
        placedAt: { type: string, format: date-time }
        idempotencyKey: { type: string }
    CreateInvoiceRequest:
      type: object
      required: [patientId, currency, items]
      description: Itemized self-pay invoice creation command; money is an integer count of currency minor units.
      properties:
        patientId: { type: string, format: uuid }
        currency: { type: string, minLength: 3, maxLength: 3 }
        serviceReference: { type: string, nullable: true }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/InvoiceLineRequest' }
    InvoiceLineRequest:
      type: object
      required: [description, quantity, unitAmountMinor]
      properties:
        description: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1 }
        unitAmountMinor: { type: integer, format: int64, minimum: 0 }
    EntryRequest:
      type: object
      required: [amountMinor, reference]
      description: Ledger entry command; the entry type comes from the route, never the request body.
      properties:
        amountMinor: { type: integer, format: int64, minimum: 1 }
        reference: { type: string, minLength: 1 }
        reason: { type: string, nullable: true }
        approverSubject: { type: string, nullable: true }
    VoidRequest:
      type: object
      required: [reason, approverSubject]
      description: Void command with a recorded reason and an approver distinct from the actor.
      properties:
        reason: { type: string, minLength: 1 }
        approverSubject: { type: string, minLength: 1 }
    DailyTotal:
      type: object
      properties:
        day: { type: string }
        currency: { type: string }
        issuedMinor: { type: integer, format: int64 }
        paymentMinor: { type: integer, format: int64 }
        refundMinor: { type: integer, format: int64 }
        creditMinor: { type: integer, format: int64 }
        netMinor: { type: integer, format: int64 }
        entryCount: { type: integer }
    Reconciliation:
      type: object
      description: Finance-only daily totals by currency; no clinical field is present.
      properties:
        days:
          type: array
          items: { $ref: '#/components/schemas/DailyTotal' }
    CreateDraftRequest:
      type: object
      required: [patientId]
      description: Draft creation command for a verified patient of the active tenant.
      properties:
        patientId: { type: string, minLength: 1 }
        encounterReference: { type: string, nullable: true }
        destination: { type: string, nullable: true }
    Draft:
      type: object
      description: Current projection of a prescription draft.
      properties:
        id: { type: string }
        version: { type: integer }
        patientId: { type: string }
        state: { type: string }
        selectedEntryId: { type: string, nullable: true }
        selectedEntryVersion: { type: integer, nullable: true }
        drugGenericName: { type: string, nullable: true }
        doseValue: { type: string, nullable: true }
        doseUnit: { type: string, nullable: true }
        route: { type: string, nullable: true }
        frequency: { type: string, nullable: true }
        quantity: { type: string, nullable: true }
        quantityUnit: { type: string, nullable: true }
        refills: { type: integer, nullable: true }
        instructions: { type: string, nullable: true }
        destination: { type: string, nullable: true }
        encounterReference: { type: string, nullable: true }
        prescriberSubject: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    OverrideRecord:
      type: object
      description: Immutable override binding a reason, its author and the matched data snapshot.
      properties:
        draftId: { type: string }
        draftVersion: { type: integer }
        reason: { type: string }
        authorSubject: { type: string }
        matchedSnapshot: { type: string }
        occurredAt: { type: string, format: date-time }
    DraftView:
      type: object
      properties:
        draft: { $ref: '#/components/schemas/Draft' }
        override: { $ref: '#/components/schemas/OverrideRecord', nullable: true }
    DraftCatalogVersion:
      type: object
      description: Immutable draft-to-catalog binding; the version is null until a medication is selected.
      properties:
        draftId: { type: string }
        catalogVersion: { type: integer, nullable: true }
    AllergyCheckRequest:
      type: object
      required: [catalogEntryId]
      properties:
        catalogEntryId: { type: string, minLength: 1 }
    AllergyFinding:
      type: object
      properties:
        kind: { type: string, enum: [exact_match, cross_reactivity, unresolved_ingredient, incomplete_assessment] }
        substanceId: { type: string, nullable: true }
        group: { type: string, nullable: true }
        groupVersion: { type: integer }
        detail: { type: string }
    AllergyCheck:
      type: object
      description: Versioned allergy check; an unresolved or unverified assessment is never silently safe.
      properties:
        outcome: { type: string, enum: [no_conflict, conflict, warning, unresolved] }
        allergyStatus: { type: string, enum: [verified_list, verified_none, unknown, unverified] }
        findings:
          type: array
          items: { $ref: '#/components/schemas/AllergyFinding' }
        catalogVersion: { type: string }
    SelectMedicationRequest:
      type: object
      required: [catalogEntryId, doseValue, doseUnit, route, frequency, quantity, quantityUnit, instructions]
      description: Medication selection with an override reason required when a verified conflict exists.
      properties:
        catalogEntryId: { type: string, minLength: 1 }
        doseValue: { type: string, minLength: 1 }
        doseUnit: { type: string, minLength: 1 }
        route: { type: string, minLength: 1 }
        frequency: { type: string, minLength: 1 }
        quantity: { type: string, minLength: 1 }
        quantityUnit: { type: string, minLength: 1 }
        refills: { type: integer, nullable: true }
        instructions: { type: string, minLength: 1 }
        overrideReason: { type: string, nullable: true }
    Ingredient:
      type: object
      properties:
        substanceId: { type: string, nullable: true }
        group: { type: string, nullable: true }
        groupVersion: { type: integer }
    DrugEntry:
      type: object
      description: One approved effective catalog entry; suggestions never change a clinician's selection.
      properties:
        entryId: { type: string }
        version: { type: integer }
        genericName: { type: string }
        tradeName: { type: string }
        formulation: { type: string }
        strengthValue: { type: string }
        strengthUnit: { type: string }
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/Ingredient' }
        approved: { type: boolean }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        approvalProvenance: { type: string }
    Alternative:
      type: object
      description: Review-only tagged alternative with its source catalog version.
      properties:
        kind: { type: string, enum: [suggestion] }
        entry: { $ref: '#/components/schemas/DrugEntry' }
        reason: { type: string }
        sourceCatalogVersion: { type: string }
        requiresClinicianSelection: { type: boolean }
    CatalogHit:
      type: object
      properties:
        entry: { $ref: '#/components/schemas/DrugEntry' }
        alternatives:
          type: array
          items: { $ref: '#/components/schemas/Alternative' }
    DrugCatalogHits:
      type: array
      description: Effective catalog entries with tagged alternatives; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/CatalogHit' }
    MedicationCatalogVersion:
      type: object
      properties:
        version: { type: integer }
        market: { type: string }
        publishedAt: { type: string, format: date-time }
        provenance: { type: string }
    MedicationCatalogItem:
      type: object
      properties:
        drug: { $ref: '#/components/schemas/DrugEntry' }
        route: { type: string }
    VersionedCatalogSearch:
      type: object
      description: Catalog hits paired with the publication version that produced them.
      properties:
        version: { $ref: '#/components/schemas/MedicationCatalogVersion' }
        items:
          type: array
          items: { $ref: '#/components/schemas/MedicationCatalogItem' }
    CreatePrescriptionRequest:
      type: object
      required: [prescriptionId, patientId, medication, prescriberSubject]
      description: Transmission registration for an RX-01 draft; the local id is supplied by the caller.
      properties:
        prescriptionId: { type: string, minLength: 1 }
        patientId: { type: string, minLength: 1 }
        medication: { type: string }
        strength: { type: string, nullable: true }
        dose: { type: string, nullable: true }
        route: { type: string, nullable: true }
        frequency: { type: string, nullable: true }
        quantity: { type: integer, nullable: true }
        prescriberSubject: { type: string }
        destinationPharmacy: { type: string, nullable: true }
    Prescription:
      type: object
      properties:
        id: { type: string }
        version: { type: integer }
        patientId: { type: string }
        medication: { type: string }
        strength: { type: string, nullable: true }
        dose: { type: string, nullable: true }
        route: { type: string, nullable: true }
        frequency: { type: string, nullable: true }
        quantity: { type: integer }
        prescriberSubject: { type: string }
        destinationPharmacy: { type: string, nullable: true }
        state: { type: string, enum: [draft, attested, submitted, ambiguous, delivery_confirmed, accepted, rejected, clarification, dispensed, printed, cancelled] }
        channel: { type: string, nullable: true }
        submissionId: { type: string, nullable: true }
        retryAllowed: { type: boolean }
        createdAt: { type: string, format: date-time }
    PrescriptionEvent:
      type: object
      description: Immutable transmission fact; acceptance and dispensing are deliberately distinct.
      properties:
        id: { type: string }
        prescriptionId: { type: string }
        prescriptionVersion: { type: integer }
        eventType: { type: string, enum: [attested, submitted, delivery_confirmed, partner_status_verified, printed, pharmacy_accepted, pharmacy_rejected, clarification, renewal, cancelled, dispensing_evidence] }
        actorId: { type: string, nullable: true }
        channel: { type: string, nullable: true }
        submissionId: { type: string, nullable: true }
        outcome: { type: string, nullable: true }
        detail: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
    PrescriptionView:
      type: object
      properties:
        prescription: { $ref: '#/components/schemas/Prescription' }
        events:
          type: array
          items: { $ref: '#/components/schemas/PrescriptionEvent' }
    PrintablePrescription:
      type: object
      description: Locally printed prescription carrying the attestation; no electronic delivery is implied.
      properties:
        prescriptionId: { type: string }
        patientId: { type: string }
        medication: { type: string }
        strength: { type: string, nullable: true }
        dose: { type: string, nullable: true }
        route: { type: string, nullable: true }
        frequency: { type: string, nullable: true }
        quantity: { type: integer }
        prescriberSubject: { type: string }
        destinationPharmacy: { type: string, nullable: true }
        attestationNote: { type: string, nullable: true }
        attestedAt: { type: string, format: date-time }
        channel: { type: string }
    AttestRequest:
      type: object
      properties:
        note: { type: string, nullable: true }
    TransmitRequest:
      type: object
      required: [channel]
      properties:
        channel: { type: string, minLength: 1 }
        outcome: { type: string, nullable: true }
    ConfirmDeliveryRequest:
      type: object
      required: [submissionId]
      properties:
        submissionId: { type: string, minLength: 1 }
    VerifyPartnerStatusRequest:
      type: object
      required: [submissionId, status]
      description: Three-valued status; only absent authorizes a retry.
      properties:
        submissionId: { type: string, minLength: 1 }
        status: { type: string, enum: [present, absent, unknown] }
    RetryTransmissionRequest:
      type: object
      required: [submissionId, outcome]
      description: Retry reuses the original stable submission id.
      properties:
        submissionId: { type: string, minLength: 1 }
        outcome: { type: string, enum: [submitted, ambiguous] }
    PharmacyResponseRequest:
      type: object
      required: [submissionId, outcome]
      properties:
        submissionId: { type: string, minLength: 1 }
        outcome: { type: string, enum: [accepted, rejected, clarification] }
        note: { type: string, nullable: true }
    DispensingRequest:
      type: object
      required: [submissionId]
      properties:
        submissionId: { type: string, minLength: 1 }
        note: { type: string, nullable: true }
    RenewRequest:
      type: object
      properties:
        note: { type: string, nullable: true }
    CancelPrescriptionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    ProposeSubstitutionRequest:
      type: object
      required: [currentEntryId, proposedEntryId, reason]
      description: Pharmacy-proposed alternative; the reason is a bounded, auditable key.
      properties:
        currentEntryId: { type: string, minLength: 1 }
        proposedEntryId: { type: string, minLength: 1 }
        reason: { type: string, enum: [stock, brand, formulation] }
        note: { type: string, nullable: true }
        overrideReason: { type: string, nullable: true }
    DecideSubstitutionRequest:
      type: object
      required: [attestation]
      properties:
        attestation: { type: string, minLength: 1 }
        note: { type: string, nullable: true }
    SubstitutionProposal:
      type: object
      properties:
        id: { type: string }
        organizationId: { type: string }
        prescriptionId: { type: string }
        patientId: { type: string }
        prescriberSubject: { type: string }
        proposedBy: { type: string }
        original: { $ref: '#/components/schemas/DrugEntry' }
        proposed: { $ref: '#/components/schemas/DrugEntry' }
        reason: { type: string, enum: [stock, brand, formulation] }
        note: { type: string, nullable: true }
        overrideReason: { type: string, nullable: true }
        allergyCheck: { $ref: '#/components/schemas/AllergyCheck' }
        state: { type: string, enum: [pending, approved, declined] }
        version: { type: integer }
        proposedAt: { type: string, format: date-time }
    SignedSubstitutionRevision:
      type: object
      description: Immutable signed revision created only on approval, with full catalog provenance.
      properties:
        id: { type: string }
        prescriptionId: { type: string }
        proposalId: { type: string }
        revisionNumber: { type: integer }
        replaced: { $ref: '#/components/schemas/DrugEntry' }
        replacement: { $ref: '#/components/schemas/DrugEntry' }
        reason: { type: string, enum: [stock, brand, formulation] }
        approvedBy: { type: string }
        allergyCheck: { $ref: '#/components/schemas/AllergyCheck' }
        attestation: { type: string }
        catalogProvenance: { type: string }
        signedAt: { type: string, format: date-time }
    ProposalView:
      type: object
      description: Review-only side-by-side proposal with its optional signed revision.
      properties:
        proposal: { $ref: '#/components/schemas/SubstitutionProposal' }
        appliedRevision: { $ref: '#/components/schemas/SignedSubstitutionRevision', nullable: true }
        alternatives:
          type: array
          items: { $ref: '#/components/schemas/Alternative' }
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
    PrintReason:
      type: string
      enum: [give_to_patient, referral, patient_request]
      description: Why a disclosure happened; recorded as the audit purpose, never the handout content.
    HandoutKind:
      type: string
      enum: [PRESCRIPTION, LAB_ORDER, IMAGING_ORDER, CHART_SUMMARY, SIGNED_REPORT]
      description: Stable kind of the patient handout.
    HandoutSource:
      type: object
      required: [organizationId, kind, sourceId, revisionVersion, contentChecksum, state]
      additionalProperties: false
      description: Exact committed source revision selected for a handout; the server validates its printable state and tenant.
      properties:
        organizationId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/HandoutKind' }
        sourceId: { type: string }
        revisionVersion: { type: integer, minimum: 1 }
        contentChecksum: { type: string, minLength: 64, maxLength: 64 }
        state: { type: string }
        attested: { type: boolean }
        printChannel: { type: string, nullable: true }
        patientId: { type: string }
        patientName: { type: string }
        clinician: { type: string }
        facility: { type: string }
        issueTime: { type: string, format: date-time }
        sourceSystem: { type: string }
        contentLines:
          type: array
          items: { type: string }
    PrintHandoutRequest:
      type: object
      required: [source, language, reason]
      additionalProperties: false
      properties:
        source: { $ref: '#/components/schemas/HandoutSource' }
        language: { type: string, enum: [en, ar] }
        reason: { $ref: '#/components/schemas/PrintReason' }
    DownloadHandoutRequest:
      type: object
      required: [source, language, reason, version]
      additionalProperties: false
      properties:
        source: { $ref: '#/components/schemas/HandoutSource' }
        language: { type: string, enum: [en, ar] }
        reason: { $ref: '#/components/schemas/PrintReason' }
        version: { type: integer, minimum: 1 }
    Handout:
      type: object
      description: Immutable rendering metadata; the PDF bytes are available only through the download path.
      properties:
        organizationId: { type: string, format: uuid }
        handoutId: { type: string }
        kind: { $ref: '#/components/schemas/HandoutKind' }
        sourceId: { type: string }
        sourceRevision: { type: integer }
        sourceChecksum: { type: string }
        version: { type: integer }
        language: { type: string }
        direction: { type: string }
        pageCount: { type: integer }
        byteSize: { type: integer, format: int64 }
        sha256: { type: string }
        provenance: { type: string }
        producedAt: { type: string, format: date-time }
        producedBy: { type: string }
    StaffAttachment:
      type: object
      description: Current projection of one quarantined or published staff-message attachment; bytes stay behind the download route.
      properties:
        organizationId: { type: string, format: uuid }
        id: { type: string }
        uploaderSubject: { type: string }
        draftId: { type: string }
        documentId: { type: string }
        fileName: { type: string }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        checksum: { type: string }
        objectKey: { type: string }
        objectVersion: { type: integer }
        scanState: { type: string, enum: [pending, clean, quarantined] }
        messageId: { type: string }
        sent: { type: boolean }
        createdAt: { type: string, format: date-time }
    PendingStaffAttachments:
      type: array
      description: Bounded set of unsent files of one draft; not a paginated list.
      items: { $ref: '#/components/schemas/StaffAttachment' }
    ScanRequest:
      type: object
      required: [verdict]
      additionalProperties: false
      description: Independent scanner verdict; a bounded detail explains a failed verdict to the sender without carrying file content or a pathogen name.
      properties:
        verdict: { type: string, enum: [clean, failed], description: Terminal scanner verdict; failed quarantines the file. Stored scan states are reported by StaffAttachment.scanState. }
        detail: { type: string, maxLength: 200 }
    SendRequest:
      type: object
      required: [draftId, messageId, attachmentIds, recipients, confirm]
      additionalProperties: false
      description: Explicit publication command; confirm must be true and every named file must be clean and owned by the sender.
      properties:
        draftId: { type: string }
        messageId: { type: string }
        attachmentIds: { type: array, items: { type: string } }
        recipients: { type: array, items: { type: string } }
        confirm: { type: boolean }
    ConversationRecord:
      type: object
      description: Current projection of one conversation; version is the compare-and-set token for its commands.
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        patientId: { type: string }
        patientSubject: { type: string }
        unitKey: { type: string, enum: [clinic, lab, radiology, pt, pharmacy] }
        connectionId: { type: string }
        topic: { type: string, nullable: true }
        state: { type: string, enum: [awaiting_staff, awaiting_patient, resolved, closed] }
        assigneeSubject: { type: string, nullable: true }
        patientReadSequence: { type: integer, minimum: 0 }
        staffReadSequence: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    ConversationMessage:
      type: object
      description: One immutable message in a conversation trail.
      properties:
        id: { type: string }
        conversationId: { type: string }
        sequence: { type: integer, minimum: 1 }
        senderKind: { type: string, enum: [patient, staff] }
        senderSubject: { type: string }
        senderRole: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    ConversationWorkEvent:
      type: object
      description: Append-only work-item fact; a closed conversation cannot be reopened.
      properties:
        id: { type: string }
        conversationId: { type: string }
        conversationVersion: { type: integer, minimum: 1 }
        eventType: { type: string, enum: [created, reopened, assigned, transferred, resolved, closed] }
        actorSubject: { type: string }
        fromState: { type: string }
        toState: { type: string }
        reason: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
    ConversationDetail:
      type: object
      description: One conversation with its complete message and work-item trails.
      properties:
        conversation: { $ref: '#/components/schemas/ConversationRecord' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ConversationMessage' }
        events:
          type: array
          items: { $ref: '#/components/schemas/ConversationWorkEvent' }
    ConversationInboxEntry:
      type: object
      properties:
        conversation: { $ref: '#/components/schemas/ConversationRecord' }
        unreadCount: { type: integer, minimum: 0 }
    ConversationInbox:
      type: object
      description: Patient inbox with derived unread counts, not a cursor-paginated page.
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/ConversationInboxEntry' }
    ConversationWorkQueue:
      type: object
      description: Role-scoped staff work queue, not a cursor-paginated page.
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/ConversationRecord' }
    ConversationOpenRequest:
      type: object
      required: [patientId, patientSubject, unitKey, connectionId]
      additionalProperties: false
      description: Connection, unit and actor are re-verified server-side; no caller assertion is trusted.
      properties:
        patientId: { type: string }
        patientSubject: { type: string }
        unitKey: { type: string, enum: [clinic, lab, radiology, pt, pharmacy] }
        connectionId: { type: string }
        topic: { type: string, nullable: true }
    ConversationReplyRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1 }
    ConversationAssignRequest:
      type: object
      required: [assigneeSubject, reason]
      additionalProperties: false
      properties:
        assigneeSubject: { type: string }
        reason: { type: string }
    ConversationTransferRequest:
      type: object
      required: [toSubject, reason]
      additionalProperties: false
      properties:
        toSubject: { type: string }
        reason: { type: string }
    ConversationResolveRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string }
    ConversationCloseRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string }
    InstantOpenDirectRequest:
      type: object
      required: [facilityId, peerSubject]
      additionalProperties: false
      properties:
        facilityId: { type: string }
        peerSubject: { type: string }
    InstantCreateGroupRequest:
      type: object
      required: [facilityId, memberSubjects]
      additionalProperties: false
      properties:
        facilityId: { type: string }
        topic: { type: string, nullable: true }
        memberSubjects: { type: array, items: { type: string } }
    InstantAddParticipantRequest:
      type: object
      required: [facilityId, conversationId, subject]
      additionalProperties: false
      properties:
        facilityId: { type: string }
        conversationId: { type: string }
        subject: { type: string }
    InstantSendRequest:
      type: object
      description: Body of a send command; the conversation id must match the request path.
      required: [facilityId, conversationId, body]
      additionalProperties: false
      properties:
        facilityId: { type: string }
        conversationId:
          type: string
          description: Must equal the path conversationId; a mismatch returns 422 INVALID_INPUT and writes to neither conversation.
        body: { type: string, minLength: 1 }
    InstantMarkReadRequest:
      type: object
      required: [facilityId, conversationId, upToSequence]
      additionalProperties: false
      properties:
        facilityId: { type: string }
        conversationId: { type: string }
        upToSequence: { type: integer, minimum: 0, format: int64 }
    InstantConversation:
      type: object
      properties:
        id: { type: string }
        facilityId: { type: string }
        kind: { type: string }
        topic: { type: string, nullable: true }
        lastSequence: { type: integer, minimum: 0, format: int64 }
        unreadCount: { type: integer, minimum: 0, format: int64 }
    InstantMessage:
      type: object
      properties:
        id: { type: string }
        sequence: { type: integer, minimum: 1, format: int64 }
        senderSubject: { type: string }
        senderRole: { type: string }
        body: { type: string }
        sentAt: { type: string, format: date-time }
    InstantMessageList:
      type: array
      description: Ordered messages of one conversation; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/InstantMessage' }
    InstantUnread:
      type: object
      properties:
        conversationId: { type: string }
        unreadCount: { type: integer, minimum: 0, format: int64 }
    InstantUnreadList:
      type: array
      description: One unread count per conversation; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/InstantUnread' }
    InstantConversationList:
      type: array
      description: Conversations visible to the caller; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/InstantConversation' }
    RealtimeEventType:
      type: string
      description: Stable wire value of an identifier-only realtime event; never carries clinical content.
      enum: [message, read]
    RealtimeEvent:
      type: object
      description: Identifier-only notification about a change in a staff conversation.
      properties:
        id: { type: string, description: Stable identifier of the changed message or read cursor }
        sequence: { type: integer, format: int64, minimum: 1, description: Monotonic hub sequence used for resume }
        type: { $ref: '#/components/schemas/RealtimeEventType' }
        conversationId: { type: string, description: Owning conversation identifier }
        subject: { type: string, description: Acting staff subject, never a display name }
    RealtimeEventPage:
      type: object
      description: Bounded polling page of identifier-only events with the high-water cursor.
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/RealtimeEvent' }
        nextCursor: { type: integer, format: int64, description: Hub high-water sequence for the next poll }
    MailRecipient:
      type: object
      description: A visible recipient; blind copy is deliberately absent from the wire vocabulary.
      properties:
        kind: { type: string, enum: [person, role, unit_mailbox] }
        value: { type: string }
    MailComposeRequest:
      type: object
      description: Draft compose or save body; bcc is accepted only so the service can refuse it.
      properties:
        facilityId: { type: string }
        subject: { type: string }
        body: { type: string }
        to:
          type: array
          items: { $ref: '#/components/schemas/MailRecipient' }
        cc:
          type: array
          items: { $ref: '#/components/schemas/MailRecipient' }
        bcc: { type: array, items: { type: string } }
        attachmentDocumentIds: { type: array, items: { type: string } }
    MailSendRequest:
      type: object
      description: Publication requires the explicit recipient list the caller confirmed.
      properties:
        confirmedRecipients: { type: array, items: { type: string } }
    MailTextRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string }
    MailFolderRequest:
      type: object
      required: [folder]
      additionalProperties: false
      properties:
        folder: { type: string, enum: [inbox, sent, drafts, archive, trash] }
    MailFlagRequest:
      type: object
      required: [flag, enabled]
      additionalProperties: false
      properties:
        flag: { type: string }
        enabled: { type: boolean }
    MailDraft:
      type: object
      description: Private versioned draft owned by one subject; version is the save precondition.
      properties:
        organizationId: { type: string, format: uuid }
        id: { type: string }
        facilityId: { type: string }
        ownerSubject: { type: string }
        version: { type: integer, minimum: 1 }
        subject: { type: string }
        body: { type: string }
        to:
          type: array
          items: { $ref: '#/components/schemas/MailRecipient' }
        cc:
          type: array
          items: { $ref: '#/components/schemas/MailRecipient' }
        attachmentDocumentIds: { type: array, items: { type: string } }
        threadId: { type: string }
        updatedAt: { type: string, format: date-time }
    MailSentMessage:
      type: object
      description: Immutable published message with recipients resolved at send time.
      properties:
        organizationId: { type: string, format: uuid }
        id: { type: string }
        facilityId: { type: string }
        threadId: { type: string }
        subject: { type: string }
        body: { type: string }
        senderSubject: { type: string }
        senderRole: { type: string }
        sentAt: { type: string, format: date-time }
        to:
          type: array
          items: { $ref: '#/components/schemas/MailRecipient' }
        cc:
          type: array
          items: { $ref: '#/components/schemas/MailRecipient' }
        resolvedRecipients: { type: array, items: { type: string } }
        attachmentDocumentIds: { type: array, items: { type: string } }
        flags: { type: array, items: { type: string } }
    MailView:
      type: object
      description: One message with the per-viewer folder placement and shared message flags.
      properties:
        message: { $ref: '#/components/schemas/MailSentMessage' }
        viewerFolder: { type: string, enum: [inbox, sent, drafts, archive, trash] }
    MailThread:
      type: object
      properties:
        threadId: { type: string }
        subject: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/MailView' }
    MailMessageList:
      type: array
      description: Messages in one folder; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/MailView' }
    MailThreadList:
      type: array
      description: Threads visible to the caller; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/MailThread' }
    SchedulingVisitTypeRequest:
      type: object
      required: [code, durationMinutes]
      additionalProperties: false
      properties:
        code: { type: string }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
    SchedulingVisitType:
      type: object
      properties:
        code: { type: string }
        durationMinutes: { type: integer, minimum: 1 }
    SchedulingResourceRequest:
      type: object
      required: [facilityCode, kind, code, displayName]
      additionalProperties: false
      properties:
        facilityCode: { type: string }
        kind: { type: string, enum: [clinician, room] }
        code: { type: string }
        displayName: { type: string }
    SchedulingResource:
      type: object
      properties:
        id: { type: string }
        facilityCode: { type: string }
        kind: { type: string, enum: [clinician, room] }
        code: { type: string }
        displayName: { type: string }
    SchedulingResourceList:
      type: array
      description: Protected resources of one facility; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/SchedulingResource' }
    SchedulingAvailabilityRequest:
      type: object
      required: [weekday, startLocal, endLocal]
      additionalProperties: false
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: ISO-8601 day of week, 1 is Monday. }
        startLocal: { type: string, description: Local wall-clock start of the window. }
        endLocal: { type: string, description: Local wall-clock end of the window. }
    SchedulingAvailability:
      type: object
      properties:
        facilityCode: { type: string }
        resourceCode: { type: string }
        weekday: { type: integer, minimum: 1, maximum: 7 }
        startLocal: { type: string }
        endLocal: { type: string }
    DeliveryAuditEntry:
      type: object
      description: Append-only delivery fact; correlation id ties it to the originating event.
      properties:
        id: { type: string }
        organizationId: { type: string, format: uuid }
        actorId: { type: string }
        purpose: { type: string }
        action: { type: string }
        resourceId: { type: string }
        correlationId: { type: string }
        outcome: { type: string }
        occurredAt: { type: string, format: date-time }
    DeliveryAuditList:
      type: array
      description: Delivery audit facts in insertion order; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/DeliveryAuditEntry' }
    AccessAuditEntry:
      type: object
      description: Append-only patient-access fact.
      properties:
        id: { type: string }
        organizationId: { type: string, format: uuid }
        subject: { type: string }
        eventType: { type: string }
        resourceId: { type: string }
        outcome: { type: string }
        detail: { type: string }
        occurredAt: { type: string, format: date-time }
    AccessAuditList:
      type: array
      description: Access audit facts in insertion order; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/AccessAuditEntry' }
    MessagingAuditEntry:
      type: object
      description: Append-only messaging-governance fact.
      properties:
        id: { type: string }
        organizationId: { type: string, format: uuid }
        subject: { type: string }
        purpose: { type: string }
        action: { type: string }
        resourceId: { type: string }
        unitId: { type: string }
        correlationId: { type: string }
        outcome: { type: string }
        occurredAt: { type: string, format: date-time }
    MessagingAuditList:
      type: array
      description: Governance audit facts in insertion order; not a cursor-paginated page.
      items: { $ref: '#/components/schemas/MessagingAuditEntry' }

