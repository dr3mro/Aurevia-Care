  /health/metrics:
    get:
      operationId: scrapeMetrics
      summary: Scrape aggregate request metrics as Prometheus exposition text for an allowed source
      tags: [health]
      security: []
      description: >-
        Unauthenticated scrape. The source address is allowlisted by
        MetricsAccessPolicy; loopback is always permitted and additional CIDRs
        come from AUREVIA_METRICS_ALLOW. A disallowed source receives a bare
        404 with an empty body so the endpoint is not discoverable from an
        untrusted network. The body holds aggregate counters only, never request
        bodies, tokens, tenant or patient fields.
      responses:
        '200':
          description: Prometheus exposition text for an allowed source
          content:
            text/plain:
              schema: { type: string, description: Prometheus exposition text }
        '404': { description: Source address is not permitted; response body is empty }
        '500': { $ref: '#/components/responses/ServerError' }
