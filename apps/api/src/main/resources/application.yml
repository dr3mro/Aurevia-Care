spring:
  application:
    name: smartclinic-api
  datasource:
    url: ${SMARTCLINIC_DB_URL:jdbc:postgresql://127.0.0.1:5432/smartclinic_it}
    username: ${SMARTCLINIC_DB_USER:smartclinic_app}
    password: ${SMARTCLINIC_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 2
      initialization-fail-timeout: -1
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SMARTCLINIC_OIDC_ISSUER_URI:}
          audiences: ${SMARTCLINIC_OIDC_AUDIENCE:}
smartclinic:
  rate-limit:
    # WEB-04 instance-local guard; the edge WAF supplies the global limit.
    per-minute: ${SMARTCLINIC_RATE_LIMIT_PER_MINUTE:600}
server:
  port: ${SMARTCLINIC_SERVER_PORT:8081}
  # Trust X-Forwarded-* from the TLS-terminating edge so isSecure() and the
  # WEB-02 HSTS header reflect the client's scheme, not the internal hop.
  forward-headers-strategy: framework
logging:
  structured:
    # WEB-06: emit ECS-shaped JSON on stdout so the correlation id from MDC,
    # route, status and latency are machine-readable for the log pipeline.
    format:
      console: ecs
