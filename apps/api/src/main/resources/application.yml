spring:
  application:
    name: smartclinic-api
  datasource:
    url: ${SMARTCLINIC_DB_URL:jdbc:postgresql://127.0.0.1:5432/smartclinic_it}
    username: ${SMARTCLINIC_DB_USER:smartclinic_app}
    password: ${SMARTCLINIC_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 2
      initialization-fail-timeout: -1
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SMARTCLINIC_OIDC_ISSUER_URI:}
          audiences: ${SMARTCLINIC_OIDC_AUDIENCE:}
server:
  port: ${SMARTCLINIC_SERVER_PORT:8081}
  # Trust X-Forwarded-* from the TLS-terminating edge so isSecure() and the
  # WEB-02 HSTS header reflect the client's scheme, not the internal hop.
  forward-headers-strategy: framework
