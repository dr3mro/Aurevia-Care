spring:
  application:
    name: orevia-api
  datasource:
    url: ${OREVIA_DB_URL:jdbc:postgresql://127.0.0.1:5432/orevia_it}
    username: ${OREVIA_DB_USER:orevia_app}
    password: ${OREVIA_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 2
      initialization-fail-timeout: -1
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OREVIA_OIDC_ISSUER_URI:}
          # WEB-03/WEB-05: OREVIA_OIDC_AUDIENCE is required. Outside the
          # synthetic-auth profile SecurityConfiguration fails startup when it
          # is blank, and every bearer token must carry this value in `aud`.
          audiences: ${OREVIA_OIDC_AUDIENCE:}
orevia:
  rate-limit:
    # WEB-04 instance-local guard; the edge WAF supplies the global limit.
    per-minute: ${OREVIA_RATE_LIMIT_PER_MINUTE:600}
  # WEB-03 staff web browser OIDC client. Placeholders only: values come from
  # the environment, and the StaffWebLoginConfiguration fails startup closed
  # when any of them is missing outside the synthetic-auth profile.
  oidc:
    client-id: ${OREVIA_OIDC_CLIENT_ID:}
    client-secret: ${OREVIA_OIDC_CLIENT_SECRET:}
server:
  port: ${OREVIA_SERVER_PORT:8081}
  servlet:
    session:
      # WEB-03 idle ceiling; the absolute 12h ceiling is enforced by the
      # AbsoluteSessionTimeoutFilter in the staff web security chain.
      timeout: 15m
      cookie:
        name: JSESSIONID
        http-only: true
        secure: true
        same-site: lax
  # Trust X-Forwarded-* from the TLS-terminating edge so isSecure() and the
  # WEB-02 HSTS header reflect the client's scheme, not the internal hop.
  forward-headers-strategy: framework
logging:
  structured:
    # WEB-06: emit ECS-shaped JSON on stdout so the correlation id from MDC,
    # route, status and latency are machine-readable for the log pipeline.
    format:
      console: ecs
