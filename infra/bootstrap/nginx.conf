pid /tmp/orevia-nginx.pid;
error_log /dev/stderr;
events {}
http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/sc-client;
    proxy_temp_path /tmp/sc-proxy;
    fastcgi_temp_path /tmp/sc-fastcgi;
    uwsgi_temp_path /tmp/sc-uwsgi;
    scgi_temp_path /tmp/sc-scgi;
    server {
        listen 8080;
        root /opt/orevia;
        location = /health.txt {}
        location / { return 404; }
    }
}
