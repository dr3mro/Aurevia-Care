name: Java and database verification
description: Run API tests, 100% coverage, OWASP/SpotBugs and PostgreSQL policy checks.

inputs:
  pg-admin:
    description: Administrative PostgreSQL user for the service container
    required: true
  nvd-api-key:
    description: Optional NVD API key for fresh CVE data
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
      with:
        distribution: temurin
        java-version: '21'
        cache: maven

    - name: Cache OWASP NVD data
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository/org/owasp/dependency-check-data
        # Unique per run: a miss restores the previous snapshot via restore-keys,
        # and a keyed push refreshes it and saves fresh NVD data for later runs.
        key: owasp-nvd-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
        restore-keys: |
          owasp-nvd-${{ runner.os }}-${{ runner.arch }}-

    - name: API tests, coverage and static security
      shell: bash
      env:
        NVD_API_KEY: ${{ inputs.nvd-api-key }}
        AUREVIA_PG_ADMIN: ${{ inputs.pg-admin }}
        AUREVIA_OIDC_ISSUER_URI: https://issuer.example.test/
        AUREVIA_OIDC_AUDIENCE: aurevia-test-audience
        AUREVIA_OIDC_CLIENT_ID: aurevia-test-client
        AUREVIA_OIDC_CLIENT_SECRET: aurevia-test-secret
      run: bash apps/api/check.sh

    - name: PostgreSQL migration and policy checks
      shell: bash
      env:
        AUREVIA_PG_ADMIN: ${{ inputs.pg-admin }}
      run: bash db/check.sh

    - name: Upload verification reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: java-verification-reports
        path: |
          apps/api/target/site/jacoco/
          apps/api/target/owasp/
          apps/api/target/spotbugsXml.xml
          apps/api/target/surefire-reports/
        if-no-files-found: warn
