# Dependency update policy.
#
# Routine patch and minor updates are grouped into one pull request per
# ecosystem and directory so Delivery verifies one coherent lockfile change
# instead of many competing single-package pull requests. Major upgrades need
# coordinated tool, plugin and base-image changes, so they stay out of the
# automatic queue and are handled as reviewed maintenance work.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/java-verify
      - /.github/actions/resolve-version
    schedule:
      interval: weekly
    groups:
      actions-patch-minor:
        patterns:
          - "*"
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images-patch-minor:
        patterns:
          - "*"
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: maven
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-patch-minor:
        patterns:
          - "*"
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      root-npm-patch-minor:
        patterns:
          - "*"
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /apps/staff-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      staff-web-npm-patch-minor:
        patterns:
          - "*"
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /apps/patient-mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patient-mobile-npm-patch-minor:
        patterns:
          - "*"
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
