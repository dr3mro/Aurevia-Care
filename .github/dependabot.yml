version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/java-verify
      - /.github/actions/resolve-version
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/staff-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/patient-mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
