name: Main repair
# Watches Delivery, Heavy verification and the image builds on main. When one
# fails, starts one repair worker with the failing log. The fix is a pull request
# labeled autofix that fix-pr-watchdog.yml validates on a pull_request event,
# then hands to the integrator; a fix that did not work starts the next repair.
# It stops after three tries in 24 hours and opens an issue.
on:
  workflow_run:
    workflows: [Delivery, Heavy verification, Agent image, Swarm slot images]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: main-repair
  cancel-in-progress: false
  queue: max
jobs:
  repair:
    name: Start a repair
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/swarm
      - name: Decide whether to repair
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 -I scripts/swarm.py repair-gate --run "$RUN_ID"
      - name: Start one repair worker with the failing log
        if: steps.gate.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh workflow run swarm.yml -f workers=1 -f repair_run="$RUN_ID"
