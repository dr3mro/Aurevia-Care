name: Daily DevSecOps review
# Once a day a read-only DevSecOps agent reviews the whole repo and writes one JSON file: tasks for the
# swarm, suggestions for the agents and suggestions for the workflow. A separate trusted job
# validates it, adds the valid tasks to the task files on main and puts the suggestions in one
# issue for a person. Nothing about agents or workflows is applied automatically. The reviewer
# never holds a GitHub token. It uses slot 5's account so it never competes with swarm worker slot 1.
on:
  schedule:
    - cron: '29 9 * * *'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Review focus for this run (optional; default is the weekday focus)'
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
  # Keep every waiting run: without this a newer trigger replaces a waiting one,
  # so a failure event or the 2 AM run could be dropped.
env:
  SWARM_GIT_NAME: ${{ vars.SWARM_GIT_NAME }}
  SWARM_GIT_EMAIL: ${{ vars.SWARM_GIT_EMAIL }}

jobs:
  admission:
    uses: ./.github/workflows/swarm-daily-admission.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
  prep:
    needs: admission
    if: needs.admission.outputs.ready == 'true'
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-agent-5:latest" >> "$GITHUB_OUTPUT"
  review:
    name: Review the repo (devsecops)
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ${{ needs.prep.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      # Only these repository variables select a model, through the centralized router.
      SWARM_MODEL: ${{ vars.SWARM_MODEL }}
      SWARM_FORCE_MODEL: ${{ vars.SWARM_FORCE_MODEL }}
      SWARM: '1'
      AGENT_TIMEOUT: 100m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 25
          persist-credentials: false
      - name: Run the review (no GitHub token in this step)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_5 || secrets.OPENCODE_API_KEY }}
          DAILY_FOCUS: ${{ inputs.focus }}
        run: scripts/agent-run.sh daily-devsecops
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: daily-devsecops
          path: .agents/daily-devsecops.json
          if-no-files-found: ignore
          retention-days: 1
  publish:
    name: Add tasks and open the suggestions issue
    needs: review
    if: always() && needs.review.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: daily-devsecops
          path: review
      - name: Warn when SWARM_TOKEN is not configured
        env:
          HAS_SWARM_TOKEN: ${{ secrets.SWARM_TOKEN != '' }}
        run: |
          if [[ "$HAS_SWARM_TOKEN" != "true" ]]; then
            echo "::warning title=SWARM_TOKEN missing::Falling back to the job token: it cannot push workflow files or open pull requests that trigger other workflows."
          fi
      - name: Publish the review
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          GH_ISSUES_TOKEN: ${{ github.token }}
        run: python3 -I scripts/swarm.py daily-publish --role devsecops --findings review/daily-devsecops.json
