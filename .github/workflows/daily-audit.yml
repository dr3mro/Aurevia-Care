name: Daily audit
# Once a day a read-only worker audits the whole repo and writes findings as JSON.
# A separate trusted job validates them and appends new task files under tasks/ on main
# for the swarm to take. The audit worker never holds a GitHub token. It uses slot 2's
# account so it never competes with swarm worker slot 1 for the free quota.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Audit focus for this run (optional; default is the weekday focus)'
        default: ''
permissions:
  contents: read
concurrency:
  group: daily-audit
  cancel-in-progress: false
  queue: max
  # Keep every waiting run: without this a newer trigger replaces a waiting one,
  # so a failure event or the 2 AM run could be dropped.
env:
  SWARM_GIT_NAME: ${{ vars.SWARM_GIT_NAME }}
  SWARM_GIT_EMAIL: ${{ vars.SWARM_GIT_EMAIL }}

jobs:
  admission:
    uses: ./.github/workflows/swarm-daily-admission.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
  prep:
    needs: admission
    if: needs.admission.outputs.ready == 'true'
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-agent-2:latest" >> "$GITHUB_OUTPUT"
  audit:
    name: Audit the repo
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ${{ needs.prep.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      # A repository variable lets an operator change the agent model without editing workflows.
      # Base model hint only; the centralized model-router owns all selection.
      MODEL: opencode-go/hy4-flash-free
      SWARM_MODEL: ${{ vars.SWARM_MODEL }}
      SWARM_FORCE_MODEL: ${{ vars.SWARM_FORCE_MODEL }}
      SWARM: '1'
      AGENT_TIMEOUT: 100m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 25
          persist-credentials: false
      - name: Run the audit (no GitHub token in this step)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_2 || secrets.OPENCODE_API_KEY }}
          AUDIT_FOCUS: ${{ inputs.focus }}
        run: scripts/agent-run.sh audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: audit-findings
          path: .agent/audit-findings.json
          if-no-files-found: ignore
          retention-days: 1
  append:
    name: Add findings to tasks/
    needs: audit
    if: always() && needs.audit.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: audit-findings
          path: findings
      - name: Warn when SWARM_TOKEN is not configured
        env:
          HAS_SWARM_TOKEN: ${{ secrets.SWARM_TOKEN != '' }}
        run: |
          if [[ "$HAS_SWARM_TOKEN" != "true" ]]; then
            echo "::warning title=SWARM_TOKEN missing::Falling back to the job token: it cannot push workflow files or open pull requests that trigger other workflows."
          fi
      - name: Validate the findings and append new tasks
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
        run: python3 -I scripts/swarm.py add-audit-tasks --findings findings/audit-findings.json
