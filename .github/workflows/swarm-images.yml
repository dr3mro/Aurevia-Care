name: Swarm slot images
# Builds one prepared image per worker slot (ghcr.io/<repo>-agent-<slot>) on top
# of the base image. Each slot bakes its own OpenCode model and config from
# .github/swarm/slots.json. Credentials are never baked in.
on:
  push:
    branches: [main]
    paths: ['.github/swarm/slots.json', '.github/agent-image/Dockerfile.slot',
            '.github/workflows/swarm-images.yml']
  workflow_run:
    workflows: [Agent image]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
# Queue: a cancelled slot-image publish leaves workers on a stale base.
concurrency:
  group: swarm-images
  cancel-in-progress: false
  queue: max
env:
  SWARM_GIT_NAME: ${{ vars.SWARM_GIT_NAME }}
  SWARM_GIT_EMAIL: ${{ vars.SWARM_GIT_EMAIL }}

jobs:
  build:
    name: Slot images
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/swarm
            .github/agent-image
      # One runner builds every slot: the slot layer is tiny and the base image
      # is pulled once, so ten separate runners only added startup time.
      - name: Build and push the slot images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="ghcr.io/${GITHUB_REPOSITORY,,}-agent:latest"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$base"
          GITHUB_OUTPUT=slots.out python3 -I scripts/swarm.py slot-matrix
          slots=$(sed -n 's/^matrix=//p' slots.out | jq -r '.slot[]')
          generation="run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          base_digest=$(docker image inspect "$base" --format '{{index .RepoDigests 0}}')
          printf '{}\n' > slot-images.json
          for slot in $slots; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-agent-${slot}"
            config=$(python3 -I scripts/swarm.py slot-config --slot "$slot")
            docker build -f .github/agent-image/Dockerfile.slot \
              --build-arg "BASE=$base_digest" --build-arg "SLOT=$slot" --build-arg "SLOT_CONFIG=$config" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              -t "$image:$generation" .github/agent-image
            docker push "$image:$generation"
            digest=$(docker buildx imagetools inspect "$image:$generation" --format '{{json .Manifest}}' | jq -er .digest)
            jq --arg slot "$slot" --arg image "$image@$digest" '. + {($slot): $image}' slot-images.json > slot-images.tmp
            mv slot-images.tmp slot-images.json
          done
          # Compatibility tags for single-slot support jobs. Swarm waves consume
          # only the complete digest manifest from a successful run.
          for slot in $slots; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-agent-${slot}"
            docker tag "$image:$generation" "$image:latest"
            docker push "$image:latest"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: verified-slot-images
          path: slot-images.json
          if-no-files-found: error
          retention-days: 90
