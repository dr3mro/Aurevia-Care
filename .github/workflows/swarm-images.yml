name: Swarm slot images
# Builds one prepared image per worker slot (ghcr.io/<repo>-agent-<slot>) on top
# of the base image. Each slot bakes only the shared OpenCode config from
# .opencode/config/slots.json; no model is baked in. The router selects the model
# at run time. Credentials are never baked in.
on:
  push:
    branches: [main]
    paths: ['.opencode/config/slots.json', '.github/agent-image/Dockerfile.slot',
            '.github/workflows/swarm-images.yml']
  workflow_run:
    workflows: [Agent image]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
# Queue: a cancelled slot-image publish leaves workers on a stale base.
concurrency:
  group: swarm-images-${{ github.run_id }}
  cancel-in-progress: false
env:
  SWARM_GIT_NAME: ${{ vars.SWARM_GIT_NAME }}
  SWARM_GIT_EMAIL: ${{ vars.SWARM_GIT_EMAIL }}

jobs:
  build:
    name: Slot images
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # slot-matrix and slot-config read .opencode/config/slots.json; the
          # swarm configuration now lives under .opencode/; the former location was removed.
          sparse-checkout: |
            scripts
            .opencode/config
            .github/agent-image
      # One runner builds every slot: the slot layer is tiny and the base image
      # is pulled once, so ten separate runners only added startup time.
      - name: Build and push the slot images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="ghcr.io/${GITHUB_REPOSITORY,,}-agent:latest"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Resolve the mutable tag once, then build from the immutable digest.
          # A tag that moves during the build cannot change the worker image.
          base_ref="$base@$(docker buildx imagetools inspect "$base" \
            --format '{{json .Manifest}}' | jq -er .digest)"
          docker pull "$base_ref"
          docker buildx imagetools inspect "$base_ref" >/dev/null
          echo "Slot images build from $base_ref"
          GITHUB_OUTPUT=slots.out python3 -I scripts/swarm.py slot-matrix
          slots=$(sed -n 's/^matrix=//p' slots.out | jq -r '.slot[]')
          for slot in $slots; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-agent-${slot}"
            config=$(python3 -I scripts/swarm.py slot-config --slot "$slot")
            docker build -f .github/agent-image/Dockerfile.slot \
              --build-arg "BASE=$base_ref" --build-arg "SLOT=$slot" --build-arg "SLOT_CONFIG=$config" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.base.digest=$base_ref" \
              -t "$image:latest" .github/agent-image
            docker push "$image:latest"
          done
