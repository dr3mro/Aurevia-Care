name: Delivery
on:
  workflow_dispatch:
  # Every PR must report the required "Delivery gate" check. A path-filtered
  # PR never starts this workflow, so branch protection waits forever for a
  # check that cannot be created.
  pull_request:
  # No path filters on either trigger. A filtered push leaves the exact-SHA
  # "Delivery gate" check unreported and blocks the protected branch forever;
  # correctness takes precedence over skipping documentation-only runs.
  push:
    branches: [main]
    tags: ['v*']
  merge_group:
permissions:
  contents: read
# Branch protection checks the exact SHA, so a push to main or a tag must keep
# every verdict: never cancel it. A PR can only merge its current head, and an
# older head is never merged, so a new push cancels the stale run instead of
# queueing behind it -- otherwise the current head's "Delivery gate" check is
# never reported and branch protection blocks the PR. queue:max still applies
# to the non-cancelling triggers and keeps one queued run per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: max

jobs:
  policy:
    name: Policy and tooling
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The constraint check diffs against origin/main, so it needs the history.
          fetch-depth: 0
      - name: Shell syntax and lint
        run: |
          files=(scripts/*.sh infra/bootstrap/start.sh apps/api/check.sh db/check.sh)
          for file in "${files[@]}"; do bash -n "$file"; done
          shellcheck "${files[@]}"
      - name: Workflow lint (actionlint)
        run: |
          python3 -m venv "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/bin/pip" install -q actionlint-py==1.7.12.25
          # actionlint 1.7.12 predates GitHub's concurrency `queue` key. Ignore
          # only that unknown-key message; scripts/tests/test_workflow_concurrency.py
          # asserts every workflow declares queue: max.
          "$RUNNER_TEMP/actionlint/bin/actionlint" \
            -ignore 'unexpected key "queue" for "concurrency" section'
      - name: Agent pack, docs and secret checks
        run: |
          python3 -I scripts/project-name.py displayName >/dev/null
          python3 -I scripts/project-name.py repositorySlug >/dev/null
          python3 -I scripts/check-pack.py
          python3 -I scripts/check-docs.py
          python3 -I scripts/check-secrets.py
          python3 -I scripts/check-names.py
          python3 -I scripts/check-wiring.py
          python3 -I scripts/check-constraints.py --require-base
          python3 -I scripts/check-migrations.py --require-baseline

  script-tests:
    name: Delivery tooling tests
    needs: policy
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling-python
      - run: python3 -I -m unittest discover -s scripts/tests -q

  frontend:
    name: Frontend standards
    needs: script-tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      # Runs tsc --noEmit, eslint --max-warnings=0, prettier --check and Vitest
      # with 100% coverage thresholds. Agents cannot merge TypeScript that
      # violates AGENTS.md because this is a required check.
      - run: bash scripts/frontend-check.sh

  # The same full verification (unit and PostgreSQL integration tests, JaCoCo,
  # SpotBugs, OWASP) runs on pull requests, merge groups and main. A pull request
  # that is green here cannot turn main red, whoever merges it.
  java-verify:
    name: Java and database verification
    needs: frontend
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/java-verify
        with:
          pg-admin: postgres
          nvd-api-key: ${{ secrets.NVD_API_KEY }}

  docs:
    name: Developer reference
    needs: java-verify
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Doxygen
        # Ubuntu mirrors occasionally return 503; retry before failing the
        # whole developer-reference job on infrastructure noise.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq doxygen; then
              exit 0
            fi
            echo "apt install attempt $attempt failed; retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Build developer reference
        run: scripts/docs.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: developer-reference
          path: build/developer-reference/html
          if-no-files-found: error

  verify:
    name: Verify and smoke image (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs: docs
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # arm64 is built only for a release tag; every other run needs amd64.
      matrix: ${{ fromJSON(github.ref_type == 'tag' && '{"include":[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}' || '{"include":[{"arch":"amd64","runner":"ubuntu-24.04"}]}') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/resolve-version
        id: version
      - name: Build and smoke-test the image
        env:
          VERSION: ${{ steps.version.outputs.value }}
          OREVIA_SKIP_CHECKS: '1'
        run: scripts/verify.sh "$VERSION"
      - name: Save smoke-tested image for a release
        if: github.ref_type == 'tag'
        run: docker save orevia:test -o orevia-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.ref_type == 'tag'
        with:
          name: smoke-tested-image-${{ matrix.arch }}
          path: orevia-image.tar

  release:
    name: Publish tagged test image and release
    if: github.ref_type == 'tag'
    needs: verify
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: smoke-tested-image-*
      - name: Require a green default-branch run for this commit
        env:
          # Read-only API call: the job token is sufficient.
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          total=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/delivery.yml/runs" \
            -f branch="$DEFAULT_BRANCH" -f head_sha="$GITHUB_SHA" -f event=push -f status=success \
            --jq '.total_count')
          [[ "$total" -gt 0 ]]
      - name: Publish exact tested image and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          refs=()
          for arch in amd64 arm64; do
            docker load -i "smoke-tested-image-$arch/orevia-image.tar"
            test "$(docker image inspect orevia:test --format '{{.Architecture}}')" = "$arch"
            test "$(docker image inspect orevia:test --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
            test "$(docker image inspect orevia:test --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
            child="$image-$arch"
            if docker buildx imagetools inspect "$child" >/dev/null 2>&1; then
              docker pull --platform "linux/$arch" "$child"
              test "$(docker image inspect "$child" --format '{{.Id}}')" = "$(docker image inspect orevia:test --format '{{.Id}}')"
            else
              docker tag orevia:test "$child"
              docker push "$child"
            fi
            refs+=("$(docker image inspect "$child" --format '{{index .RepoDigests 0}}')")
          done
          if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            docker buildx imagetools create --tag "$image" "${refs[@]}"
          fi
          manifest=$(docker buildx imagetools inspect "$image" --raw)
          for child in "${refs[@]}"; do
            jq -e --arg digest "${child##*@}" '.manifests | any(.digest == $digest)' <<< "$manifest" >/dev/null
          done
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er .digest)
          digest="${image%:*}@$digest"
          # shellcheck disable=SC2016
          printf 'Smoke-tested image: `%s`\nCommit: `%s`\n' "$digest" "$GITHUB_SHA" > release-notes.md
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            args=()
            if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$VERSION" --verify-tag --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file release-notes.md "${args[@]}"
          fi

  # One stable check name for branch protection and the merge queue. Require
  # "Delivery gate" and nothing else. The gate fails closed through
  # scripts/check-delivery-gate.py: a mandatory job (policy, script-tests,
  # frontend, java-verify, docs) must report success, and a conditional job may
  # be skipped only when its documented condition justifies it -- verify only on
  # pull requests, release only off a tag. A missing, failed, cancelled or
  # unjustified-skipped job fails the gate, and a job added to `needs` without
  # updating the contract fails too, so nothing can be dropped in silence.
  gate:
    name: Delivery gate
    if: always()
    needs: [policy, script-tests, frontend, java-verify, docs, verify, release]
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every verification job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 scripts/check-delivery-gate.py \
            --results "$RESULTS" \
            --event-name "$EVENT_NAME" \
            --ref-type "$REF_TYPE"
