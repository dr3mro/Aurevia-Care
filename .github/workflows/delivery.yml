name: Delivery
on:
  workflow_dispatch:
  # Every PR must report the required "Delivery gate" check. A path-filtered
  # PR never starts this workflow, so branch protection waits forever for a
  # check that cannot be created.
  pull_request:
  # No path filters on either trigger. A filtered push leaves the exact-SHA
  # "Delivery gate" check unreported and blocks the protected branch forever;
  # correctness takes precedence over skipping documentation-only runs.
  push:
    branches: [main]
    tags: ['v*']
  merge_group:
permissions:
  contents: read
# Every pull-request head, tag and merge group keeps its own exact-SHA verdict.
# A workflow_dispatch on a branch gets a run-id group, so a later push cannot cancel
# it. Only superseded branch pushes are cancelled: a newer commit replaces the older
# run instead of waiting behind the full gate. GitHub rejects queue:max together with
# cancellation, so Delivery has no queue key; the swarm queues keep queue:max.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('delivery-dispatch-{0}-{1}', github.ref, github.run_id) || github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  policy:
    name: Policy and tooling
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The constraint check diffs against origin/main, so it needs the history.
          fetch-depth: 0
      - name: Shell syntax and lint
        run: |
          files=(scripts/*.sh infra/bootstrap/start.sh infra/app/start.sh apps/api/check.sh db/check.sh)
          for file in "${files[@]}"; do bash -n "$file"; done
          shellcheck "${files[@]}"
      - name: Workflow lint (actionlint)
        run: |
          python3 -m venv "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/bin/pip" install -q actionlint-py==1.7.12.25
          # actionlint 1.7.12 predates GitHub's concurrency `queue` key. Ignore
          # only that unknown-key message; test_workflow_concurrency.py asserts
          # exact queueing contracts for Delivery, planning and integration.
          "$RUNNER_TEMP/actionlint/bin/actionlint" \
            -ignore 'unexpected key "queue" for "concurrency" section'
      - name: Agent pack, docs and secret checks
        run: |
          python3 -I scripts/project-name.py displayName >/dev/null
          python3 -I scripts/project-name.py repositorySlug >/dev/null
          python3 -I scripts/check-pack.py
          python3 -I scripts/check-docs.py
          python3 -I scripts/check-secrets.py
          python3 -I scripts/check-names.py
          python3 -I scripts/check-wiring.py
          python3 -I scripts/check-constraints.py --require-base
          python3 -I scripts/check-migrations.py --require-baseline

  script-tests:
    name: Delivery tooling tests
    needs: policy
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # python-coverage.sh diffs added script lines against origin/main;
          # a shallow PR checkout has no such ref and would skip that check.
          fetch-depth: 0
      - uses: ./.github/actions/setup-tooling-python
      - name: Tooling tests with the changed-line coverage gate
        env:
          REQUIRE_PY_COVERAGE: '1'
        run: bash scripts/python-coverage.sh

  frontend:
    name: Frontend standards
    needs: script-tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      # The policy script keeps repository-wide standards (npm audit,
      # TypeScript-only, strict configs, generated-client drift) but uses plain
      # npm test, which has no coverage threshold. Each module's canonical
      # check.sh adds typecheck, lint and its enforced 100% coverage gate;
      # staff-web also builds and applies the WEB-08 bundle-size gate.
      - name: Frontend policy and tool commands
        run: bash scripts/frontend-check.sh
      - name: Staff web canonical check (typecheck, lint, size gate, 100% coverage)
        run: bash apps/staff-web/check.sh
      - name: Patient mobile canonical check (typecheck, lint, 100% coverage)
        run: bash apps/patient-mobile/check.sh

  # The same full verification (unit and PostgreSQL integration tests, JaCoCo,
  # SpotBugs, OWASP) runs on pull requests, merge groups and main. A pull request
  # that is green here cannot turn main red, whoever merges it.
  java-verify:
    name: Java and database verification
    # Independent of frontend; both wait only for script-tests so the two
    # slowest jobs run in parallel. The gate still requires both to pass.
    needs: script-tests
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/java-verify
        with:
          pg-admin: postgres
          # Candidate PR/merge-group code and dispatch on any other ref must
          # never receive repository secrets. Trusted main/tag pushes and a
          # default-branch dispatch (the recovery for a cancelled push run) may
          # refresh NVD; other events use the cache.
          nvd-api-key: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && secrets.NVD_API_KEY || '' }}

  docs:
    name: Developer reference
    # Join both verification branches before continuing to verify/gate.
    needs: [frontend, java-verify]
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Doxygen
        # Ubuntu mirrors occasionally return 503; retry before failing the
        # whole developer-reference job on infrastructure noise.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq doxygen; then
              exit 0
            fi
            echo "apt install attempt $attempt failed; retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Build developer reference
        run: scripts/docs.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: developer-reference
          path: build/developer-reference/html
          if-no-files-found: error

  verify:
    name: Verify and smoke image (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs: docs
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # arm64 is built only for a release tag; every other run needs amd64.
      matrix: ${{ fromJSON(github.ref_type == 'tag' && '{"include":[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}' || '{"include":[{"arch":"amd64","runner":"ubuntu-24.04"}]}') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/resolve-version
        id: version
      - name: Build and smoke-test the image
        env:
          VERSION: ${{ steps.version.outputs.value }}
          AUREVIA_SKIP_CHECKS: '1'
        run: scripts/verify.sh "$VERSION"
      - name: Save smoke-tested image for a release
        if: github.ref_type == 'tag'
        run: docker save aurevia:test -o aurevia-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.ref_type == 'tag'
        with:
          name: smoke-tested-image-${{ matrix.arch }}
          path: aurevia-image.tar

  release:
    name: Publish tagged test image and release
    if: github.ref_type == 'tag'
    needs: verify
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      # The trusted precondition helper must exist even when the tag points to
      # a commit older than the helper, so check out the default branch, not
      # the tagged tree, and do not keep a credential in this workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: smoke-tested-image-*
      - name: Require a green default-branch run for this commit
        env:
          # Read-only API call: the job token is sufficient.
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          runs_json=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/delivery.yml/runs" \
            -f branch="$DEFAULT_BRANCH" -f head_sha="$GITHUB_SHA" --jq '.')
          jobs_json='{}'
          for run_id in $(jq -r --arg sha "$GITHUB_SHA" \
              '.workflow_runs[] | select(.head_sha == $sha) | .id' <<< "$runs_json"); do
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "release base: invalid run id from GitHub" >&2
              exit 1
            fi
            job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
              --jq "{\"$run_id\": .jobs}")
            jobs_json=$(jq -c --argjson job "$job" '. + $job' <<< "$jobs_json")
          done
          jq -n --argjson runs "$runs_json" --argjson jobs "$jobs_json" \
            '{runs: $runs, jobs: $jobs}' | python3 -I scripts/check-release-base.py \
            --sha "$GITHUB_SHA" --branch "$DEFAULT_BRANCH" --repo "$GITHUB_REPOSITORY"
      - name: Publish exact tested image and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Version and revision labels are the stable identity of a release. A
          # rebuild records a fresh "created" time and gets a new .Id even for
          # the same commit, so image IDs cannot identify a published version.
          version_label='{{index .Config.Labels "org.opencontainers.image.version"}}'
          revision_label='{{index .Config.Labels "org.opencontainers.image.revision"}}'
          # A published version is immutable. Refuse before any child push if a
          # manifest or a GitHub release already exists for this version.
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "::error::$image already exists; version tags are immutable" >&2
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $VERSION already exists; version tags are immutable" >&2
            exit 1
          fi
          children=()
          for arch in amd64 arm64; do
            docker load -i "smoke-tested-image-$arch/aurevia-image.tar"
            test "$(docker image inspect aurevia:test --format '{{.Architecture}}')" = "$arch"
            test "$(docker image inspect aurevia:test --format "$revision_label")" = "$GITHUB_SHA"
            test "$(docker image inspect aurevia:test --format "$version_label")" = "$VERSION"
            child="$image-$arch"
            # docker load restores only aurevia:test; the architecture tag must
            # exist locally before it can be pushed on a first release.
            docker tag aurevia:test "$child"
            if docker pull --platform "linux/$arch" "$child" >/dev/null 2>&1; then
              # Already published: reuse it only when its provenance is this
              # exact release. A different revision under the same version is
              # a re-pointed tag, not a retry.
              existing_revision=$(docker image inspect "$child" --format "$revision_label")
              existing_version=$(docker image inspect "$child" --format "$version_label")
              if [[ "$existing_revision" != "$GITHUB_SHA" ]]; then
                echo "::error::version $VERSION already published for revision $existing_revision; use a new version tag" >&2
                exit 1
              fi
              if [[ "$existing_version" != "$VERSION" ]]; then
                echo "::error::$child has version $existing_version, expected $VERSION" >&2
                exit 1
              fi
            else
              # A failed pull means absent; a visible manifest contradicts that
              # and must never be overwritten on a transient registry error.
              if docker buildx imagetools inspect "$child" >/dev/null 2>&1; then
                echo "::error::cannot pull existing $child; refusing to overwrite" >&2
                exit 1
              fi
              docker push "$child"
            fi
            children+=("$child")
          done
          # Use tag refs, as release-app-image.yml does, so buildx resolves them
          # with the logged-in registry scope; digest refs are not needed.
          docker buildx imagetools create --tag "$image" "${children[@]}"
          manifest=$(docker buildx imagetools inspect "$image" --raw)
          for child in "${children[@]}"; do
            digest=$(docker buildx imagetools inspect "$child" --format '{{json .Manifest}}' | jq -er .digest)
            jq -e --arg digest "$digest" '.manifests | any(.digest == $digest)' <<< "$manifest" >/dev/null
          done
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er .digest)
          digest="${image%:*}@$digest"
          # shellcheck disable=SC2016
          printf 'Smoke-tested image: `%s`\nCommit: `%s`\n' "$digest" "$GITHUB_SHA" > release-notes.md
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            args=()
            if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$VERSION" --verify-tag --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file release-notes.md "${args[@]}"
          fi

  # One stable check name for branch protection and the merge queue. Require
  # "Delivery gate" and nothing else. The gate fails closed through
  # scripts/check-delivery-gate.py: a mandatory job (policy, script-tests,
  # frontend, java-verify, docs) must report success, and a conditional job may
  # be skipped only when its documented condition justifies it -- verify only on
  # pull requests, release only off a tag. A missing, failed, cancelled or
  # unjustified-skipped job fails the gate, and a job added to `needs` without
  # updating the contract fails too, so nothing can be dropped in silence.
  gate:
    name: Delivery gate
    if: always()
    needs: [policy, script-tests, frontend, java-verify, docs, verify, release]
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every verification job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 scripts/check-delivery-gate.py \
            --results "$RESULTS" \
            --event-name "$EVENT_NAME" \
            --ref-type "$REF_TYPE"
