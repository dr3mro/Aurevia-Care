name: Publish developer reference

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy developer reference to GitHub Pages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Doxygen
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq doxygen; then
              exit 0
            fi
            echo "apt install attempt $attempt failed; retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Build developer reference
        run: scripts/docs.sh
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/developer-reference/html
          # A rerun keeps the previous attempt's artifact in this run. A fixed
          # name would leave two artifacts and break deploy-pages' exact lookup.
          name: github-pages-${{ github.run_attempt }}
      # A rerun can upload the artifact seconds before deploy-pages queries the
      # metadata API, which then reports zero artifacts. Poll this run's artifacts
      # for the attempt-scoped name and fail closed if it never becomes visible;
      # a canonical fixed name would leave two artifacts and break exact lookup.
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                --jq ".artifacts[] | select(.name == \"github-pages-${GITHUB_RUN_ATTEMPT}\") | .id")
            if [[ -n "$ids" ]]; then
              exit 0
            fi
            echo "Pages artifact metadata not visible yet (attempt ${attempt})" >&2
            sleep 5
          done
          echo "::error::Pages artifact metadata never became visible" >&2
          exit 1
      # The REST listing above proved only one view of artifact metadata. Run
      # 46039411004 showed deploy-pages can see zero artifacts moments later, so
      # allow one bounded retry after the replicas settle. If the lag is not
      # transient the guard below fails closed; it never reports a false success.
      - name: Deploy to GitHub Pages (first attempt)
        id: deploy_first
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before Pages deploy retry
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 20
      - name: Retry Pages deployment
        id: deploy_retry
        if: steps.deploy_first.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify Pages deployment
        id: deployment
        if: always()
        env:
          FIRST_OUTCOME: ${{ steps.deploy_first.outcome }}
          RETRY_OUTCOME: ${{ steps.deploy_retry.outcome }}
          FIRST_URL: ${{ steps.deploy_first.outputs.page_url }}
          RETRY_URL: ${{ steps.deploy_retry.outputs.page_url }}
        run: |
          if [[ "$FIRST_OUTCOME" == success || "$RETRY_OUTCOME" == success ]]; then
            url="${FIRST_URL:-$RETRY_URL}"
            {
              echo "page_url<<EOF"
              printf '%s\n' "$url"
              echo EOF
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Pages deployment did not succeed (first=$FIRST_OUTCOME retry=$RETRY_OUTCOME)" >&2
          exit 1
