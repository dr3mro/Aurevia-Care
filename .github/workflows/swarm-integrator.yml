name: Swarm integrator
# Integrates every ready swarm pull request in one job: merge one at a time on
# top of main, run the FULL gate (scripts/check.sh with PostgreSQL and NVD) after
# each, then push once. A PR that fails SpotBugs, coverage, Doxygen or DB policy
# never reaches main. Delivery then verifies the pushed commit on main.
# Called by swarm.yml after the workers of every wave (one scheduler, no
# workflow_run chain) and runnable by hand.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swarm-integrator
  cancel-in-progress: false
env:
  SWARM_GIT_NAME: ${{ vars.SWARM_GIT_NAME }}
  SWARM_GIT_EMAIL: ${{ vars.SWARM_GIT_EMAIL }}

jobs:
  pick:
    name: Pick the queue
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      queue: ${{ steps.queue.outputs.queue }}
      count: ${{ steps.queue.outputs.count }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-agent-3:latest" >> "$GITHUB_OUTPUT"
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/swarm.py plan-integration

  integrate:
    name: Integrate the ready batch
    needs: pick
    if: needs.pick.outputs.count != '0'
    runs-on: ubuntu-24.04
    # Up to ten PRs, each with the full gate, so 45 minutes cut batches short.
    timeout-minutes: 120
    outputs:
      conflicted: ${{ steps.merge.outputs.conflicted }}
    permissions:
      contents: write
      pull-requests: write
      # Labels are written through the Issues API, so PR write alone is not enough.
      issues: write
      actions: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
      GH_ISSUES_TOKEN: ${{ github.token }}
      SMARTCLINIC_PG_ADMIN: postgres
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java once for the whole batch
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache OWASP NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Doxygen
        # Required by scripts/docs.sh (WARN_AS_ERROR) so Javadoc defects are
        # caught before the PR is merged. Retry transient apt mirror 503s.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq doxygen; then
              exit 0
            fi
            echo "apt install attempt $attempt failed; retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1
      # One job for the batch. The trusted command keeps GH_TOKEN for guard,
      # merge and finalize, and strips it from the gate subprocess so agent-written
      # code never sees a token. Delivery re-verifies main after the push.
      - name: Merge each PR, gate, then push once
        id: merge
        env:
          QUEUE: ${{ needs.pick.outputs.queue }}
          GATE: scripts/integrator-gate.sh
        run: python3 -I scripts/swarm.py integrate-batch --queue "$QUEUE" --gate "$GATE"

  # A PR that conflicts with main is not failed right away: the agent merges main
  # into its branch and fixes the conflicts, then a separate trusted job pushes
  # the result and the integrator runs again. After three tries the PR goes back
  # to the workers. The agent and the push token never share a runner.
  resolve:
    name: Resolve merge conflicts
    needs: [pick, integrate]
    if: always() && needs.integrate.outputs.conflicted != '' && needs.integrate.outputs.conflicted != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ${{ needs.pick.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      CONFLICTED: ${{ needs.integrate.outputs.conflicted }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      MODEL: opencode-go/hy4-flash-free
      SWARM: '1'
      CHECK_SCRIPT: scripts/quick-check.sh
      MERGE_ATTEMPTS: '5'
      AGENT_TIMEOUT: 20m
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # The read-only token is used here, before the agent has run anything.
      - name: Fetch main and the conflicted branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/agent-run.sh fetch-main
          scripts/agent-run.sh fetch-prs
      - name: Merge main into each branch and fix the conflicts (no GitHub token in this step)
        timeout-minutes: 75
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_3 || secrets.OPENCODE_API_KEY }}
        run: scripts/agent-run.sh resolve
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resolved-branches
          path: .agent/resolve
          if-no-files-found: ignore
          retention-days: 1
  resolve-publish:
    name: Push resolved branches
    needs: [pick, resolve]
    if: always() && needs.resolve.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      # Trusted copy of the scripts from main, in a runner the agent never touched.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: resolved-branches
          path: resolved
      - name: Push the resolved branches or send them back
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          GH_ISSUES_TOKEN: ${{ github.token }}
        run: python3 -I scripts/swarm.py resolve-publish --dir resolved
