name: Swarm integrator
# Integrates every ready swarm pull request in one job: merge one at a time on
# top of main, run a gate after each, then push once. Story PRs run the full
# scripts/integrator-gate.sh (check.sh with PostgreSQL and NVD): a PR that fails
# SpotBugs, coverage, Doxygen or DB policy never reaches main. Repair PRs use the
# reduced scripts/repair-gate.sh so one red class cannot block every other repair;
# Delivery runs the full tier on the merged commit and the next repair fixes a
# regression. Delivery then verifies the pushed commit on main.
# Called by swarm.yml after the workers of every wave (one scheduler, no
# workflow_run chain) and runnable by hand.
on:
  workflow_call:
    secrets:
      GITHUB_TOKEN:
        required: false
      SWARM_TOKEN:
        required: false
      OPENCODE_API_KEY:
        required: false
      OPENCODE_API_KEY_3:
        required: false
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swarm-integrator
  cancel-in-progress: false
  queue: max
env:
  SWARM_GIT_NAME: ${{ vars.SWARM_GIT_NAME }}
  SWARM_GIT_EMAIL: ${{ vars.SWARM_GIT_EMAIL }}
  # Kill switch: set the repository variable SWARM_ALLOW_PROTECTED to 1 to merge protected files
  # automatically (full gate still runs); delete it or set it to 0 to restore the secure rule.
  SWARM_ALLOW_PROTECTED: ${{ vars.SWARM_ALLOW_PROTECTED }}

jobs:
  pick:
    name: Pick the queue
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      queue: ${{ steps.queue.outputs.queue }}
      count: ${{ steps.queue.outputs.count }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-agent-3:latest" >> "$GITHUB_OUTPUT"
      - id: queue
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
        run: python3 -I scripts/swarm.py plan-integration

  # Candidate code is merged and gated here with NO write token and NO secrets.
  # It emits the validated tip and PR head SHAs plus a bundle; the publish job
  # below runs trusted scripts only and re-checks every SHA before any write.
  validate:
    name: Validate the ready batch (no secrets)
    needs: pick
    if: needs.pick.outputs.count != '0'
    runs-on: ubuntu-24.04
    # Up to ten PRs, each with the full gate, so 45 minutes cut batches short.
    timeout-minutes: 120
    outputs:
      conflicted: ${{ steps.candidate.outputs.conflicted }}
      accepted: ${{ steps.candidate.outputs.accepted }}
      report: ${{ steps.candidate.outputs.report }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    services:
      postgres:
        image: postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Read-only token for listing PR heads only. No SWARM_TOKEN and no NVD key:
      # OWASP scans the restored cache and still fails on CVSS >= 7.
      GH_TOKEN: ${{ github.token }}
      AUREVIA_PG_ADMIN: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java once for the whole batch
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache OWASP NVD data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Doxygen
        # Required by scripts/docs.sh (WARN_AS_ERROR) so Javadoc defects are
        # caught before the PR is merged. Retry transient apt mirror 503s.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq doxygen; then
              exit 0
            fi
            echo "apt install attempt $attempt failed; retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - uses: ./.github/actions/setup-tooling-python
      - name: Merge each PR locally and gate it without credentials
        id: candidate
        env:
          QUEUE: ${{ needs.pick.outputs.queue }}
          GATE: scripts/integrator-gate.sh
        run: python3 -I scripts/swarm.py integrate-validate --queue "$QUEUE" --gate "$GATE" --out validated
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: validated-batch
          path: validated
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the validated batch
    needs: [pick, validate]
    if: >-
      (needs.validate.outputs.accepted != '' && needs.validate.outputs.accepted != '[]')
      || (needs.validate.outputs.conflicted != '' && needs.validate.outputs.conflicted != '[]')
      || (needs.validate.outputs.report != '' && needs.validate.outputs.report != '[]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # Labels are written through the Issues API, so PR write alone is not enough.
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
      GH_ISSUES_TOKEN: ${{ github.token }}
    steps:
      # Trusted scripts from main on a runner candidate code never touched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: validated-batch
          path: validated
      - uses: ./.github/actions/setup-tooling-python
      - name: Push only the exact validated commit SHAs
        env:
          GATE: scripts/integrator-gate.sh
        run: python3 -I scripts/swarm.py integrate-publish --manifest validated/manifest.json --bundle validated/main.bundle --gate "$GATE"
      - name: Reconcile tasks whose PRs merged
        if: always()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -I scripts/swarm.py reconcile-tasks --dir tasks

  # A PR that conflicts with main is not failed right away: the agent merges main
  # into its branch and fixes the conflicts, then a separate trusted job pushes
  # the result and the integrator runs again. After three tries the PR goes back
  # to the workers. The agent and the push token never share a runner.
  resolve:
    name: Resolve merge conflicts
    needs: [pick, validate, publish]
    if: always() && needs.validate.outputs.conflicted != '' && needs.validate.outputs.conflicted != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ${{ needs.pick.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      CONFLICTED: ${{ needs.validate.outputs.conflicted }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      # Only these repository variables select a model, through the centralized router.
      SWARM_MODEL: ${{ vars.SWARM_MODEL }}
      SWARM_FORCE_MODEL: ${{ vars.SWARM_FORCE_MODEL }}
      SWARM: '1'
      CHECK_SCRIPT: scripts/quick-check.sh
      MERGE_ATTEMPTS: '5'
      AGENT_TIMEOUT: 20m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # The read-only token is used here, before the agent has run anything.
      - name: Fetch main and the conflicted branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/agent-run.sh fetch-main
          scripts/agent-run.sh fetch-prs
      - name: Merge main into each branch and fix the conflicts (no GitHub token in this step)
        timeout-minutes: 75
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_3 || secrets.OPENCODE_API_KEY }}
        run: scripts/agent-run.sh resolve
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: resolved-branches
          path: .agent/resolve
          if-no-files-found: ignore
          retention-days: 1
  resolve-publish:
    name: Push resolved branches
    needs: [pick, resolve]
    if: always() && needs.resolve.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      # Trusted copy of the scripts from main, in a runner the agent never touched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: resolved-branches
          path: resolved
      - name: Warn when SWARM_TOKEN is not configured
        env:
          HAS_SWARM_TOKEN: ${{ secrets.SWARM_TOKEN != '' }}
        run: |
          if [[ "$HAS_SWARM_TOKEN" != "true" ]]; then
            echo "::warning title=SWARM_TOKEN missing::Falling back to the job token: it cannot push workflow files or open pull requests that trigger other workflows."
          fi
      - name: Push the resolved branches or send them back
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          GH_ISSUES_TOKEN: ${{ github.token }}
        run: python3 -I scripts/swarm.py resolve-publish --dir resolved
