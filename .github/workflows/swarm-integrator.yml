name: Swarm integrator
# Integrates every ready swarm pull request in one job: merge one at a time on
# top of main, run the fast merge gate after each, then push once. The expensive
# checks run once per batch on main in heavy-check.yml. No model is used here.
on:
  workflow_run:
    workflows: [Agent swarm]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swarm-integrator
  cancel-in-progress: false
jobs:
  pick:
    name: Pick the queue
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      queue: ${{ steps.queue.outputs.queue }}
      count: ${{ steps.queue.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/swarm.py plan-integration

  integrate:
    name: Integrate the ready batch
    needs: pick
    if: needs.pick.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java once for the whole batch
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # One job for the batch, so agent-written code is already merged locally;
      # the gate itself holds no GitHub token.
      # The trusted command retains the token for guard, merge and finalize, and
      # strips it from the gate subprocess, so agent-written code never sees it.
      - name: Merge each PR, gate, then push once
        env:
          QUEUE: ${{ needs.pick.outputs.queue }}
          GATE: scripts/quick-check.sh
        run: python3 -I scripts/swarm.py integrate-batch --queue "$QUEUE" --gate "$GATE"
