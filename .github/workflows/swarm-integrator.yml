name: Swarm integrator
# Integrates every ready swarm pull request in one job: merge one at a time on
# top of main, run a gate after each, then push once. Story PRs run the full
# scripts/integrator-gate.sh (check.sh with PostgreSQL and NVD): a PR that fails
# SpotBugs, coverage, Doxygen or DB policy never reaches main. Repair PRs use the
# reduced scripts/repair-gate.sh so one red class cannot block every other repair;
# Delivery runs the full tier on the merged commit and the next repair fixes a
# regression. Delivery then verifies the pushed commit on main.
# Called by swarm.yml after the workers of every wave (one scheduler, no
# workflow_run chain) and runnable by hand.
on:
  workflow_call:
    inputs:
      ignore_red_main:
        description: 'Carry the wave-level red-main override into integration'
        type: boolean
        default: false
      recovery_attempt:
        description: 'Bounded base-advance retry ordinal (0 or 1)'
        type: string
        default: '0'
      recovery_prs:
        description: 'Comma-separated pull request ids allowed in a bounded retry'
        type: string
        default: ''
    secrets:
      # GITHUB_TOKEN is system-reserved: a workflow_call that declares it fails
      # GitHub validation. It is supplied automatically to the called workflow.
      SWARM_TOKEN:
        required: false
      OPENCODE_API_KEY:
        required: false
      OPENCODE_API_KEY_3:
        required: false
    outputs:
      publication_state:
        description: 'Integrator outcome: published, noop, deferred or failed'
        value: ${{ jobs.publish.outputs.publication_state }}
  workflow_dispatch:
    inputs:
      ignore_red_main:
        description: 'Carry the wave-level red-main override into a bounded retry'
        type: boolean
        default: false
      recovery_attempt:
        description: 'Bounded base-advance retry ordinal (0 or 1)'
        type: string
        default: '0'
      recovery_prs:
        description: 'Comma-separated pull request ids allowed in a bounded retry'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: swarm-integrator-${{ github.repository }}
  cancel-in-progress: false
  queue: max
env:
  SWARM_GIT_NAME: ${{ vars.SWARM_GIT_NAME }}
  SWARM_GIT_EMAIL: ${{ vars.SWARM_GIT_EMAIL }}
  # Kill switch: set the repository variable SWARM_ALLOW_PROTECTED to 1 to merge protected files
  # automatically (full gate still runs); delete it or set it to 0 to restore the secure rule.
  SWARM_ALLOW_PROTECTED: ${{ vars.SWARM_ALLOW_PROTECTED }}

jobs:
  pick:
    name: Pick the queue
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      queue: ${{ steps.queue.outputs.queue }}
      count: ${{ steps.queue.outputs.count }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-agent-3:latest" >> "$GITHUB_OUTPUT"
      - id: queue
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          SWARM_IGNORE_RED_MAIN: ${{ inputs.ignore_red_main }}
          SWARM_RECOVERY_PRS: ${{ inputs.recovery_prs }}
        run: python3 -I scripts/swarm.py plan-integration

  # Candidate code is merged and gated here with NO write token and NO secrets.
  # It emits the validated tip and PR head SHAs plus a bundle; the publish job
  # below runs trusted scripts only and re-checks every SHA before any write.
  validate:
    name: Validate the ready batch (no secrets)
    needs: pick
    if: needs.pick.outputs.count != '0'
    runs-on: ubuntu-24.04
    # Up to ten PRs, each with the full gate. Reserve the candidate budget plus
    # 45m stack + 5m plan diagnostics and setup/upload overhead inside the job.
    timeout-minutes: 180
    outputs:
      conflicted: ${{ steps.candidate.outputs.conflicted }}
      accepted: ${{ steps.candidate.outputs.accepted }}
      report: ${{ steps.candidate.outputs.report }}
      seal: ${{ steps.candidate.outputs.seal }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    services:
      postgres:
        image: postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      AUREVIA_PG_ADMIN: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java once for the whole batch
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache OWASP NVD data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Doxygen
        # Required by scripts/docs.sh (WARN_AS_ERROR) so Javadoc defects are
        # caught before the PR is merged. Retry transient apt mirror 503s.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq doxygen; then
              exit 0
            fi
            echo "apt install attempt $attempt failed; retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - uses: ./.github/actions/setup-tooling-python
      - name: Merge each PR locally and gate it without credentials
        id: candidate
        timeout-minutes: 120
        env:
          # Read-only token for listing PR heads only. No SWARM_TOKEN and no NVD key:
          # OWASP scans the restored cache and still fails on CVSS >= 7.
          GH_TOKEN: ${{ github.token }}
          QUEUE: ${{ needs.pick.outputs.queue }}
          GATE: scripts/integrator-gate.sh
        run: python3 -I scripts/swarm.py integrate-validate --queue "$QUEUE" --gate "$GATE" --out validated
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        if: always()
        with:
          pattern: worker-*
          path: trails
          merge-multiple: false
      # Optional: allocation may have been skipped, so this artifact can be
      # absent. A no-match pattern downloads nothing and keeps the job green
      # without the red artifact-not-found annotation.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        if: always()
        with:
          pattern: trail-allocation
          path: trails/trail-allocation
      - name: Merge worker trails for the integrator
        if: always()
        run: |
          mkdir -p .agent
          : > .agent/work-trail.jsonl
          while IFS= read -r file; do
            cat "$file" >> .agent/work-trail.jsonl
          done < <(find trails -name work-trail.jsonl -type f | sort)
      # Stacking is diagnostic: the batch was already gated by integrate-validate.
      # A stack or plan failure must not block publication of that good batch,
      # but outcomes and annotations stay visible, so tolerate only these steps.
      - name: Build and gate stacked branches
        id: stack
        continue-on-error: true
        timeout-minutes: 45
        env:
          ACCEPTED: ${{ steps.candidate.outputs.accepted }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          CHECK_SCRIPT: scripts/integrator-gate.sh
        run: |
          branches=$(python3 -I -c 'import json, os; q = json.loads(os.environ["ACCEPTED"] or "[]"); print("\n".join("pr-" + str(n) for n in q if isinstance(n, int)))')
          BRANCHES="$branches" scripts/agent-run.sh integrate-stack
      - name: Report stacked-branch failure
        if: always() && steps.stack.outcome == 'failure'
        run: |
          printf '::error::integrate-stack: stacked branches failed; see the stack-plan artifact\n'
      - name: Plan stacked pull requests from the validated batch
        id: stack-plan
        continue-on-error: true
        timeout-minutes: 5
        if: always()
        env:
          ACCEPTED: ${{ steps.candidate.outputs.accepted }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 -I scripts/integration_stack.py plan \
            --accepted "$ACCEPTED" --base "${BASE_BRANCH:-main}" \
            --trail .agent/work-trail.jsonl > .agent/stack-plan.json 2>> .agent/stack-check.log
      - name: Report stacked-plan failure
        if: always() && steps.stack-plan.outcome == 'failure'
        run: |
          printf '::error::integrate-stack: stacked plan failed; see the stack-plan artifact\n'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: stack-plan
          path: |
            .agent/stack-plan.json
            .agent/stack-branches
            .agent/stack-checks
            .agent/stack-check.log
          if-no-files-found: ignore
          retention-days: 1

  seal:
    name: Seal the validated batch (trusted)
    needs: [validate]
    # An empty wave skips validation and has no seal to rebuild. Running the
    # trusted job on an empty payload would fail the whole integration run.
    if: needs.validate.result == 'success' && needs.validate.outputs.seal != ''
    outputs:
      conflicted: ${{ steps.rebuild.outputs.conflicted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SEAL: ${{ needs.validate.outputs.seal }}
      BASE_SHA: ${{ github.sha }}
    steps:
      # This runner never executes candidate code. It rebuilds the gated merge
      # from exact PR head SHAs after the candidate runner has been destroyed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling-python
      - name: Rebuild and bundle exact validated heads
        id: rebuild
        run: |
          printf '%s' "$SEAL" > "$RUNNER_TEMP/validated-seal.json"
          python3 -I scripts/swarm.py integrate-seal \
            --base "$BASE_SHA" --payload "$RUNNER_TEMP/validated-seal.json" \
            --out validated
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validated-batch
          path: validated
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the validated batch
    needs: [pick, validate, seal]
    if: >-
      (needs.validate.outputs.accepted != '' && needs.validate.outputs.accepted != '[]')
      || (needs.validate.outputs.conflicted != '' && needs.validate.outputs.conflicted != '[]')
      || (needs.validate.outputs.report != '' && needs.validate.outputs.report != '[]')
    outputs:
      # Descriptive state only; the retry JSON below is the sole retry authority.
      publication_state: ${{ steps.push.outputs.publication_state }}
      integration_retry: ${{ steps.push.outputs.integration_retry }}
      recovery_attempt: ${{ steps.push.outputs.recovery_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # Labels are written through the Issues API, so PR write alone is not enough.
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
      GH_ISSUES_TOKEN: ${{ github.token }}
    steps:
      # Trusted scripts from main on a runner candidate code never touched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # The validate job may be skipped when there is no queue, so there is no
      # batch to publish. Pattern matching keeps that absence a clean no-op.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: validated-batch
          path: validated
      - uses: ./.github/actions/setup-tooling-python
      - name: Verify the validated batch layout
        run: |
          for path in validated/manifest.json validated/main.bundle; do
            if [[ ! -f "$path" ]]; then
              echo "::error::Validated batch artifact is missing $path; expected a flat validated-batch artifact" >&2
              exit 1
            fi
          done
      # Reconcile runs after publication, so a bad tracker field checked there
      # would already have pushed branches. Validate the trusted main tracker
      # here, before any write, and fail the wave on malformed task fields.
      - name: Validate task tracker fields
        run: python3 -I scripts/swarm_gate.py validate-tasks --dir tasks
      - name: Push only the exact validated commit SHAs
        id: push
        env:
          GATE: scripts/integrator-gate.sh
          RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt || '0' }}
        run: python3 -I scripts/swarm.py integrate-publish --manifest validated/manifest.json --bundle validated/main.bundle --gate "$GATE" --recovery-attempt "$RECOVERY_ATTEMPT"

  # Reconcile only after a batch actually reached main, from a fresh trusted
  # checkout. A green deferred publish (or a no-op) must never write trackers.
  reconcile:
    name: Reconcile merged tasks
    needs: publish
    if: always() && needs.publish.outputs.publication_state == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            scripts
            tasks
            .github/actions
      - uses: ./.github/actions/setup-tooling-python
      - name: Reconcile tasks whose PRs merged
        run: |
          python3 -I scripts/swarm_gate.py validate-tasks --dir tasks
          python3 -I scripts/swarm.py reconcile-tasks --dir tasks

  # Automatic conflict resolution is disabled until a trusted seal job can
  # attest conflict decisions. Candidate-runner output must never authorize an
  # agent with credentials or a later write-token branch push.
  resolve:
    name: Resolve merge conflicts
    needs: [pick, validate, seal, publish]
    if: >-
      always() && (
        (
          (
            needs.publish.outputs.publication_state == 'published'
            || needs.publish.outputs.publication_state == 'noop'
          )
          && needs.seal.outputs.conflicted != ''
          && needs.seal.outputs.conflicted != '[]'
        )
        || (
          needs.publish.outputs.publication_state == 'deferred'
          && needs.publish.outputs.integration_retry != ''
          && needs.publish.outputs.recovery_attempt < 1
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ${{ needs.pick.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      # One repository variable supplies the model name; the runner passes it through unchanged.
      SWARM_MODEL: ${{ vars.SWARM_MODEL || 'opencode-go/hy4-flash-free' }}
      SWARM: '1'
      CHECK_SCRIPT: scripts/integrator-gate.sh
      MERGE_ATTEMPTS: '5'
      AGENT_TIMEOUT: 20m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select the branches to recover
        env:
          RETRY: ${{ needs.publish.outputs.integration_retry }}
          SEALED: ${{ needs.seal.outputs.conflicted }}
        run: |
          # A recovery signal names only integer PR ids; a seal names the branches
          # the tokenless validation found conflicting. No task text is carried.
          if [[ -n "$RETRY" ]]; then
            python3 -c 'import json,os; print("CONFLICTED=" + json.dumps(json.loads(os.environ["RETRY"])["prs"]))' >> "$GITHUB_ENV"
          else
            echo "CONFLICTED=$SEALED" >> "$GITHUB_ENV"
          fi
      # The read-only token is used here, before the agent has run anything.
      - name: Fetch main and the conflicted branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/agent-run.sh fetch-main
          scripts/agent-run.sh fetch-prs
      - name: Merge main into each branch and fix the conflicts (no GitHub token in this step)
        timeout-minutes: 75
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_3 || secrets.OPENCODE_API_KEY }}
        run: scripts/agent-run.sh resolve
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: resolved-branches
          path: .agent/resolve
          if-no-files-found: ignore
          retention-days: 1
  resolve-publish:
    name: Push resolved branches
    needs: [pick, resolve, publish]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      # Trusted copy of the scripts from main, in a runner the agent never touched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: resolved-branches
          path: resolved
      - name: Warn when SWARM_TOKEN is not configured
        env:
          HAS_SWARM_TOKEN: ${{ secrets.SWARM_TOKEN != '' }}
        run: |
          if [[ "$HAS_SWARM_TOKEN" != "true" ]]; then
            echo "::warning title=SWARM_TOKEN missing::Falling back to the job token: it cannot push workflow files or open pull requests that trigger other workflows."
          fi
      - name: Push the resolved branches or send them back
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          GH_ISSUES_TOKEN: ${{ github.token }}
          # A base-advance recovery is capped by the signal-gated step below;
          # ordinary conflict resolution keeps the historical re-dispatch.
          DISPATCH_FLAG: ${{ needs.publish.outputs.publication_state == 'deferred' && needs.publish.outputs.integration_retry != '' && '--no-dispatch' || '' }}
        run: |
          args=(--dir resolved)
          if [[ -n "$DISPATCH_FLAG" ]]; then args+=("$DISPATCH_FLAG"); fi
          python3 -I scripts/swarm.py resolve-publish "${args[@]}"
      # One bounded retry only: the fresh run re-plans just the signalled PRs and
      # re-gates on the new main. Ordinary conflict resolution never dispatches a
      # new integrator run because it carries no recovery signal.
      - name: Re-dispatch the bounded base-advance retry
        if: needs.publish.outputs.publication_state == 'deferred' && needs.publish.outputs.integration_retry != '' && needs.publish.outputs.recovery_attempt < 1
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          RETRY: ${{ needs.publish.outputs.integration_retry }}
          ATTEMPT: ${{ needs.publish.outputs.recovery_attempt }}
        run: |
          prs=$(python3 -c 'import json,os; print(",".join(str(n) for n in json.loads(os.environ["RETRY"])["prs"]))')
          if [[ ! "$ATTEMPT" =~ ^[01]$ ]]; then
            echo "::error::invalid recovery attempt" >&2
            exit 1
          fi
          attempt=$(( ATTEMPT + 1 ))
          if [[ "$attempt" -gt 1 ]]; then
            echo "::error::base-advance retry budget exhausted" >&2
            exit 1
          fi
          gh workflow run swarm-integrator.yml \
            --field recovery_attempt="$attempt" --field recovery_prs="$prs" \
            --field ignore_red_main="${{ inputs.ignore_red_main }}"
