name: Swarm gate

# Independent of Delivery. Delivery verifies the code; this workflow verifies
# the swarm contract from a checkout of the protected base revision, so a
# worker PR can never edit the verifier that judges it. GitHub reports the
# native "Swarm gate" check for the exact revision under test.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Gate runs are independent: each pushed commit gets its own exact-SHA verdict.
concurrency:
  group: swarm-gate-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  swarm-gate:
    name: Swarm gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The verifier and the task/evidence inputs come only from the protected
      # base revision. A PR's recorded base.sha is stale once main advances, so
      # pull requests use the current default-branch tip; a merge group uses its
      # queue target instead.
      - name: Check out trusted base verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.merge_group.base_sha || github.event.repository.default_branch || github.ref }}
          persist-credentials: false
          path: base
      # The manifest and ancestry are read from the exact revision being
      # tested (the PR merge commit or the merge-group commit). No executable
      # code from this checkout is ever run by the gate.
      - name: Check out the revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: tested
      # A pull_request event freezes head.sha when it is created. If the worker
      # pushes again while this run queues, refresh to the trusted live PR head
      # and re-evaluate ancestry there instead of reporting a stale verdict.
      - name: Resolve live PR head
        id: head
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live=$(gh pr view --repo "$GITHUB_REPOSITORY" "${{ github.event.pull_request.number }}" --json headRefOid --jq .headRefOid)
          if [[ ! "$live" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::live headRefOid is missing or malformed" >&2
            exit 1
          fi
          event_sha=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          if [[ "$live" != "$event_sha" ]]; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "original=$event_sha" >> "$GITHUB_OUTPUT"
          else
            echo "moved=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh tested checkout
        if: steps.head.outputs.moved == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          persist-credentials: false
          path: tested
      - name: Refresh event head
        id: event
        if: steps.head.outputs.moved == 'true'
        env:
          ORIGINAL_SHA: ${{ steps.head.outputs.original }}
        run: |
          sha=$(git -C tested rev-parse HEAD)
          python3 -I base/scripts/swarm_gate.py refresh-event \
            --event-path "$GITHUB_EVENT_PATH" \
            --head-sha "$sha" \
            --original-sha "$ORIGINAL_SHA" \
            --output "$RUNNER_TEMP/swarm-gate-event.json"
      - name: Verify the swarm contract
        env:
          GH_TOKEN: ${{ github.token }}
          SWARM_GATE_REQUIRED_CHECKS: ${{ vars.SWARM_GATE_REQUIRED_CHECKS || '' }}
        run: |
          event_path="$GITHUB_EVENT_PATH"
          if [[ "${{ steps.head.outputs.moved }}" == "true" ]]; then
            event_path="$RUNNER_TEMP/swarm-gate-event.json"
          fi
          python3 -I base/scripts/swarm_gate.py evaluate \
            --event-path "$event_path" \
            --event-name "$GITHUB_EVENT_NAME" \
            --root base \
            --head-root tested
