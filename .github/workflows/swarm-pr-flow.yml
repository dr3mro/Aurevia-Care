name: Swarm PR flow
# Keeps pull requests moving. A pull request that stalls blocks the tasks that depend on it,
# pauses the stories while fixes wait and delays the next batch, so this does not wait for the
# next integration run or the hourly wave. It runs when a Delivery run finishes and every ten
# minutes, and does the next step for every open swarm pull request at once:
#   - Delivery failed on the current head      -> the debugger (then a fix worker)
#   - a draft nobody has taken                 -> a fix worker
#   - Delivery missing or waiting for approval -> a fresh Delivery run on the branch
#   - Delivery passed                          -> the integrator is started now
#   - a debugger or a fix wave is due          -> started if none is queued or running
#   - green but unmerged for 90 minutes        -> one issue for a person
# It is trusted code and runs no agent, so it is fast and cannot be talked into anything:
# the LLM work stays with the debugger and the fix workers it hands off to.
# SWARM_ISSUES=off (repository variable) silences the issues it would open.
on:
  workflow_run:
    workflows: [Delivery]
    types: [completed]
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swarm-pr-flow
  cancel-in-progress: false
env:
  SWARM_ISSUES: ${{ vars.SWARM_ISSUES }}

jobs:
  flow:
    name: Move the pull requests along
    # A cancelled or skipped run says nothing; only a finished one changes what to do next.
    if: >-
      github.event_name != 'workflow_run'
      || contains(fromJSON('["success","failure","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            TODO.md
            tasks
            docs/archive/TODO-DONE.md
      - name: Move every open swarm pull request to its next step
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
        run: python3 -I scripts/swarm.py pr-flow
