name: Agent swarm
# The one scheduler. It reads tasks/, splits them across up to twenty story
# worker jobs per wave, and admits multiple concurrent waves bounded by
# SWARM_MAX_WAVE_COUNT and the global 20-worker ledger. Each worker runs the
# agent with no GitHub token
# on its own branch, uploads its commits, and exits (the container is
# discarded, nothing idles). A separate trusted job pushes the branch and opens
# the pull request. The integrator then runs in the same run (full gate before
# main is touched) and the last job starts the next wave while work remains.
# Failed runs on main arrive as repair task files under tasks/, planned first.
on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Story workers per wave; requests above twenty are clamped to twenty, and fewer are used when fewer tasks are ready (1 to 20, default 20). All planned workers, including fixes and repairs, are bounded by the configured cap.'
        default: '20'
      repair_run:
        description: Failed run id on main to repair (optional; the plan job finds failing runs itself)
        default: ''
      task:
        description: 'Task id to launch first (optional; ignores the attempt limit, still needs open status, met dependencies and a free scope)'
        default: ''
      now:
        description: 'Reserved; dispatches still queue behind the current wave.'
        type: boolean
        default: false
      ignore_red_main:
        description: 'Bypass task gates; wave queue and CI/merge gates still apply.'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [tasks/**]
  # Safety net: one wave per hour at minute 7 if the event chain ever stalls.
  # An idle plan job costs about one minute.
  schedule:
    - cron: '7 * * * *'
  # A successful prepared-image rebuild makes any wave skipped during the
  # rebuild eligible again, so no task is left unclaimed.
  workflow_run:
    workflows: [Swarm slot images]
    types: [completed]
    branches: [main]
permissions:
  contents: read
# A wave's concurrency group is per run, so SWARM_MAX_WAVE_COUNT can admit more
# than one wave. The short plan job is serialized per repository so two waves can
# never claim the same task; the planner also checks the live wave count and the
# global 20-worker ledger before offering slots.
concurrency:
  group: swarm-${{ github.repository }}-${{ github.run_id }}
  cancel-in-progress: false
env:
  SWARM_GIT_NAME: ${{ vars.SWARM_GIT_NAME }}
  SWARM_GIT_EMAIL: ${{ vars.SWARM_GIT_EMAIL }}

jobs:
  flags:
    uses: ./.github/workflows/swarm-flags.yml
  select:
    name: Select feature (PO)
    needs: flags
    if: needs.flags.outputs.enabled == 'true' && needs.flags.outputs.llm_selection == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      feature: ${{ steps.run.outputs.feature }}
      task_ids: ${{ steps.run.outputs.task_ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select features with OpenCode
        id: run
        env:
          SWARM_MODEL: ${{ vars.SWARM_MODEL || 'opencode-go/hy4-flash-free' }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_1 || secrets.OPENCODE_API_KEY }}
          # The expression above only falls back when _1 is empty; keep the base
          # key as a one-shot retry when _1 is present but rate-limited or rejected.
          OPENCODE_API_KEY_ALT: ${{ secrets.OPENCODE_API_KEY_1 && secrets.OPENCODE_API_KEY || '' }}
        run: |
          set +e
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')-agent-1:latest"
          echo "Selecting with image $image" >&2
          mkdir -p .agent
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e SWARM_MODEL -e OPENCODE_API_KEY -e OPENCODE_API_KEY_ALT \
            "$image" bash -lc '
              prompt="Use the aurevia-context-optimizer skill. The single-file trackers were removed: use tasks/ and .opencode/config/MEMORY.md; never search root TODO.md or MEMORY.md. Before deciding, read the code base and evidence: .opencode/config/PROJECT_V1_SPEC.md for the requirement IDs, tasks/ for [x] done, [-] taken and [ ] open, .opencode/config/BUGS.md, .opencode/config/WORKSPACE.md, docs/decisions/ and targeted entry points under apps/, db/ and contracts/. Separate implemented, partial, planned and unknown work. A feature is a range of related tasks sharing a task-id prefix, for example SMSG or PRINT. Select up to two features where the remaining gap is real and open eligible tasks exist (depends done, attempts below 5); Prefer two different feature prefixes when two gaps exist. If only one feature has an eligible gap, choose up to two tasks from it. Reply with exactly two lines on stdout, the last two: feature=<comma-separated feature prefixes> then tasks=<comma-separated task ids from those features>. Ids only; no prose on those lines."
              keys=("$OPENCODE_API_KEY")
              if [[ -n "${OPENCODE_API_KEY_ALT:-}" && "$OPENCODE_API_KEY_ALT" != "$OPENCODE_API_KEY" ]]; then
                keys+=("$OPENCODE_API_KEY_ALT")
              fi
              for key in "${keys[@]}"; do
                OPENCODE_API_KEY="$key"
                export OPENCODE_API_KEY
                opencode run --auto --agent product-owner --model "$SWARM_MODEL" "$prompt" \
                  > .agent/selected-feature.txt 2>.agent/select.log
                rc=$?
                echo "opencode rc=$rc" >&2
                if (( rc == 0 )); then break; fi
                if ! /usr/bin/grep -qiE "rate.?limit|too many requests|quota|429|unauthor|401|403|invalid api key|authentication" .agent/select.log; then break; fi
              done
              exit "$rc"
            '
          rc=$?
          echo "docker rc=$rc" >&2
          # Agent text is outside the container here, where the quoting of the
          # sed expressions is plain shell rather than the inner bash -lc string.
          if [[ -f .agent/select.log ]]; then
            echo "--- OpenCode select log ---" >&2
            sed -E -e 's/^([[:space:]]*)(##\[|::)/\1> \2/' -e 's/gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}/***/g' .agent/select.log >&2
          fi
          if [[ -f .agent/selected-feature.txt ]]; then
            echo "--- selected feature output ---" >&2
            sed -E -e 's/^([[:space:]]*)(##\[|::)/\1> \2/' -e 's/gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}/***/g' .agent/selected-feature.txt >&2
          fi
          if (( rc != 0 )); then
            echo "::error::OpenCode feature selection failed with rc=$rc; see the select log above" >&2
            exit "$rc"
          fi
          if [[ ! -f .agent/selected-feature.txt ]]; then
            echo "::error::OpenCode produced no feature selection output" >&2
            exit 1
          fi
          # SELECTION-GUARD-BEGIN
          # The * makes an explicitly empty value match: `feature=` and `tasks=`
          # are answers, while a missing line means the agent never answered and
          # is an error. The comma lets the PO return more than one feature prefix.
          # Validate the last answer line itself: a later malformed answer must
          # fail instead of silently leaving an earlier valid value in force.
          feature_re='^feature=[A-Za-z0-9_,-]*$'
          tasks_re='^tasks=[A-Za-z0-9_,-]*$'
          feature_line=$(/usr/bin/grep -E '^feature=' .agent/selected-feature.txt | tail -n 1)
          tasks_line=$(/usr/bin/grep -E '^tasks=' .agent/selected-feature.txt | tail -n 1)
          if [[ ! "$feature_line" =~ $feature_re ]] || [[ ! "$tasks_line" =~ $tasks_re ]]; then
            echo "::error::OpenCode returned no feature=/tasks= while open [ ] tasks exist" >&2
            exit 1
          fi
          feature=${feature_line#feature=}
          tasks=${tasks_line#tasks=}
          if [[ -z "$feature" || -z "$tasks" ]]; then
            echo "::notice::Empty feature selection is a valid answer; no eligible task was chosen from candidates ${tasks:-none}." >&2
          fi
          echo "Selected feature: ${feature:-none}; candidates: ${tasks:-none}" >&2
          echo "feature=$feature" >> "$GITHUB_OUTPUT"
          echo "task_ids=$tasks" >> "$GITHUB_OUTPUT"
          # SELECTION-GUARD-END
          python3 -I scripts/work_trail.py --stage feature --agent product-owner \
            --instruction "select up to two feature prefixes and their candidate task ids" \
            --outputs "feature=${feature:-} tasks=${tasks:-}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: trail-feature
          path: .agent/work-trail.jsonl
          if-no-files-found: ignore
          retention-days: 1
  allocate:
    name: Allocate tasks (SM)
    needs: [flags, select]
    if: needs.flags.outputs.enabled == 'true' && needs.flags.outputs.llm_selection == 'true' && needs.select.outputs.feature != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      task_ids: ${{ steps.run.outputs.task_ids }}
      # Set only on a successful agent answer, including an empty allocation.
      # It lets the planner tell "no non-overlapping task" from "job skipped".
      allocated: ${{ steps.run.outputs.allocated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Optional: the PO job may upload no trail when selection fails. A pattern
      # with no match exits cleanly; `name:` would emit a red artifact-not-found
      # annotation that `continue-on-error` cannot suppress.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: trail-feature
          path: .agent
      - name: Allocate non-overlapping tasks with OpenCode
        id: run
        env:
          SWARM_MODEL: ${{ vars.SWARM_MODEL || 'opencode-go/hy4-flash-free' }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_1 || secrets.OPENCODE_API_KEY }}
          OPENCODE_API_KEY_ALT: ${{ secrets.OPENCODE_API_KEY_1 && secrets.OPENCODE_API_KEY || '' }}
          FEATURE: ${{ needs.select.outputs.feature }}
          CANDIDATES: ${{ needs.select.outputs.task_ids }}
          WORKER_COUNT: ${{ needs.flags.outputs.max_task == 'true' && needs.flags.outputs.max_workers_per_wave || '1' }}
        run: |
          set +e
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')-agent-1:latest"
          mkdir -p .agent
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e SWARM_MODEL -e OPENCODE_API_KEY -e OPENCODE_API_KEY_ALT -e FEATURE -e CANDIDATES -e WORKER_COUNT \
            "$image" bash -lc '
              prompt="Use the aurevia-context-optimizer skill. The single-file trackers were removed: use tasks/ and .opencode/config/MEMORY.md; never search root TODO.md or MEMORY.md. Before deciding, read the code base and evidence: the requirement IDs in .opencode/config/PROJECT_V1_SPEC.md, the [x] done, [-] taken and [ ] open entries in tasks/, .opencode/config/BUGS.md, docs/decisions/ and the targeted source under apps/, db/ and contracts/ for each candidate. $FEATURE is a comma-separated list of feature prefixes selected by the Product Owner. Within the $WORKER_COUNT cap, pick open tasks from candidates $CANDIDATES that are still needed, whose dependencies are met and whose scope paths do not overlap each other or any [-] task; prefer tasks from different feature prefixes when more than one prefix was selected. If only one feature is selected, pick up to two tasks when the cap allows, or one if a second eligible task cannot be found; with two features, pick one if no second eligible task exists. Reply with one line only: tasks=<comma-separated task ids>. Ids only."
              keys=("$OPENCODE_API_KEY")
              if [[ -n "${OPENCODE_API_KEY_ALT:-}" && "$OPENCODE_API_KEY_ALT" != "$OPENCODE_API_KEY" ]]; then
                keys+=("$OPENCODE_API_KEY_ALT")
              fi
              for key in "${keys[@]}"; do
                OPENCODE_API_KEY="$key"
                export OPENCODE_API_KEY
                opencode run --auto --agent scrum-master --model "$SWARM_MODEL" "$prompt" \
                  > .agent/allocated-tasks.txt 2>.agent/allocate.log
                rc=$?
                echo "opencode rc=$rc" >&2
                if (( rc == 0 )); then break; fi
                if ! /usr/bin/grep -qiE "rate.?limit|too many requests|quota|429|unauthor|401|403|invalid api key|authentication" .agent/allocate.log; then break; fi
              done
              exit "$rc"
            '
          rc=$?
          echo "docker rc=$rc" >&2
          if [[ -f .agent/allocate.log ]]; then
            echo "--- OpenCode allocate log ---" >&2
            sed -E -e 's/^([[:space:]]*)(##\[|::)/\1> \2/' -e 's/gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}/***/g' .agent/allocate.log >&2
          fi
          if [[ -f .agent/allocated-tasks.txt ]]; then
            echo "--- allocated tasks output ---" >&2
            sed -E -e 's/^([[:space:]]*)(##\[|::)/\1> \2/' -e 's/gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}/***/g' .agent/allocated-tasks.txt >&2
          fi
          if (( rc != 0 )); then
            echo "::error::OpenCode task allocation failed with rc=$rc; see the allocate log above" >&2
            exit "$rc"
          fi
          if [[ ! -f .agent/allocated-tasks.txt ]]; then
            echo "::error::OpenCode produced no task allocation output" >&2
            exit 1
          fi
          # ALLOCATION-GUARD-BEGIN
          # An explicit empty answer means every candidate overlapped a taken
          # task; only a missing line (a failed or silent agent) is an error.
          # Validate the last answer line itself so a malformed late answer
          # cannot leave an earlier allocation in force.
          tasks_re='^tasks=[A-Za-z0-9_,-]*$'
          tasks_line=$(/usr/bin/grep -E '^tasks=' .agent/allocated-tasks.txt | tail -n 1)
          if [[ ! "$tasks_line" =~ $tasks_re ]]; then
            echo "::error::OpenCode returned no tasks= while open [ ] tasks exist" >&2
            exit 1
          fi
          tasks=${tasks_line#tasks=}
          if [[ -z "$tasks" ]]; then
            # CANDIDATES is bound from the PO job's validated id list; no free
            # text from the agent reaches the annotation or the run summary.
            echo "::notice::No non-overlapping task was available from candidates ${CANDIDATES:-none}; open [ ] tasks exist but overlap taken work or each other." >&2
            echo "Swarm wave summary: no non-overlapping tasks were available from candidates ${CANDIDATES:-none}." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Allocated tasks: ${tasks:-none}" >&2
          echo "task_ids=$tasks" >> "$GITHUB_OUTPUT"
          echo "allocated=true" >> "$GITHUB_OUTPUT"
          # ALLOCATION-GUARD-END
          python3 -I scripts/work_trail.py --stage allocation --agent scrum-master \
            --instruction "pick at most ${WORKER_COUNT:-1} non-overlapping tasks from ${CANDIDATES:-}" \
            --outputs "feature=${FEATURE:-} tasks=${tasks:-}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: trail-allocation
          path: .agent/work-trail.jsonl
          if-no-files-found: ignore
          retention-days: 1
  plan:
    name: Plan the wave
    needs: [flags, select, allocate]
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    # Canonical values reach both the shell gates below and the Python commands,
    # which read the same flag names from the environment.
    env:
      SWARM_ENABLED: ${{ needs.flags.outputs.enabled }}
      SWARM_MAX_TASK: ${{ needs.flags.outputs.max_task }}
      SWARM_MAX_WORKERS_PER_WAVE: ${{ needs.flags.outputs.max_workers_per_wave }}
      SWARM_MAX_WAVE_COUNT: ${{ needs.flags.outputs.max_wave_count }}
    # Planning reads tasks/ and claims tasks, so it never overlaps another
    # plan, whichever wave it belongs to.
    concurrency:
      group: swarm-plan-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      # Reading the slot-image manifests needs packages: read; dispatching one
      # agent-image.yml build when they are absent needs actions: write.
      packages: read
      actions: write
      # The budget gate opens an issue when it pauses the swarm; without this
      # permission the pause was silent.
      issues: write
    outputs:
      # The kill step skips the planner, so its empty matrix and zero count are
      # the fail-closed values the downstream gates must see.
      matrix: ${{ steps.plan.outputs.matrix || steps.kill.outputs.matrix || '{"include":[]}' }}
      count: ${{ steps.plan.outputs.count || steps.kill.outputs.count || '0' }}
      reason: ${{ steps.plan.outputs.reason || '' }}
      image_prefix: ${{ steps.image.outputs.prefix }}
      # Downstream jobs already depend on plan; forwarding the resolved flag here
      # keeps the job graph unchanged while every gate reads one canonical value.
      max_task: ${{ needs.flags.outputs.max_task }}
      max_workers_per_wave: ${{ needs.flags.outputs.max_workers_per_wave }}
      max_wave_count: ${{ needs.flags.outputs.max_wave_count }}
      feature: ${{ needs.select.outputs.feature }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # images-ready and plan-workers read .opencode/config/slots.json; the
          # swarm configuration now lives under .opencode/; the former location was removed.
          sparse-checkout: |
            scripts
            .opencode/config
            tasks/
            tasks
      - id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}-agent" >> "$GITHUB_OUTPUT"
      # Safety net: refuse a wave when estimated monthly runner minutes are near
      # the cap. No wave, no worker containers, and an issue for a person.
      - id: kill
        # An empty or non-canonical output fails closed: no wave is planned.
        run: |
          if [[ "${SWARM_ENABLED:-false}" != "true" ]]; then
            echo "Swarm kill switch is off; skipping this wave." >&2
            {
              echo 'enabled=false'
              echo 'matrix={"include":[]}'
              echo 'count=0'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - id: budget
        if: steps.kill.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
        run: python3 -I scripts/swarm.py budget-gate
      # A red main becomes a repair task here, in the same run that plans the
      # wave, instead of a separate watchdog run per failure. The task goes in
      # task files first, so the planner below picks them up ahead of everything else.
      - id: repair
        if: steps.kill.outputs.enabled == 'true' && (steps.budget.outputs.start == 'true' || inputs.ignore_red_main == true)
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
        run: python3 -I scripts/swarm.py add-repair-task --latest
      # The prepared images are built once by agent-image.yml / swarm-images.yml
      # and reused by every worker. Never start a wave while they are rebuilding
      # or not green. The decision lives in the swarm helper and is testable:
      # a wave is blocked only while a build is queued/in progress or the newest
      # completed build failed. With no run history at all (cleaned or expired),
      # the slot images in GHCR decide instead of an empty `gh run list`.
      - id: images
        if: steps.kill.outputs.enabled == 'true' && (steps.budget.outputs.start == 'true' || inputs.ignore_red_main == true)
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
        run: python3 -I scripts/swarm.py images-ready
      # Marks every task it starts as [-] in the task files and pushes that to main
      # (GITHUB_TOKEN pushes do not trigger another run).
      - id: plan
        if: steps.kill.outputs.enabled == 'true' && (steps.budget.outputs.start == 'true' || inputs.ignore_red_main == true)
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          SWARM_IGNORE_RED_MAIN: ${{ inputs.ignore_red_main }}
          WORKERS: ${{ inputs.workers || '20' }}
          BUDGET_WORKERS: ${{ steps.budget.outputs.workers }}
          REPAIR_RUN: ${{ inputs.repair_run }}
          LAUNCH_TASK: ${{ needs.allocate.outputs.task_ids }}
          ALLOCATION_DONE: ${{ needs.allocate.outputs.allocated }}
          ALLOCATE_RESULT: ${{ needs.allocate.result }}
          FALLBACK_TASK: ${{ needs.select.outputs.task_ids }}
          INPUT_TASK: ${{ inputs.task }}
          FEATURE: ${{ needs.select.outputs.feature }}
          IGNORE_RED_MAIN: ${{ inputs.ignore_red_main }}
          IMAGES_READY: ${{ steps.images.outputs.ready }}
          IMAGES_REASON: ${{ steps.images.outputs.reason }}
        run: |
          # PLAN-LAUNCH-GUARD-BEGIN
          # SM owns the choice once it answered: its empty result must not fall
          # back to PO candidates that overlap taken work. A skipped SM job may
          # still use the PO shortlist, and a person's dispatch wins over both.
          if [[ -n "${INPUT_TASK:-}" ]]; then
            LAUNCH_TASK="$INPUT_TASK"
          elif [[ "${ALLOCATION_DONE:-}" != "true" && "${ALLOCATE_RESULT:-}" != "failure" && -z "${LAUNCH_TASK:-}" ]]; then
            LAUNCH_TASK="${FALLBACK_TASK:-}"
          fi
          # PLAN-LAUNCH-GUARD-END
          # PLAN-EMPTY-GUARD-BEGIN
          # An empty allocation is a valid answer, not permission for the
          # planner to choose backlog tasks nobody selected for this wave.
          if [[ "${ALLOCATE_RESULT:-}" == "failure" && -z "${INPUT_TASK:-}" ]]; then
            echo "OpenCode allocation failed; no wave is planned." >&2
            {
              echo 'matrix={"include":[]}'
              echo 'count=0'
              echo 'reason=allocation_failed'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${ALLOCATION_DONE:-}" == "true" && -z "${LAUNCH_TASK:-}" ]]; then
            {
              echo 'matrix={"include":[]}'
              echo 'count=0'
              echo 'reason=allocation_empty'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PLAN-EMPTY-GUARD-END
          if [[ "$IMAGES_READY" != true && "${IGNORE_RED_MAIN:-false}" != true ]]; then
            echo "Prepared images not ready: $IMAGES_REASON; skipping this wave." >&2
            {
              echo 'matrix={"include":[]}'
              echo 'count=0'
              echo 'reason=images_not_ready'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -I scripts/swarm.py ensure-labels
          # Never plan more workers than the remaining monthly budget can pay for.
          capacity=20
          if [[ "$BUDGET_WORKERS" =~ ^[0-9]+$ && "${IGNORE_RED_MAIN:-false}" != true ]] && (( BUDGET_WORKERS < capacity )); then
            capacity=$BUDGET_WORKERS
          fi
          # Repairs and fixes are queued before offering spare workers to backlog tasks.
          # Ready merges use the independent serialized integrator instead of waiting for this wave.
          python3 -I scripts/swarm.py pr-flow --no-wave
          if [[ "${SWARM_MAX_TASK:-false}" != "true" ]]; then
            WORKERS=1
            echo "Bounded mode: planning one worker in one wave." >&2
          else
            cap="${SWARM_MAX_WORKERS_PER_WAVE:-20}"
            # An explicit dispatch request is honoured only below the canonical
            # cap; a missing or malformed request uses the cap itself.
            workers_number=0
          if [[ "$WORKERS" =~ ^[0-9]+$ ]]; then workers_number=$((10#$WORKERS)); fi
            if (( workers_number < 1 || workers_number > cap )); then
              WORKERS="$cap"
            fi
          fi
          plan_args=(--max "$WORKERS" --capacity "$capacity" --repair-run "$REPAIR_RUN" --task "$LAUNCH_TASK")
          if [[ "${IGNORE_RED_MAIN:-false}" == true ]]; then
            plan_args+=(--ignore-red-main)
            echo "Safety override: red main will not block ordinary work in this wave." >&2
          fi
          python3 -I scripts/swarm.py plan-workers "${plan_args[@]}"
      # A zero-worker wave is a successful run with a skipped worker job. Put the
      # planner's fixed-token reason in the run summary so developers see it without
      # reading step logs. The value is bound through env, never interpolated into
      # the shell, so it cannot become an Actions command.
      - id: plan-reason
        if: always() && steps.plan.outputs.reason != ''
        env:
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
        run: |
          # PLAN-REASON-GUARD-BEGIN
          if [[ "$PLAN_REASON" == "allocation_empty" ]]; then
            echo "Swarm wave summary: no non-overlapping tasks were available; no worker started." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Swarm wave skipped: $PLAN_REASON" >> "$GITHUB_STEP_SUMMARY"
          fi
          # PLAN-REASON-GUARD-END
  worker:
    # Static name: GitHub renders matrix values in a job name only when the
    # wave has tasks, and a literal ${{ ... }} shows when the matrix is empty.
    name: Swarm worker
    needs: plan
    # count is empty when the budget gate skipped the plan step; fromJSON('')
    # on the matrix would then fail the whole run and trigger a false repair.
    if: needs.plan.result == 'success' && fromJSON(needs.plan.outputs.count || '0') > 0
    strategy:
      # Up to twenty story workers per wave; the global cap across all waves stays 20.
      max-parallel: 20
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix || '{"include":[]}') }}
    # A called workflow gets at most the permissions its caller grants.
    permissions:
      contents: write
      pull-requests: write
      packages: read
      actions: write
      # The work job reads earlier findings; the publish job writes hand-off issues.
      issues: write
    uses: ./.github/workflows/swarm-worker.yml
    secrets:
      SWARM_TOKEN: ${{ secrets.SWARM_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_API_KEY_1: ${{ secrets.OPENCODE_API_KEY_1 }}
      OPENCODE_API_KEY_2: ${{ secrets.OPENCODE_API_KEY_2 }}
      OPENCODE_API_KEY_3: ${{ secrets.OPENCODE_API_KEY_3 }}
      OPENCODE_API_KEY_4: ${{ secrets.OPENCODE_API_KEY_4 }}
      OPENCODE_API_KEY_5: ${{ secrets.OPENCODE_API_KEY_5 }}
      OPENCODE_API_KEY_6: ${{ secrets.OPENCODE_API_KEY_6 }}
      OPENCODE_API_KEY_7: ${{ secrets.OPENCODE_API_KEY_7 }}
      OPENCODE_API_KEY_8: ${{ secrets.OPENCODE_API_KEY_8 }}
      OPENCODE_API_KEY_9: ${{ secrets.OPENCODE_API_KEY_9 }}
      OPENCODE_API_KEY_10: ${{ secrets.OPENCODE_API_KEY_10 }}
    with:
      image: ${{ needs.plan.outputs.image_prefix }}-${{ matrix.slot }}:latest
      slot: ${{ format('{0}', matrix.slot) }}
      task: ${{ toJSON(matrix) }}
      ignore_red_main: ${{ inputs.ignore_red_main == true }}
      max_task: ${{ needs.plan.outputs.max_task }}
      max_workers_per_wave: ${{ needs.plan.outputs.max_workers_per_wave }}
      max_wave_count: ${{ needs.plan.outputs.max_wave_count }}
      feature: ${{ needs.plan.outputs.feature }}
  # Integration runs inside the wave, after its workers: no workflow_run chain.
  # The integrator serializes itself (group swarm-integrator), so overlapping
  # waves queue their batches instead of racing to push main. It also runs when
  # the wave had no tasks, to pick up pull requests left by earlier waves.
  integrate:
    name: Swarm integrator
    needs: [plan, worker]
    if: always() && needs.plan.result == 'success'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      packages: read
    uses: ./.github/workflows/swarm-integrator.yml
    with:
      ignore_red_main: ${{ inputs.ignore_red_main == true }}
    secrets:
      SWARM_TOKEN: ${{ secrets.SWARM_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_API_KEY_3: ${{ secrets.OPENCODE_API_KEY_3 }}
  # Keep the loop going while work remains, even if another PR is waiting to merge.
  # Never queue another wave while one is already waiting. A task a
  # worker fails three times waits for a person, so this cannot spin forever.
  loop:
    name: Start the next wave
    needs: [plan, worker, integrate]
    if: always() && needs.plan.result == 'success' && needs.integrate.result == 'success' && fromJSON(needs.plan.outputs.count || '0') > 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            tasks/
            tasks
      # The SM allocation job is skipped when no feature is selected, so this
      # artifact may not exist. A no-match pattern is a successful no-op.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: trail-allocation
          path: .agent
      - name: Wait for Delivery on main before advancing
        if: needs.plan.outputs.max_task == 'false'
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
        run: |
          for i in $(seq 1 30); do
            if python3 -c "import sys; sys.path.insert(0,'scripts'); import swarm; print('red' if swarm.main_is_red() else 'green')" | grep -q green; then
              echo "Delivery green on main; advancing."
              exit 0
            fi
            echo "Delivery not green yet; waiting 60s ($i/30)."
            sleep 60
          done
          echo "Delivery not green after 30 minutes; skipping advancement."
          exit 0
      - env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          SWARM_IGNORE_RED_MAIN: ${{ inputs.ignore_red_main }}
          SWARM_MAX_TASK: ${{ needs.plan.outputs.max_task }}
          SWARM_MAX_WORKERS_PER_WAVE: ${{ needs.plan.outputs.max_workers_per_wave }}
          SWARM_MAX_WAVE_COUNT: ${{ needs.plan.outputs.max_wave_count }}
        run: python3 -I scripts/swarm.py continue
