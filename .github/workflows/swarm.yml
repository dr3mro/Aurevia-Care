name: Agent swarm
# The one scheduler. It reads tasks/, splits the open tasks across up to seven
# story worker jobs per wave, and allows one wave at a time per branch. A global
# ledger still caps workers running across branches at 20. Each worker runs the
# agent with no GitHub token
# on its own branch, uploads its commits, and exits (the container is
# discarded, nothing idles). A separate trusted job pushes the branch and opens
# the pull request. The integrator then runs in the same run (full gate before
# main is touched) and the last job starts the next wave while work remains.
# Failed runs on main arrive as repair task files under tasks/, planned first.
on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Story workers per wave; requests above seven are clamped to seven, and fewer are used when fewer tasks are ready (1 to 7, default 7). Fix, debug and repair workers are not limited by it.'
        default: '7'
      repair_run:
        description: Failed run id on main to repair (optional; the plan job finds failing runs itself)
        default: ''
      task:
        description: 'Task id to launch first (optional; ignores the attempt limit, still needs open status, met dependencies and a free scope)'
        default: ''
      now:
        description: 'Reserved and currently inert: a dispatch still queues behind the running wave for this branch. The one-wave-per-branch group cannot be bypassed.'
        type: boolean
        default: false
      ignore_red_main:
        description: 'Safety override: bypass claim, dependency, attempt, scope, in-flight PR, image, budget and worker-cap gates; the one-wave-per-branch group and all verification and merge gates still apply.'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [tasks/**]
  # Safety net: one wave per hour at minute 7 if the event chain ever stalls.
  # An idle plan job costs about one minute.
  schedule:
    - cron: '7 * * * *'
  # A successful prepared-image rebuild makes any wave skipped during the
  # rebuild eligible again, so no task is left unclaimed.
  workflow_run:
    workflows: [Swarm slot images]
    types: [completed]
    branches: [main]
permissions:
  contents: read
# One wave per branch: the group is ref-scoped, so a second dispatch waits
# instead of overlapping. The short plan job is additionally serialized per
# repository so two waves can never claim the same task. The global ledger caps
# workers across branches at 20, while each wave offers at most seven stories.
concurrency:
  group: swarm-${{ github.ref }}
  cancel-in-progress: false
  queue: max
env:
  SWARM_GIT_NAME: ${{ vars.SWARM_GIT_NAME }}
  SWARM_GIT_EMAIL: ${{ vars.SWARM_GIT_EMAIL }}
  SWARM_ENABLED: ${{ vars.SWARM_ENABLED || 'true' }}
  SWARM_SINGLE_TASK: ${{ vars.SWARM_SINGLE_TASK || 'false' }}

jobs:
  select:
    name: Select task (PO + scrum master)
    if: vars.SWARM_SINGLE_TASK == 'true' && vars.SWARM_ENABLED != 'false' && vars.SWARM_LLM_SELECTION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      task_id: ${{ steps.run.outputs.task_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            tasks/
            tasks
      - name: Select one task with OpenCode
        id: run
        env:
          SWARM_MODEL: ${{ vars.SWARM_MODEL || 'opencode-go/hy4-flash-free' }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_1 || secrets.OPENCODE_API_KEY }}
        run: |
          set +e
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')-agent-1:latest"
          echo "Selecting with image $image" >&2
          mkdir -p .agent
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e SWARM_MODEL -e OPENCODE_API_KEY \
            "$image" bash -lc '
              opencode run --auto --agent aurevia-product-owner --model "$SWARM_MODEL" \
                "Read tasks/. Pick exactly one open eligible task (depends done, attempts below 5, free scope). Reply with only the task id on the last line." \
                > .agent/selected-task.txt 2>/tmp/select.log || true
            '
          rc=$?
          echo "docker rc=$rc" >&2
          if [[ -s .agent/selected-task.txt ]]; then
            tid=$(tail -n 1 .agent/selected-task.txt | tr -d "[:space:]")
            echo "Selected task: $tid" >&2
            echo "task_id=$tid" >> "$GITHUB_OUTPUT"
          else
            echo "No selection produced; falling back to deterministic plan." >&2
            echo "task_id=" >> "$GITHUB_OUTPUT"
          fi
  plan:
    name: Plan the wave
    needs: select
    if: always()
    # Planning reads tasks/ and claims tasks, so it never overlaps another
    # plan, whichever wave it belongs to.
    concurrency:
      group: swarm-plan-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      # Reading the slot-image manifests needs packages: read; dispatching one
      # agent-image.yml build when they are absent needs actions: write.
      packages: read
      actions: write
      # The budget gate opens an issue when it pauses the swarm; without this
      # permission the pause was silent.
      issues: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      image_prefix: ${{ steps.image.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # images-ready and plan-workers read .opencode/config/slots.json; the
          # swarm configuration now lives under .opencode/; the former location was removed.
          sparse-checkout: |
            scripts
            .opencode/config
            tasks/
            tasks
      - id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}-agent" >> "$GITHUB_OUTPUT"
      # Safety net: refuse a wave when estimated monthly runner minutes are near
      # the cap. No wave, no worker containers, and an issue for a person.
      - id: kill
        run: |
          if [[ "${SWARM_ENABLED:-true}" == "false" || "${SWARM_ENABLED:-true}" == "0" || "${SWARM_ENABLED:-true}" == "off" || "${SWARM_ENABLED:-true}" == "no" ]]; then
            echo "Swarm kill switch SWARM_ENABLED is off; skipping this wave." >&2
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - id: budget
        if: steps.kill.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
        run: python3 -I scripts/swarm.py budget-gate
      # A red main becomes a repair task here, in the same run that plans the
      # wave, instead of a separate watchdog run per failure. The task goes in
      # task files first, so the planner below picks them up ahead of everything else.
      - id: repair
        if: steps.kill.outputs.enabled == 'true' && (steps.budget.outputs.start == 'true' || inputs.ignore_red_main == true)
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
        run: python3 -I scripts/swarm.py add-repair-task --latest
      # The prepared images are built once by agent-image.yml / swarm-images.yml
      # and reused by every worker. Never start a wave while they are rebuilding
      # or not green. The decision lives in the swarm helper and is testable:
      # a wave is blocked only while a build is queued/in progress or the newest
      # completed build failed. With no run history at all (cleaned or expired),
      # the slot images in GHCR decide instead of an empty `gh run list`.
      - id: images
        if: steps.kill.outputs.enabled == 'true' && (steps.budget.outputs.start == 'true' || inputs.ignore_red_main == true)
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
        run: python3 -I scripts/swarm.py images-ready
      # Marks every task it starts as [-] in the task files and pushes that to main
      # (GITHUB_TOKEN pushes do not trigger another run).
      - id: plan
        if: steps.kill.outputs.enabled == 'true' && (steps.budget.outputs.start == 'true' || inputs.ignore_red_main == true)
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          SWARM_IGNORE_RED_MAIN: ${{ inputs.ignore_red_main }}
          WORKERS: ${{ inputs.workers || '7' }}
          BUDGET_WORKERS: ${{ steps.budget.outputs.workers }}
          REPAIR_RUN: ${{ inputs.repair_run }}
          LAUNCH_TASK: ${{ needs.select.outputs.task_id || inputs.task }}
          IGNORE_RED_MAIN: ${{ inputs.ignore_red_main }}
          IMAGES_READY: ${{ steps.images.outputs.ready }}
          IMAGES_REASON: ${{ steps.images.outputs.reason }}
        run: |
          if [[ "$IMAGES_READY" != true && "${IGNORE_RED_MAIN:-false}" != true ]]; then
            echo "Prepared images not ready: $IMAGES_REASON; skipping this wave." >&2
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -I scripts/swarm.py ensure-labels
          # Never plan more workers than the remaining monthly budget can pay for.
          capacity=20
          if [[ "$BUDGET_WORKERS" =~ ^[0-9]+$ && "${IGNORE_RED_MAIN:-false}" != true ]] && (( BUDGET_WORKERS < capacity )); then
            capacity=$BUDGET_WORKERS
          fi
          # Repairs and fixes are queued before offering spare workers to backlog tasks.
          # Ready merges use the independent serialized integrator instead of waiting for this wave.
          python3 -I scripts/swarm.py pr-flow --no-wave
          if [[ "${SWARM_SINGLE_TASK:-false}" == "true" ]]; then
            WORKERS=1
            echo "Single-task mode: planning at most one worker." >&2
          fi
          plan_args=(--max "$WORKERS" --capacity "$capacity" --repair-run "$REPAIR_RUN" --task "$LAUNCH_TASK")
          if [[ "${IGNORE_RED_MAIN:-false}" == true ]]; then
            plan_args+=(--ignore-red-main)
            echo "Safety override: red main will not block ordinary work in this wave." >&2
          fi
          python3 -I scripts/swarm.py plan-workers "${plan_args[@]}"
  worker:
    # Static name: GitHub renders matrix values in a job name only when the
    # wave has tasks, and a literal ${{ ... }} shows when the matrix is empty.
    name: Swarm worker
    needs: plan
    # count is empty when the budget gate skipped the plan step; fromJSON('')
    # on the matrix would then fail the whole run and trigger a false repair.
    if: needs.plan.result == 'success' && fromJSON(needs.plan.outputs.count || '0') > 0
    strategy:
      # Seven story workers per wave; the global cap across branches stays 20.
      max-parallel: 7
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix || '{"include":[]}') }}
    # A called workflow gets at most the permissions its caller grants.
    permissions:
      contents: write
      pull-requests: write
      packages: read
      actions: write
      # The work job reads earlier findings; the publish job writes hand-off issues.
      issues: write
    uses: ./.github/workflows/swarm-worker.yml
    secrets:
      SWARM_TOKEN: ${{ secrets.SWARM_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_API_KEY_1: ${{ secrets.OPENCODE_API_KEY_1 }}
      OPENCODE_API_KEY_2: ${{ secrets.OPENCODE_API_KEY_2 }}
      OPENCODE_API_KEY_3: ${{ secrets.OPENCODE_API_KEY_3 }}
      OPENCODE_API_KEY_4: ${{ secrets.OPENCODE_API_KEY_4 }}
      OPENCODE_API_KEY_5: ${{ secrets.OPENCODE_API_KEY_5 }}
      OPENCODE_API_KEY_6: ${{ secrets.OPENCODE_API_KEY_6 }}
      OPENCODE_API_KEY_7: ${{ secrets.OPENCODE_API_KEY_7 }}
      OPENCODE_API_KEY_8: ${{ secrets.OPENCODE_API_KEY_8 }}
      OPENCODE_API_KEY_9: ${{ secrets.OPENCODE_API_KEY_9 }}
      OPENCODE_API_KEY_10: ${{ secrets.OPENCODE_API_KEY_10 }}
    with:
      image: ${{ needs.plan.outputs.image_prefix }}-${{ matrix.slot }}:latest
      slot: ${{ format('{0}', matrix.slot) }}
      task: ${{ toJSON(matrix) }}
      ignore_red_main: ${{ inputs.ignore_red_main == true }}
  # Integration runs inside the wave, after its workers: no workflow_run chain.
  # The integrator serializes itself (group swarm-integrator), so overlapping
  # waves queue their batches instead of racing to push main. It also runs when
  # the wave had no tasks, to pick up pull requests left by earlier waves.
  integrate:
    name: Swarm integrator
    needs: [plan, worker]
    if: always() && needs.plan.result == 'success'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      packages: read
    uses: ./.github/workflows/swarm-integrator.yml
    with:
      ignore_red_main: ${{ inputs.ignore_red_main == true }}
    secrets:
      SWARM_TOKEN: ${{ secrets.SWARM_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_API_KEY_3: ${{ secrets.OPENCODE_API_KEY_3 }}
  # Keep the loop going while work remains, even if another PR is waiting to merge.
  # Never queue another wave while one is already waiting. A task a
  # worker fails three times waits for a person, so this cannot spin forever.
  loop:
    name: Start the next wave
    needs: [plan, worker, integrate]
    if: always() && needs.plan.result == 'success' && needs.integrate.result == 'success' && fromJSON(needs.plan.outputs.count || '0') > 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            tasks/
            tasks
      - name: Wait for Delivery on main before advancing
        if: vars.SWARM_SINGLE_TASK == 'true'
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
        run: |
          for i in $(seq 1 30); do
            if python3 -c "import sys; sys.path.insert(0,'scripts'); import swarm; print('red' if swarm.main_is_red() else 'green')" | grep -q green; then
              echo "Delivery green on main; advancing."
              exit 0
            fi
            echo "Delivery not green yet; waiting 60s ($i/30)."
            sleep 60
          done
          echo "Delivery not green after 30 minutes; skipping advancement."
          exit 0
      - env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          SWARM_IGNORE_RED_MAIN: ${{ inputs.ignore_red_main }}
        run: python3 -I scripts/swarm.py continue
