name: Agent swarm
# The one scheduler. It reads TODO.md, splits the open tasks across up to 10
# worker slots per wave (20 workers across overlapping waves), and starts one
# prepared container per slot. Each worker runs the agent with no GitHub token
# on its own branch, uploads its commits, and exits (the container is
# discarded, nothing idles). A separate trusted job pushes the branch and opens
# the pull request. The integrator then runs in the same run (full gate before
# main is touched) and the last job starts the next wave while work remains.
# Failed runs on main arrive as repair tasks in TODO.md, planned first.
on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Worker cap; the wave uses fewer when fewer tasks are ready (1 to 10, default 10)'
        default: '10'
      repair_run:
        description: Failed run id on main to repair (set by the main watchdog)
        default: ''
      now:
        description: 'Start immediately instead of queueing behind the running or queued waves'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [TODO.md]
  # Safety net: one wave per hour at minute 7 if the event chain ever stalls.
  # An idle plan job costs about one minute.
  schedule:
    - cron: '7 * * * *'
  # A successful prepared-image rebuild makes any wave skipped during the
  # rebuild eligible again, so no task is left unclaimed.
  workflow_run:
    workflows: [Swarm slot images]
    types: [completed]
    branches: [main]
permissions:
  contents: read
# Waves may overlap: each run has a group of its own. Only the short plan job
# below is serialized, so two waves can never claim the same task, and the plan
# job caps the workers running across all waves at 20 (scripts/swarm.py).
concurrency:
  group: ${{ format('agent-swarm-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  plan:
    name: Plan the wave
    # Planning reads TODO.md and claims tasks, so it never overlaps another
    # plan, whichever wave it belongs to.
    concurrency:
      group: agent-swarm-plan
      cancel-in-progress: false
      queue: max
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      image_prefix: ${{ steps.image.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/swarm
            TODO.md
      - id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}-agent" >> "$GITHUB_OUTPUT"
      # Safety net: refuse a wave when estimated monthly runner minutes are near
      # the cap. No wave, no worker containers, and an issue for a person.
      - id: budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/swarm.py budget-gate
      # The prepared images are built once by agent-image.yml / swarm-images.yml
      # and reused by every worker. Never start a wave while they are rebuilding
      # or not green: a worker would pull a stale image (for example V1 OpenCode
      # after the base image moved to V2) and fail before doing any work.
      - id: images
        if: steps.budget.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest() { gh run list --workflow "$1" --limit 1 --json status,conclusion -q ".[0].$2"; }
          base_status=$(latest agent-image.yml status)
          slot_status=$(latest swarm-images.yml status)
          slot_conclusion=$(latest swarm-images.yml conclusion)
          ready=true
          if [[ "$base_status" == in_progress || "$base_status" == queued \
             || "$slot_status" == in_progress || "$slot_status" == queued \
             || "$slot_conclusion" != success ]]; then
            ready=false
          fi
          echo "Prepared images not ready (base=$base_status, slot=$slot_status/$slot_conclusion)" >&2
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      # Marks every task it starts as [-] in TODO.md and pushes that to main
      # (GITHUB_TOKEN pushes do not trigger another run).
      - id: plan
        if: steps.budget.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKERS: ${{ inputs.workers || '10' }}
          BUDGET_WORKERS: ${{ steps.budget.outputs.workers }}
          REPAIR_RUN: ${{ inputs.repair_run }}
          IMAGES_READY: ${{ steps.images.outputs.ready }}
        run: |
          if [[ "$IMAGES_READY" != true ]]; then
            echo 'Prepared images are rebuilding or not green; skipping this wave.' >&2
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -I scripts/swarm.py ensure-labels
          # Never plan more workers than the remaining monthly budget can pay for.
          if [[ "$BUDGET_WORKERS" =~ ^[0-9]+$ ]] && (( BUDGET_WORKERS < WORKERS )); then
            echo "Budget allows $BUDGET_WORKERS worker(s); capping the wave." >&2
            WORKERS=$BUDGET_WORKERS
          fi
          python3 -I scripts/swarm.py plan-workers --max "$WORKERS" --repair-run "$REPAIR_RUN"
  worker:
    # Static name: GitHub renders matrix values in a job name only when the
    # wave has tasks, and a literal ${{ ... }} shows when the matrix is empty.
    name: Swarm worker
    needs: plan
    # count is empty when the budget gate skipped the plan step; fromJSON('')
    # on the matrix would then fail the whole run and trigger a false repair.
    if: needs.plan.result == 'success' && fromJSON(needs.plan.outputs.count || '0') > 0
    strategy:
      # Ten slots, ten accounts: workers run side by side and each one
      # publishes its own pull request when it ends (see swarm-worker.yml).
      max-parallel: 10
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # A called workflow gets at most the permissions its caller grants.
    permissions:
      contents: write
      pull-requests: write
      packages: read
      actions: read
    uses: ./.github/workflows/swarm-worker.yml
    secrets: inherit
    with:
      image: ${{ needs.plan.outputs.image_prefix }}-${{ matrix.slot }}:latest
      slot: ${{ format('{0}', matrix.slot) }}
      task: ${{ toJSON(matrix) }}
  # Integration runs inside the wave, after its workers: no workflow_run chain.
  # The integrator serializes itself (group swarm-integrator), so overlapping
  # waves queue their batches instead of racing to push main. It also runs when
  # the wave had no tasks, to pick up pull requests left by earlier waves.
  integrate:
    name: Swarm integrator
    needs: [plan, worker]
    if: always() && needs.plan.result == 'success'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      packages: read
    uses: ./.github/workflows/swarm-integrator.yml
    secrets: inherit
  # Keeps the loop going without a person: when work remains and no pull request
  # is waiting, start another wave (never while one is already waiting). A task a
  # worker fails three times waits for a person, so this cannot spin forever.
  loop:
    name: Start the next wave
    needs: [plan, worker, integrate]
    if: always() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.count || '0') > 0
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            TODO.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/swarm.py continue
