name: Agent swarm
# The orchestrator. It reads TODO.md, splits the open tasks across up to
# 10 worker slots, and starts one prepared container per slot. Each worker runs
# the agent with no GitHub token on its own branch, uploads its commits, and
# exits (the container is discarded, nothing idles). A separate trusted job
# pushes the branch and opens the pull request. The integrator merges later.
on:
  workflow_dispatch:
    inputs:
      workers:
        description: Worker cap; the wave uses fewer when fewer tasks are ready (1 to 10)
        default: '10'
      repair_run:
        description: Failed run id on main to repair (set by the main watchdog)
        default: ''
  push:
    branches: [main]
    paths: [TODO.md]
  # Safety net: one wave per hour at minute 7 if the event chain ever stalls.
  # An idle plan job costs about one minute.
  schedule:
    - cron: '7 * * * *'
  # A successful prepared-image rebuild makes any wave skipped during the
  # rebuild eligible again, so no task is left unclaimed.
  workflow_run:
    workflows: [Swarm slot images]
    types: [completed]
    branches: [main]
permissions:
  contents: read
# Waves queue: one wave plans and starts at a time so a task is never started twice.
concurrency:
  group: agent-swarm
  cancel-in-progress: false
  # Keep every queued wave: a newer queued request must not supersede an older
  # one, and the running wave is never cancelled.
  queue: max
jobs:
  plan:
    name: Plan the wave
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      image_prefix: ${{ steps.image.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/swarm
            TODO.md
      - id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}-agent" >> "$GITHUB_OUTPUT"
      # Safety net: refuse a wave when estimated monthly runner minutes are near
      # the cap. No wave, no worker containers, and an issue for a person.
      - id: budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/swarm.py budget-gate
      # The prepared images are built once by agent-image.yml / swarm-images.yml
      # and reused by every worker. Never start a wave while they are rebuilding
      # or not green: a worker would pull a stale image (for example V1 OpenCode
      # after the base image moved to V2) and fail before doing any work.
      - id: images
        if: steps.budget.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest() { gh run list --workflow "$1" --limit 1 --json status,conclusion -q ".[0].$2"; }
          base_status=$(latest agent-image.yml status)
          slot_status=$(latest swarm-images.yml status)
          slot_conclusion=$(latest swarm-images.yml conclusion)
          ready=true
          if [[ "$base_status" == in_progress || "$base_status" == queued \
             || "$slot_status" == in_progress || "$slot_status" == queued \
             || "$slot_conclusion" != success ]]; then
            ready=false
          fi
          echo "Prepared images not ready (base=$base_status, slot=$slot_status/$slot_conclusion)" >&2
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      # Marks every task it starts as [-] in TODO.md and pushes that to main
      # (GITHUB_TOKEN pushes do not trigger another run).
      - id: plan
        if: steps.budget.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKERS: ${{ inputs.workers || '10' }}
          REPAIR_RUN: ${{ inputs.repair_run }}
          IMAGES_READY: ${{ steps.images.outputs.ready }}
        run: |
          if [[ "$IMAGES_READY" != true ]]; then
            echo 'Prepared images are rebuilding or not green; skipping this wave.' >&2
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -I scripts/swarm.py ensure-labels
          python3 -I scripts/swarm.py plan-workers --max "$WORKERS" --repair-run "$REPAIR_RUN"
  worker:
    name: Worker ${{ matrix.slot }} · ${{ matrix.id }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # Three-hour task budget plus 10 minutes for bundling and artifact upload.
    # The agent gets a cooperative 175-minute deadline in its prompt; the next
    # wave starts automatically after publish via the `next` job.
    timeout-minutes: 185
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # The slot's prepared image: toolchain, dependencies and this slot's own
    # OpenCode setup are already inside, so the job starts working immediately.
    container:
      image: ${{ needs.plan.outputs.image_prefix }}-${{ matrix.slot }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    # Container jobs default to sh (dash), which lacks pipefail.
    defaults:
      run:
        shell: bash
    env:
      MODEL: ${{ matrix.model }}
      MODE: ${{ matrix.kind == 'fix' && 'fix' || 'story' }}
      BRANCH: ${{ matrix.branch }}
      BRANCH_PREFIX: swarm
      SWARM: '1'
      STORY_ID: ${{ matrix.id }}
      STORY_TITLE: ${{ matrix.title }}
      STORY_BODY: ${{ matrix.body }}
      FIX_COMMENT: ${{ matrix.fix }}
      PR_NUMBER: ${{ matrix.number }}
      AGENT_TIMEOUT: 175m
      CHECK_SCRIPT: scripts/quick-check.sh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.kind == 'fix' && matrix.branch || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Work the task (no GitHub token in this step)
        env:
          # Prefer this slot's account, with the team key as a compatibility fallback.
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', matrix.slot)] || secrets.OPENCODE_API_KEY }}
        run: scripts/agent-run.sh implement
      - name: Pack the commits
        if: always()
        run: scripts/agent-run.sh bundle || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: worker-${{ matrix.slot }}
          path: |
            .agent/result
            .agent/commits
            .agent/checks
            .agent/branch
            .agent/pr-notes.md
            .agent/result.bundle
          if-no-files-found: ignore
          retention-days: 1
  # One runner publishes every slot's result; ten matrix runners only added
  # startup time to a step that takes seconds.
  publish:
    name: Publish results
    needs: [plan, worker]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      # Trusted copy of the scripts: the worker job never had a token and cannot
      # alter what runs here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: worker-*
          path: results
      - name: Push the branches and open the pull requests
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          # Set only when SWARM_TOKEN exists: that token can push workflow files.
          SWARM_WORKFLOW_PUSH: ${{ secrets.SWARM_TOKEN != '' }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          status=0
          while read -r task; do
            slot=$(jq -r '.slot' <<< "$task")
            python3 -I scripts/swarm.py publish --task "$task" --dir "results/worker-$slot" || status=1
          done < <(jq -c '.include[]' <<< "$MATRIX")
          exit "$status"
  # Keeps the loop going without a person: when work remains and no pull request
  # is waiting (the integrator starts the next wave after it merges), start
  # another wave. A task a worker fails three times waits for a person, so this
  # cannot spin forever.
  next:
    name: Start the next wave
    needs: [plan, publish]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            TODO.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/swarm.py continue
