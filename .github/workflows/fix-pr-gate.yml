name: Fix PR gate
# Event-driven, not periodic. Any fix PR is validated and handed off automatically.
# It validates that exact fix with the full gate and hands a green PR to the
# integrator; a red fix goes back through swarm.py fail() for one bounded retry.
# There is deliberately no failed-run or cron trigger: a repair exists only
# A fix PR has the autofix label or a FIX- title; nothing else matches.
# The gate runs the pull request's own code, so that job holds no write token; a
# second job on a fresh runner, with the trusted scripts of the default branch, acts
# on the result. Untrusted code cannot reach the token through PATH or env files.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
concurrency:
  group: fix-pr-gate
  cancel-in-progress: false
  queue: max
env:
  SWARM_GIT_NAME: ${{ vars.SWARM_GIT_NAME }}
  SWARM_GIT_EMAIL: ${{ vars.SWARM_GIT_EMAIL }}

jobs:
  validate:
    name: Validate fix PR
    # Only real fix PRs: the autofix label or a FIX- title. A substring test on
    # "fix" also matched story titles such as "fixtures" and started a 45-minute
    # full gate for every one of them.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'autofix')
      || startsWith(github.event.pull_request.title, 'FIX-')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    services:
      postgres:
        image: postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      AUREVIA_PG_ADMIN: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache OWASP NVD data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-tooling-python
      - name: Run the full gate (no GitHub token or NVD key in this job)
        id: gate
        run: |
          set +e
          # PR-controlled code runs here. With no NVD key, check.sh scans the
          # restored cache and still fails on a high-severity CVE.
          bash scripts/check.sh > fix-pr-gate.log 2>&1
          code=$?
          set -e
          tail -80 fix-pr-gate.log
          if [[ "$code" -eq 0 ]]; then echo "passed=true" >> "$GITHUB_OUTPUT"; fi
          echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: fix-pr-gate-log
          path: fix-pr-gate.log
          if-no-files-found: ignore
          retention-days: 3
  handoff:
    name: Hand off the fix PR
    needs: validate
    if: always() && needs.validate.result != 'skipped' && needs.validate.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
      PR: ${{ github.event.pull_request.number }}
      PASSED: ${{ needs.validate.outputs.passed }}
      VALIDATED_SHA: ${{ needs.validate.outputs.head_sha }}
    steps:
      # Trusted copy of the scripts: never the pull request's version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: fix-pr-gate-log
          path: gate
      - name: Hand a green fix to the integrator, send a red one back
        run: |
          # The integrator runs its own full gate before main moves, so a forged
          # pass only queues the pull request; it never merges it.
          if [[ "$PASSED" == true ]]; then
            # The PR can be pushed between validation and handoff. Never act on
            # a pass for a head that is no longer the one that was gated.
            current=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
            if [[ "$current" != "$VALIDATED_SHA" ]]; then
              echo "::error::PR head moved after validation ($current != $VALIDATED_SHA)"
              exit 1
            fi
            # Already-ready is fine; any other failure must stop here, not leave a draft.
            if [[ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" == true ]]; then
              gh pr ready "$PR"
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" \
              -f 'labels[]=swarm' -f 'labels[]=autofix'
            gh workflow run swarm-integrator.yml
          else
            touch gate/fix-pr-gate.log 2>/dev/null || { mkdir -p gate; touch gate/fix-pr-gate.log; }
            python3 -I scripts/swarm.py fail --pr "$PR" \
              --reason "Fix PR gate failed" --log gate/fix-pr-gate.log
            exit 1
          fi
