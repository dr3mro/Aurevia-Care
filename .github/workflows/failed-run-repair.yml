name: Failed run repair
# When a pipeline workflow fails on main, record the failure as a repair task in
# TODO.md and start a wave. The scheduler plans repairs ahead of every other task
# and gives them the whole repository as scope, so nothing else runs while main
# is being repaired. swarm.py add-repair-task keeps it bounded: one open repair at
# a time and at most three per day, then an issue for a person.
on:
  workflow_run:
    workflows:
      - Delivery
      - Heavy verification
      - Agent swarm
      - Agent image
      - Swarm slot images
    types: [completed]
    branches: [main]
permissions:
  contents: write
  pull-requests: read
  issues: write
  actions: write
concurrency:
  group: failed-run-repair
  cancel-in-progress: false
  queue: max
jobs:
  repair:
    name: Add a repair task
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: task
        run: python3 -I scripts/swarm.py add-repair-task --run "$RUN_ID"
      # The TODO.md commit is [skip ci], so start the wave explicitly.
      - name: Start a wave for the repair
        if: steps.task.outputs.added == 'true'
        run: gh workflow run swarm.yml --ref main
