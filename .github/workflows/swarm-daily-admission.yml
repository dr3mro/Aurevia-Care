name: Swarm daily admission
on:
  workflow_call:
    outputs:
      ready:
        description: Whether this optional daily workflow can run
        value: ${{ jobs.admit.outputs.ready }}
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.priority.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'schedule'
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            tasks
      - id: priority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            python3 -I scripts/swarm.py daily-admission
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
