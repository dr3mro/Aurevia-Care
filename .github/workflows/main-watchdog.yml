name: Main watchdog
# Watches the Delivery workflow on main. When it fails, starts one repair worker
# with the failing log. The fix goes through the same branch, integration check
# and merge path as any other swarm work. It stops after three tries in 24 hours
# and opens an issue for a person. The fix is a pull request labeled autofix that
# is never merged automatically: you review it and press merge.
on:
  workflow_run:
    workflows: [Delivery, Heavy verification]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: main-watchdog
  cancel-in-progress: false
jobs:
  repair:
    name: Start a repair
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/swarm
      - name: Decide whether to repair
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 -I scripts/swarm.py repair-gate --run "$RUN_ID"
      - name: Start one repair worker with the failing log
        if: steps.gate.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh workflow run swarm.yml -f workers=1 -f repair_run="$RUN_ID"
