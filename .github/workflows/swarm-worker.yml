# One swarm worker and its publish step. swarm.yml calls this once per planned
# task, so every worker publishes its own pull request the moment it finishes
# instead of waiting for the slowest worker of the wave. The agent job has no
# write token; the publish job runs the trusted scripts from the default branch
# on a fresh runner and is the only one that pushes.
name: Swarm worker run
on:
  workflow_call:
    inputs:
      image: {type: string, required: true}
      slot: {type: string, required: true}
      # The planned task as JSON (the matrix entry): model, kind, id, title,
      # body, branch, number and fix. One input keeps the interface small.
      task: {type: string, required: true}
permissions:
  contents: read
# Not the swarm's own group: the calling wave already holds it, so reusing it
# here would wait on itself forever. One group per worker slot of this run.
concurrency:
  group: swarm-worker-${{ github.run_id }}-${{ inputs.slot }}
  cancel-in-progress: false
env:
  SWARM_GIT_NAME: ${{ vars.SWARM_GIT_NAME }}
  SWARM_GIT_EMAIL: ${{ vars.SWARM_GIT_EMAIL }}

jobs:
  work:
    name: Work the task
    runs-on: ubuntu-latest
    # Four work segments of 45/45/45/40 minutes (175 of agent work), up to three
    # 20-minute syncs with main, the 35-minute final merge, and bundling.
    timeout-minutes: 300
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      issues: read
    # Container jobs default to sh (dash), which lacks pipefail.
    defaults:
      run:
        shell: bash
    env:
      MODEL: ${{ fromJSON(inputs.task).model }}
      MODE: ${{ fromJSON(inputs.task).kind == 'fix' && 'fix' || 'story' }}
      BRANCH: ${{ fromJSON(inputs.task).branch }}
      BRANCH_PREFIX: swarm
      SWARM: '1'
      STORY_ID: ${{ fromJSON(inputs.task).id }}
      STORY_TITLE: ${{ fromJSON(inputs.task).title }}
      STORY_BODY: ${{ fromJSON(inputs.task).body }}
      FIX_COMMENT: ${{ fromJSON(inputs.task).fix }}
      PR_NUMBER: ${{ fromJSON(inputs.task).number }}
      CHECK_SCRIPT: scripts/worker-check.sh
      SMARTCLINIC_PG_ADMIN: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(inputs.task).kind == 'fix' && fromJSON(inputs.task).branch || github.event.repository.default_branch }}
          # Full history so the branch can be merged with main after the work.
          fetch-depth: 0
          persist-credentials: false
      # The read-only token is used here, before the agent has touched the
      # workspace. The main branch can move during the run, so the merge step
      # later fetches nothing; a newer main is picked up by the integrator.
      - name: Fetch main
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/agent-run.sh fetch-main || true
      # A fix worker starts on an existing branch that may be behind main: bring main in first, with the
      # agent resolving any conflicts, so the work starts from the current code.
      - name: Merge main into the branch (start, no GitHub token in this step)
        if: fromJSON(inputs.task).kind == 'fix'
        env:
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_ATTEMPTS: '5'
          AGENT_TIMEOUT: 15m
          SYNC_ONLY: '1'
        timeout-minutes: 20
        run: |
          # Older PR branches may lack the conflict skill loader.
          runner=$(mktemp)
          trap 'rm -f "$runner"' EXIT
          git show "origin/$BASE_BRANCH:scripts/agent-run.sh" > "$runner"
          bash "$runner" merge-main || true
      # What earlier workers and the integrator wrote about this task in trusted
      # issues. Read here with the read-only token; the agent only sees the file.
      - name: Read earlier findings about this task
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          SWARM_ISSUES: ${{ vars.SWARM_ISSUES }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          context=$(mktemp)
          trap 'rm -f "$context"' EXIT
          git show "origin/$BASE_BRANCH:scripts/swarm.py" > "$context"
          python3 -I "$context" issue-context --task "$STORY_ID" || true
          if [[ "$MODE" == fix && "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            python3 -I "$context" pr-context --pr "$PR_NUMBER" || true
          fi
      # PostgreSQL ships in the agent image; the integration suites need it.
      - name: Start PostgreSQL for the worker checks
        # Tolerates an older image without PostgreSQL (the first waves after the
        # image changes); worker-check.sh then skips the database part loudly.
        run: |
          if command -v start-postgres >/dev/null; then
            start-postgres
          else
            echo "start-postgres missing - older agent image" >&2
          fi
      - id: s1
        name: Work the task, segment 1 of 4 (no GitHub token in this step)
        env:
          # Prefer this slot's account, with the team key as a compatibility fallback.
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SEGMENT: '1'
          SEGMENTS: '4'
          AGENT_TIMEOUT: 45m
        run: scripts/agent-run.sh implement
      # Bring main into the branch between segments so the work never drifts far
      # from it. The only token step after the agent has run is this inline fetch:
      # it runs no workspace script, ignores repository hooks and sends the
      # read-only token to github.com only.
      - name: Fetch main (after segment 1)
        if: steps.s1.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            fetch -q "https://github.com/$GITHUB_REPOSITORY" \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" || true
      - name: Merge main into the branch (after segment 1, no GitHub token in this step)
        if: steps.s1.outputs.more == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_ATTEMPTS: '5'
          AGENT_TIMEOUT: 15m
          SYNC_ONLY: '1'
        timeout-minutes: 20
        run: scripts/agent-run.sh merge-main
      - id: s2
        name: Work the task, segment 2 of 4 (no GitHub token in this step)
        if: steps.s1.outputs.more == 'true'
        env:
          # Prefer this slot's account, with the team key as a compatibility fallback.
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SEGMENT: '2'
          SEGMENTS: '4'
          AGENT_TIMEOUT: 45m
        run: scripts/agent-run.sh implement
      # Bring main into the branch between segments so the work never drifts far
      # from it. The only token step after the agent has run is this inline fetch:
      # it runs no workspace script, ignores repository hooks and sends the
      # read-only token to github.com only.
      - name: Fetch main (after segment 2)
        if: steps.s2.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            fetch -q "https://github.com/$GITHUB_REPOSITORY" \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" || true
      - name: Merge main into the branch (after segment 2, no GitHub token in this step)
        if: steps.s2.outputs.more == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_ATTEMPTS: '5'
          AGENT_TIMEOUT: 15m
          SYNC_ONLY: '1'
        timeout-minutes: 20
        run: scripts/agent-run.sh merge-main
      - id: s3
        name: Work the task, segment 3 of 4 (no GitHub token in this step)
        if: steps.s2.outputs.more == 'true'
        env:
          # Prefer this slot's account, with the team key as a compatibility fallback.
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SEGMENT: '3'
          SEGMENTS: '4'
          AGENT_TIMEOUT: 45m
        run: scripts/agent-run.sh implement
      # Bring main into the branch between segments so the work never drifts far
      # from it. The only token step after the agent has run is this inline fetch:
      # it runs no workspace script, ignores repository hooks and sends the
      # read-only token to github.com only.
      - name: Fetch main (after segment 3)
        if: steps.s3.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            fetch -q "https://github.com/$GITHUB_REPOSITORY" \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" || true
      - name: Merge main into the branch (after segment 3, no GitHub token in this step)
        if: steps.s3.outputs.more == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_ATTEMPTS: '5'
          AGENT_TIMEOUT: 15m
          SYNC_ONLY: '1'
        timeout-minutes: 20
        run: scripts/agent-run.sh merge-main
      - id: s4
        name: Work the task, segment 4 of 4 (no GitHub token in this step)
        if: steps.s3.outputs.more == 'true'
        env:
          # Prefer this slot's account, with the team key as a compatibility fallback.
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SEGMENT: '4'
          SEGMENTS: '4'
          AGENT_TIMEOUT: 40m
        run: scripts/agent-run.sh implement
      # Last look at main right before publishing (same hardened inline fetch).
      - name: Fetch main (final)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            fetch -q "https://github.com/$GITHUB_REPOSITORY" \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" || true
      - name: Merge main and fix conflicts (no GitHub token in this step)
        if: always()
        env:
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_ATTEMPTS: '5'
          AGENT_TIMEOUT: 20m
        timeout-minutes: 35
        run: scripts/agent-run.sh merge-main
      - name: Pack the commits
        if: always()
        run: scripts/agent-run.sh bundle || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: worker-${{ inputs.slot }}
          path: |
            .agent/result
            .agent/commits
            .agent/checks
            .agent/branch
            .agent/merge
            .agent/check.log
            .agent/publish-notes.md
            .agent/result.bundle
          if-no-files-found: ignore
          # Kept for a week so a blocked or failed publish never loses the work.
          retention-days: 7
  publish:
    name: Publish result
    needs: work
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      # Trusted copy of the scripts: the work job never had a token and cannot
      # alter what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Always the default branch, even when the wave was dispatched on
          # another ref: this job holds the write token.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: worker-${{ inputs.slot }}
          path: results/worker-${{ inputs.slot }}
      - name: Warn when SWARM_TOKEN is not configured
        env:
          HAS_SWARM_TOKEN: ${{ secrets.SWARM_TOKEN != '' }}
        run: |
          if [[ "$HAS_SWARM_TOKEN" != "true" ]]; then
            echo "::warning title=SWARM_TOKEN missing::Falling back to the job token: it cannot push workflow files or open pull requests that trigger other workflows."
          fi
      - name: Push the branch and open the pull request
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          # Issues and labels use the job's own token, which always has issues: write.
          GH_ISSUES_TOKEN: ${{ github.token }}
          # Set only when SWARM_TOKEN exists: that token can push workflow files.
          SWARM_WORKFLOW_PUSH: ${{ secrets.SWARM_TOKEN != '' }}
          TASK: ${{ inputs.task }}
          SLOT: ${{ inputs.slot }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -I scripts/swarm.py publish --task "$TASK" --dir "results/worker-$SLOT"
      # This worker's slot is free: start the next wave now instead of waiting for the slowest
      # worker of this wave. The planner still applies the worker cap, scopes and the budget.
      - name: Fill the free slot
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          TASK_ID: ${{ fromJSON(inputs.task).id }}
        run: python3 -I scripts/swarm.py top-up --id "$TASK_ID"
