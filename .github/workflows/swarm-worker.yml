# One swarm worker and its publish step. swarm.yml calls this once per planned
# task, so every worker publishes its own pull request the moment it finishes
# instead of waiting for the slowest worker of the wave. The agent job has no
# write token; the publish job runs the trusted scripts from the default branch
# on a fresh runner and is the only one that pushes.
name: Swarm worker run
on:
  workflow_call:
    inputs:
      image: {type: string, required: true}
      slot: {type: string, required: true}
      # The planned task as JSON (the matrix entry): slot, kind, id, title,
      # body, branch, number and fix. One input keeps the interface small.
      # No model travels in this input; the router selects the model at run time.
      task: {type: string, required: true}
    secrets:
      GITHUB_TOKEN:
        required: false
      SWARM_TOKEN:
        required: false
      OPENCODE_API_KEY:
        required: false
      OPENCODE_API_KEY_1:
        required: false
      OPENCODE_API_KEY_2:
        required: false
      OPENCODE_API_KEY_3:
        required: false
      OPENCODE_API_KEY_4:
        required: false
      OPENCODE_API_KEY_5:
        required: false
      OPENCODE_API_KEY_6:
        required: false
      OPENCODE_API_KEY_7:
        required: false
      OPENCODE_API_KEY_8:
        required: false
      OPENCODE_API_KEY_9:
        required: false
      OPENCODE_API_KEY_10:
        required: false
permissions:
  contents: read
# Not the swarm's own group: the calling wave already holds it, so reusing it
# here would wait on itself forever. One group per task of this run.
concurrency:
  group: swarm-worker-${{ github.run_id }}-${{ inputs.slot }}
  cancel-in-progress: false
env:
  SWARM_GIT_NAME: ${{ vars.SWARM_GIT_NAME }}
  SWARM_GIT_EMAIL: ${{ vars.SWARM_GIT_EMAIL }}

jobs:
  work:
    name: Work the task
    runs-on: ubuntu-latest
    # Four work segments of 45/45/45/40 minutes (175 of agent work), up to three
    # 20-minute syncs with main, the 35-minute final merge, and bundling.
    timeout-minutes: 300
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      issues: read
    # Container jobs default to sh (dash), which lacks pipefail.
    defaults:
      run:
        shell: bash
    env:
      # Only these repository variables select a model, through the centralized router.
      SWARM_MODEL: ${{ vars.SWARM_MODEL }}
      SWARM_FORCE_MODEL: ${{ vars.SWARM_FORCE_MODEL }}
      MODE: ${{ fromJSON(inputs.task).kind == 'fix' && 'fix' || 'story' }}
      BRANCH: ${{ fromJSON(inputs.task).branch }}
      BRANCH_PREFIX: swarm
      SWARM: '1'
      STORY_ID: ${{ fromJSON(inputs.task).id }}
      STORY_TITLE: ${{ fromJSON(inputs.task).title }}
      STORY_BODY: ${{ fromJSON(inputs.task).body }}
      FIX_COMMENT: ${{ fromJSON(inputs.task).fix }}
      PR_NUMBER: ${{ fromJSON(inputs.task).number }}
      CHECK_SCRIPT: scripts/worker-check.sh
      AUREVIA_PG_ADMIN: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(inputs.task).kind == 'fix' && fromJSON(inputs.task).branch || github.event.repository.default_branch }}
          # Full history so the branch can be merged with main after the work.
          fetch-depth: 0
          persist-credentials: false
      # The read-only token is used here, before the agent has touched the
      # workspace. The main branch can move during the run, so the merge step
      # later fetches nothing; a newer main is picked up by the integrator.
      - name: Fetch main
        env:
          # This job is read-only; the job token is enough. Never expose the
          # write-capable swarm PAT to a script from the checked-out branch.
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          runner=$(mktemp)
          trap 'rm -f "$runner"' EXIT
          git -c safe.directory='*' show "origin/$BASE_BRANCH:scripts/agent-run.sh" > "$runner"
          bash "$runner" fetch-main || true
      # A fix worker starts on an existing branch that may be behind main: bring main in first, with the
      # agent resolving any conflicts, so the work starts from the current code.
      - name: Merge main into the branch (start, no GitHub token in this step)
        if: fromJSON(inputs.task).kind == 'fix'
        env:
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_ATTEMPTS: '5'
          AGENT_TIMEOUT: 15m
          SYNC_ONLY: '1'
        timeout-minutes: 20
        run: |
          # Older PR branches may lack the conflict skill loader.
          runner=$(mktemp)
          trap 'rm -f "$runner"' EXIT
          git -c safe.directory='*' show "origin/$BASE_BRANCH:scripts/agent-run.sh" > "$runner"
          bash "$runner" merge-main || true
      # What earlier workers and the integrator wrote about this task in trusted
      # issues. Read here with the read-only token; the agent only sees the file.
      - name: Read earlier findings about this task
        env:
          GH_TOKEN: ${{ github.token }}
          SWARM_ISSUES: ${{ vars.SWARM_ISSUES }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          context=$(mktemp)
          trap 'rm -f "$context"' EXIT
          git -c safe.directory='*' show "origin/$BASE_BRANCH:scripts/swarm.py" > "$context"
          python3 -I "$context" issue-context --task "$STORY_ID" || true
          if [[ "$MODE" == fix && "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            python3 -I "$context" pr-context --pr "$PR_NUMBER" || true
          fi
      # PostgreSQL ships in the agent image; the integration suites need it.
      - name: Start PostgreSQL for the worker checks
        # Tolerates an older image without PostgreSQL (the first waves after the
        # image changes); worker-check.sh then skips the database part loudly.
        run: |
          if command -v start-postgres >/dev/null; then
            start-postgres
          else
            echo "start-postgres missing - older agent image" >&2
          fi
      - name: Preflight checks (fail fast before the agent runs)
        run: |
          set -e
          python3 -I scripts/check-wiring.py
          # A clean checkout has no compiler; install each app’s locked dev tools.
          if [[ -d apps/staff-web ]]; then (cd apps/staff-web && npm ci --include=dev --no-audit --no-fund && npm run typecheck); fi
          if [[ -d apps/patient-mobile ]]; then (cd apps/patient-mobile && npm ci --include=dev --no-audit --no-fund && npm run typecheck); fi
      - id: s1
        name: Work the task, segment 1 of 4 (no GitHub token in this step)
        env:
          # Prefer this slot's account, with the team key as a compatibility fallback.
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SEGMENT: '1'
          SEGMENTS: '4'
          AGENT_TIMEOUT: 45m
        run: scripts/agent-run.sh implement
      # Bring main into the branch between segments so the work never drifts far
      # from it. The only token step after the agent has run is this inline fetch:
      # it runs no workspace script, ignores repository hooks and sends the
      # read-only token to github.com only. Inside the container the host-mounted
      # workspace has a different owner, so the fetch marks it safe explicitly.
      - name: Fetch main (after segment 1)
        if: steps.s1.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c safe.directory='*' -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            fetch -q "https://github.com/$GITHUB_REPOSITORY" \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" || true
      - name: Merge main into the branch (after segment 1, no GitHub token in this step)
        if: steps.s1.outputs.more == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_ATTEMPTS: '5'
          AGENT_TIMEOUT: 15m
          SYNC_ONLY: '1'
        timeout-minutes: 20
        run: scripts/agent-run.sh merge-main
      - id: s2
        name: Work the task, segment 2 of 4 (no GitHub token in this step)
        if: steps.s1.outputs.more == 'true'
        env:
          # Prefer this slot's account, with the team key as a compatibility fallback.
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SEGMENT: '2'
          SEGMENTS: '4'
          AGENT_TIMEOUT: 45m
        run: scripts/agent-run.sh implement
      # Bring main into the branch between segments so the work never drifts far
      # from it. The only token step after the agent has run is this inline fetch:
      # it runs no workspace script, ignores repository hooks and sends the
      # read-only token to github.com only. Inside the container the host-mounted
      # workspace has a different owner, so the fetch marks it safe explicitly.
      - name: Fetch main (after segment 2)
        if: steps.s2.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c safe.directory='*' -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            fetch -q "https://github.com/$GITHUB_REPOSITORY" \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" || true
      - name: Merge main into the branch (after segment 2, no GitHub token in this step)
        if: steps.s2.outputs.more == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_ATTEMPTS: '5'
          AGENT_TIMEOUT: 15m
          SYNC_ONLY: '1'
        timeout-minutes: 20
        run: scripts/agent-run.sh merge-main
      - id: s3
        name: Work the task, segment 3 of 4 (no GitHub token in this step)
        if: steps.s2.outputs.more == 'true'
        env:
          # Prefer this slot's account, with the team key as a compatibility fallback.
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SEGMENT: '3'
          SEGMENTS: '4'
          AGENT_TIMEOUT: 45m
        run: scripts/agent-run.sh implement
      # Bring main into the branch between segments so the work never drifts far
      # from it. The only token step after the agent has run is this inline fetch:
      # it runs no workspace script, ignores repository hooks and sends the
      # read-only token to github.com only. Inside the container the host-mounted
      # workspace has a different owner, so the fetch marks it safe explicitly.
      - name: Fetch main (after segment 3)
        if: steps.s3.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c safe.directory='*' -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            fetch -q "https://github.com/$GITHUB_REPOSITORY" \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" || true
      - name: Merge main into the branch (after segment 3, no GitHub token in this step)
        if: steps.s3.outputs.more == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_ATTEMPTS: '5'
          AGENT_TIMEOUT: 15m
          SYNC_ONLY: '1'
        timeout-minutes: 20
        run: scripts/agent-run.sh merge-main
      - id: s4
        name: Work the task, segment 4 of 4 (no GitHub token in this step)
        if: steps.s3.outputs.more == 'true'
        env:
          # Prefer this slot's account, with the team key as a compatibility fallback.
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SEGMENT: '4'
          SEGMENTS: '4'
          AGENT_TIMEOUT: 40m
        run: scripts/agent-run.sh implement
      # Last look at main right before publishing (same hardened inline fetch).
      - name: Fetch main (final)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c safe.directory='*' -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            fetch -q "https://github.com/$GITHUB_REPOSITORY" \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" || true
      - name: Merge main and fix conflicts (no GitHub token in this step)
        if: always()
        env:
          OPENCODE_API_KEY: ${{ secrets[format('OPENCODE_API_KEY_{0}', inputs.slot)] || secrets.OPENCODE_API_KEY }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_ATTEMPTS: '5'
          AGENT_TIMEOUT: 20m
        timeout-minutes: 35
        run: scripts/agent-run.sh merge-main
      - name: Sync generated OpenAPI client
        if: always()
        run: scripts/agent-run.sh sync-generated
      - name: Pack the commits
        if: always()
        run: scripts/agent-run.sh bundle || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: worker-${{ fromJSON(inputs.task).id }}
          path: |
            .agent/result
            .agent/commits
            .agent/checks
            .agent/branch
            .agent/merge
            .agent/check.log
            .agent/publish-notes.md
            .agent/result.bundle
          if-no-files-found: ignore
          # Kept for a week so a blocked or failed publish never loses the work.
          retention-days: 7
  # Candidate code is validated here with NO secrets and read-only contents.
  # Publication below runs trusted scripts only and refuses a bundle that is
  # not the exact commit this job validated.
  validate:
    name: Validate candidate commit (no secrets)
    needs: work
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
      sha: ${{ steps.candidate.outputs.sha }}
    services:
      postgres:
        image: postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      AUREVIA_PG_ADMIN: postgres
    steps:
      # Trusted scripts come from the default branch; candidate source comes
      # only from the bundle produced by the work job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: ./.github/actions/setup-tooling-python
      - name: Download the worker bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: worker-${{ fromJSON(inputs.task).id }}
          path: results/worker-${{ fromJSON(inputs.task).id }}
      - name: Resolve the candidate commit and put trusted scripts in its tree
        id: candidate
        env:
          TASK_ID: ${{ fromJSON(inputs.task).id }}
        run: |
          set -euo pipefail
          bundle="results/worker-$TASK_ID/result.bundle"
          if [[ ! -s "$bundle" ]]; then echo "no candidate bundle to validate" >&2; exit 1; fi
          git fetch -q "$bundle" HEAD:refs/remotes/candidate
          sha=$(git rev-parse refs/remotes/candidate)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git worktree add -q --detach candidate-tree "$sha"
          cp -R scripts/. candidate-tree/scripts/
      - name: Run the trusted gate on the candidate tree
        id: gate
        run: |
          set +e
          (cd candidate-tree && bash scripts/worker-check.sh) > validate.log 2>&1
          code=$?
          set -e
          tail -80 validate.log
          if [[ "$code" -eq 0 ]]; then echo "passed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: validate-${{ fromJSON(inputs.task).id }}
          path: validate.log
          if-no-files-found: ignore
          retention-days: 3
  publish:
    name: Publish result
    needs: [work, validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    # This job holds credentials but runs NO candidate code. It consumes only
    # the SHA that the isolated validate job proved.
    env:
      VALIDATED_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      # Trusted copy of the scripts: the work job never had a token and cannot
      # alter what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Always the default branch, even when the wave was dispatched on
          # another ref: this job holds the write token.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: worker-${{ fromJSON(inputs.task).id }}
          path: results/worker-${{ fromJSON(inputs.task).id }}
      - name: Refuse to publish an unvalidated candidate
        env:
          PASSED: ${{ needs.validate.outputs.passed }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          if [[ "$PASSED" != "true" || -z "$SHA" ]]; then
            echo "::error::Candidate was not validated; no branch or pull request will be published."
            echo "PUBLISH=skip" >> "$GITHUB_ENV"
          fi
      - name: Re-check that the bundle is exactly the validated commit
        if: env.PUBLISH != 'skip'
        env:
          TASK_ID: ${{ fromJSON(inputs.task).id }}
        run: |
          set -euo pipefail
          bundle="results/worker-$TASK_ID/result.bundle"
          test -s "$bundle"
          git fetch -q "$bundle" HEAD:refs/remotes/validated-candidate
          actual=$(git rev-parse refs/remotes/validated-candidate)
          [[ "$actual" == "$VALIDATED_SHA" ]] || {
            echo "bundle $actual is not the validated commit $VALIDATED_SHA" >&2; exit 1; }
      - name: Warn when SWARM_TOKEN is not configured
        env:
          HAS_SWARM_TOKEN: ${{ secrets.SWARM_TOKEN != '' }}
        run: |
          if [[ "$HAS_SWARM_TOKEN" != "true" ]]; then
            echo "::warning title=SWARM_TOKEN missing::Falling back to the job token: it cannot push workflow files or open pull requests that trigger other workflows."
          fi
      - name: Push the branch and open the pull request
        if: env.PUBLISH != 'skip'
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          # Issues and labels use the job's own token, which always has issues: write.
          GH_ISSUES_TOKEN: ${{ github.token }}
          # Set only when SWARM_TOKEN exists: that token can push workflow files.
          SWARM_WORKFLOW_PUSH: ${{ secrets.SWARM_TOKEN != '' }}
          TASK: ${{ inputs.task }}
          TASK_ID: ${{ fromJSON(inputs.task).id }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -I scripts/swarm.py publish --task "$TASK" --dir "results/worker-$TASK_ID"
      # This worker's slot is free: start the next wave now instead of waiting for the slowest
      # worker of this wave. The planner still applies the worker cap, scopes and the budget.
      - name: Fill the free slot
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ fromJSON(inputs.task).id }}
        run: python3 -I scripts/swarm.py top-up --id "$TASK_ID"
