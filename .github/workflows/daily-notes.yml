name: Daily notes
# Shortly after midnight New York the worker notes of each finished day are reconciled
# by a read-only worker into one dated report under docs/pr/reports/. The originals are
# zipped to docs/pr/notes/archive/<day>.zip and removed; new problems become issues for the
# issue monitor; edits to instruction documents go out as a draft pull request for review.
# 05:10 UTC is 00:10 New York in winter and 01:10 in summer: always after the day closed.
# Notes of a day that arrive later (a pull request merged after midnight) are appended to
# that day's file by the next run.
on:
  schedule:
    - cron: '10 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-notes
  cancel-in-progress: false
  queue: max
  # Keep every waiting run: without this a newer trigger replaces a waiting one,
  # so a failure event or the 2 AM run could be dropped.
env:
  SWARM_GIT_NAME: ${{ vars.SWARM_GIT_NAME }}
  SWARM_GIT_EMAIL: ${{ vars.SWARM_GIT_EMAIL }}
  SWARM_ISSUES: ${{ vars.SWARM_ISSUES }}

jobs:
  admission:
    uses: ./.github/workflows/swarm-daily-admission.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
  collect:
    needs: admission
    name: Collect the notes
    if: vars.SWARM_NOTES != 'off' && needs.admission.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      act: ${{ steps.pick.outputs.act }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-agent-2:latest" >> "$GITHUB_OUTPUT"
      - id: pick
        run: python3 -I scripts/swarm.py notes-collect --out notes-in
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.pick.outputs.act == 'true'
        with:
          name: notes-in
          path: notes-in
          retention-days: 1
  reconcile:
    name: Reconcile with a worker
    needs: collect
    if: needs.collect.outputs.act == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ${{ needs.collect.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      # Only these repository variables select a model, through the centralized router.
      SWARM_MODEL: ${{ vars.SWARM_MODEL }}
      SWARM_FORCE_MODEL: ${{ vars.SWARM_FORCE_MODEL }}
      SWARM: '1'
      AGENT_TIMEOUT: 75m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: notes-in
          path: notes-in
      - name: Reconcile (no GitHub token in this step)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_2 || secrets.OPENCODE_API_KEY }}
        run: scripts/agent-run.sh reconcile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: notes-reconciled
          path: .agent/reconcile
          if-no-files-found: ignore
          retention-days: 1
  publish:
    name: Store, archive and report
    needs: [collect, reconcile]
    if: always() && needs.collect.outputs.act == 'true' && needs.reconcile.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # Outside the checkout: the docs check scans every Markdown file under the repository,
      # tracked or not, so agent-written files here would fail the rules pull request's check.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: notes-in
          path: ${{ runner.temp }}/notes-in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: notes-reconciled
          path: ${{ runner.temp }}/reconciled
      - name: Store the daily files, archive the originals, open issues
        env:
          # The job's own token: push to main, issues and the draft rules pull request.
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
          IN: ${{ runner.temp }}/notes-in
          OUT: ${{ runner.temp }}/reconciled
        run: python3 -I scripts/swarm.py notes-publish --collected "$IN" --reconciled "$OUT"
